# Continuous integration gate. This workflow NEVER deploys, requires NO secrets,
# and contacts NO Azure / database / Service Bus / Entra / registry. It only runs
# the hermetic checks used locally (typecheck, lint, test, build, and the static
# deployment + container/CI + migration + supply-chain + provenance + Azure smoke
# + release-runbook baseline validators). DB-gated integration tests stay skipped
# by default (RUN_DB_TESTS is not set).
# Migrations are validated statically only — they are NEVER applied against a
# database in CI, and no images are built, pushed, scanned, or signed here.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (hermetic; DB integration skipped)
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate deployment baseline
        run: npm run deploy:check

      - name: Validate container/CI baseline
        run: npm run container:check

      - name: Validate migration baseline
        run: npm run migrations:check

      - name: Validate supply-chain baseline
        run: npm run supply-chain:check

      - name: Validate provenance baseline
        run: npm run provenance:check

      - name: Validate Azure smoke baseline
        run: npm run smoke:check

      - name: Validate release runbook baseline
        run: npm run release:check

      - name: Validate synthetic tenant lifecycle baseline
        run: npm run synthetic:check

      - name: Validate organization registry baseline
        run: npm run organization:check

      - name: Validate participant registry baseline
        run: npm run participant:check

      - name: Validate facility registry baseline
        run: npm run facility:check

  button-frontend:
    # The Button representative frontend is a standalone package (apps/button) with its own
    # lockfile and toolchain. This job is fully hermetic: it uses the injected mock transport
    # for browser tests and contacts NO backend, database, or Azure service.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/button
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/button/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (component / route / a11y)
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end (browser, mock transport)
        run: npm run e2e

  postgres-integration:
    # Governed PostgreSQL integration suite. This job runs the SAME repository against an ephemeral
    # PostgreSQL service so the real migrations, forced RLS, advisory locking, transactional
    # atomicity, concurrency, workflow, financial, submission, standing, and projection behaviour are
    # exercised end-to-end — NOT statically. It requires NO Azure / production secrets and uses only
    # synthetic credentials and data. It does NOT replace the hermetic `validate` job; it runs
    # alongside it and keeps the DB-gated suite continuously green.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_pw
          POSTGRES_DB: house_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d house_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Synthetic, non-production values only. Connection strings are ASSEMBLED at runtime (below)
      # so no inline URL credential literal ever appears in this file.
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: house_test
      CI_ADMIN_USER: postgres
      CI_ADMIN_PASSWORD: postgres_ci_pw
      CI_APP_USER: house_app
      CI_APP_PASSWORD: house_app_ci_pw
      RUN_DB_TESTS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for PostgreSQL readiness
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$CI_ADMIN_USER" >/dev/null 2>&1; then
              echo "PostgreSQL is ready."
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i)"
            sleep 2
          done
          echo "PostgreSQL did not become ready in time." >&2
          exit 1
        env:
          PGPASSWORD: ${{ env.CI_ADMIN_PASSWORD }}

      - name: Assemble synthetic connection strings
        run: |
          admin_creds="${CI_ADMIN_USER}:${CI_ADMIN_PASSWORD}"
          app_creds="${CI_APP_USER}:${CI_APP_PASSWORD}"
          target="@${PGHOST}:${PGPORT}/${PGDATABASE}"
          echo "MIGRATE_DATABASE_URL=postgres://${admin_creds}${target}" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgres://${app_creds}${target}" >> "$GITHUB_ENV"

      - name: Bootstrap database (create least-privilege role + apply migrations from clean)
        run: npm run ci:db:bootstrap

      - name: Governed PostgreSQL integration suite (RUN_DB_TESTS=1)
        run: npm run test:integration


