# Production deployment TEMPLATE — DISABLED-BY-DEFAULT, MANUAL-ONLY.
#
# This workflow is a documented contract for how a future production deployment
# would run. It does NOT deploy until a human:
#   1. configures a real container registry + Azure environment, and
#   2. manually dispatches it AND types the confirmation phrase "DEPLOY".
#
# It triggers ONLY on workflow_dispatch (never on push or pull_request). Every
# job is guarded by an explicit confirmation input, so an accidental dispatch
# without the phrase is a no-op. All credentials are GitHub-environment secrets
# referenced as ${{ secrets.* }} — NO secret values are committed here.
#
# Replace the placeholder repository/registry/resource names and configure the
# "production" environment (with required reviewers) before enabling.
name: production-deploy-template

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm a real production deployment.'
        required: true
        default: ''
        type: string
      image_tag:
        description: 'Container image tag to deploy.'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # Hard guard: this job is skipped unless the operator types the exact phrase.
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    # Use a protected GitHub environment with required reviewers before enabling.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Azure login (OIDC; no static credentials)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Infrastructure what-if (preview only; no changes applied)
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az deployment group what-if \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --template-file infra/azure/main.bicep \
              --parameters infra/azure/parameters/prod.example.bicepparam

      # Verify image scan / SBOM artifacts exist for the tag being deployed BEFORE
      # any image is built or rolled out. Placeholder: wire this to your artifact
      # store / scan gate (e.g. confirm an SBOM and a passing CRITICAL/HIGH scan
      # for the candidate tag). This step must NOT be bypassed when promoting a
      # release; it deliberately runs ahead of the build/migrate/rollout steps.
      - name: Verify image scan / SBOM artifacts (placeholder gate)
        run: |
          echo "Verify SBOM + vulnerability scan artifacts for tag ${{ inputs.image_tag }}."
          echo "See docs/architecture/image-sbom-vulnerability-baseline.md for the gate contract."

      # Preview pending schema migrations BEFORE any change is applied. Read-only:
      # plan never writes to the database. MIGRATE_DATABASE_URL is the privileged
      # migration role, distinct from the restricted application DATABASE_URL.
      - name: Migration plan (preview; no schema changes)
        env:
          MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: npm run migrations:plan

      - name: Build and publish images to the registry
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az acr build \
              --registry "${{ vars.AZURE_CONTAINER_REGISTRY }}" \
              --image "the-house-api:${{ inputs.image_tag }}" \
              --target api \
              --file Dockerfile .
            az acr build \
              --registry "${{ vars.AZURE_CONTAINER_REGISTRY }}" \
              --image "the-house-worker:${{ inputs.image_tag }}" \
              --target worker \
              --file Dockerfile .

      # Apply migrations as an explicit release step AFTER images are built but
      # BEFORE the new containers roll out, so the schema is ready when the new
      # app/worker revisions start. Migrations are never run from app startup.
      - name: Migration apply (ordered, forward-only)
        env:
          MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: npm run migrations:apply

      - name: Roll out the API container app
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name "${{ vars.AZURE_API_CONTAINER_APP }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --image "${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/the-house-api:${{ inputs.image_tag }}"

      - name: Roll out the worker container app
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name "${{ vars.AZURE_WORKER_CONTAINER_APP }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --image "${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/the-house-worker:${{ inputs.image_tag }}"
