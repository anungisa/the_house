# Container image build validation. This workflow proves the API and worker
# images BUILD from the committed Dockerfile. It NEVER pushes images to a
# registry, requires NO secrets, and contacts NO Azure. Pushing to a registry is
# the responsibility of the manual production-deploy-template workflow once a real
# registry and credentials are configured.
name: container-build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, worker]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }} image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          load: false
          tags: the-house-${{ matrix.target }}:ci
