# Documentation governance gate for the Volume 0 through Volume 8 corpora.
#
# This workflow runs ONLY when the governance corpus or its toolchain changes
# (docs/program/** or the package manifest/lockfile). It NEVER deploys, requires
# NO secrets, and contacts NO external services. It runs the executable governance
# controls (schema conformance, identifier uniqueness, cross-reference integrity,
# ratification integrity, authority integrity, exception expiry, frozen-package
# amendment integrity, and downstream-routing integrity) and publishes the
# NON-AUTHORITATIVE control reports.
#
# It does not require any named-person approval, does not infer independent
# assurance, and does not block unrelated runtime work (path-scoped).
name: governance

on:
  push:
    branches: [main]
    paths:
      - 'docs/program/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/governance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/program/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/governance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Volume 0 governance controls
        run: npm run governance:check

      - name: Run Volume 1 governance controls
        run: npm run governance:check:v1

      - name: Run Volume 2 governance controls
        run: npm run governance:check:v2

      - name: Run Volume 3 governance controls
        run: npm run governance:check:v3

      - name: Run Volume 4 governance controls
        run: npm run governance:check:v4

      - name: Run Volume 5 governance controls
        run: npm run governance:check:v5

      - name: Run Volume 6 governance controls
        run: npm run governance:check:v6

      - name: Run Volume 7 governance controls
        run: npm run governance:check:v7

      - name: Run Volume 8 governance controls
        run: npm run governance:check:v8

      - name: Upload non-authoritative control report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-control-report
          path: docs/program/volume-0/generated/governance-control-report.md
          if-no-files-found: warn

      - name: Upload Volume 1 non-authoritative control report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-control-report-v1
          path: docs/program/volume-1/generated/governance-control-report.md
          if-no-files-found: warn

      - name: Upload Volume 2 non-authoritative control report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-control-report-v2
          path: docs/program/volume-2/generated/governance-control-report.md

      - name: Upload Volume 3 non-authoritative control report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-control-report-v3
          path: docs/program/volume-3/generated/governance-control-report.md
          if-no-files-found: warn

      - name: Upload Volume 4 non-authoritative control report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-control-report-v4
          path: docs/program/volume-4/generated/governance-control-report.md
          if-no-files-found: warn

      - name: Upload Volume 5 non-authoritative control report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-control-report-v5
          path: docs/program/volume-5/generated/governance-control-report.md
          if-no-files-found: warn

      - name: Upload Volume 6 non-authoritative control report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-control-report-v6
          path: docs/program/volume-6/generated/governance-control-report.md
          if-no-files-found: warn

      - name: Upload Volume 7 non-authoritative control report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-control-report-v7
          path: docs/program/volume-7/generated/governance-control-report.md
          if-no-files-found: warn

      - name: Upload Volume 8 non-authoritative control report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-control-report-v8
          path: docs/program/volume-8/generated/governance-control-report.md
          if-no-files-found: warn
