    statement: "Document and evidence storage will support provenance metadata and sensitivity-based access control."
    owner: Aubert Nungisa (Accountable Program Authority)
    impact: "Evidence binding and restricted-evidence access depend on this assumption."
    disposition: "Assumed; to be confirmed with evidence at a later gate."
