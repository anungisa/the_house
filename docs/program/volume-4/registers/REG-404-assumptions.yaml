    title: Transitional manual boundaries acceptable in early operation
    statement: "Where an automated boundary is not yet available, a governed manual process is acceptable during transition."
    owner: Aubert Nungisa (Accountable Program Authority)
    impact: "Continuity posture depends on transitional manual boundaries."
    disposition: "Assumed per inherited continuity model; to be confirmed."
