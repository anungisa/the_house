records:
  # ---- ARCH: architecture principles (V4-01) ----
  - id: ARCH-V4-001
    kind: ARCH
    title: Modular monolith by default
    statement: "The platform is a modular monolith with explicit bounded contexts independent of deployment topology; microservices are not a default."
    authority: Shared
    architecture_status: TARGET_DEFINED
    traces_to: [V3-01, V2-01]
    chapter_ref: V4-01
    authorizes_implementation: false
  - id: ARCH-V4-002
    kind: ARCH
    title: House owns governed authority; Button is a projection surface
    statement: "The House owns governed state and lifecycle; the Button requests actions and renders projections and owns no governed authority."
    authority: House
    architecture_status: TARGET_DEFINED
    traces_to: [V3-02]
    chapter_ref: V4-01
    authorizes_implementation: false
  - id: ARCH-V4-003
    kind: ARCH
    title: External systems retain only assigned authority
    statement: "External systems retain only the authority assigned by the inherited operating model; the platform does not silently absorb it."
    authority: External
    architecture_status: TARGET_DEFINED
    traces_to: [V3-02]
    chapter_ref: V4-02
    authorizes_implementation: false
  - id: ARCH-V4-004
    kind: ARCH
    title: Resource, role, and jurisdiction-aware default-deny authorization
    statement: "Authorization is computed from resource, role, and jurisdiction and defaults to deny."
    authority: House
    architecture_status: TARGET_DEFINED
    traces_to: [V3-02]
    chapter_ref: V4-05
    authorizes_implementation: false
  - id: ARCH-V4-005
    kind: ARCH
    title: Defence in depth and fail-closed
    statement: "The platform applies defence in depth and fails closed on missing authority, tenant, jurisdiction, or configuration."
    authority: House
    architecture_status: TARGET_DEFINED
    traces_to: [V3-02]
    chapter_ref: V4-05
    authorizes_implementation: false
  - id: ARCH-V4-006
    kind: ARCH
    title: Evidence provenance and governed decision binding
    statement: "Evidence has provenance and governed decisions bind actor, authority, evidence, rationale, and policy version."
    authority: House
    architecture_status: TARGET_DEFINED
    traces_to: [V3-03]
    chapter_ref: V4-06
    authorizes_implementation: false
  - id: ARCH-V4-007
    kind: ARCH
    title: Versioned policy and requirements
    statement: "Policy and requirements are versioned and governed effects resolve to a policy version."
    authority: House
    architecture_status: TARGET_DEFINED
    traces_to: [V3-03]
    chapter_ref: V4-06
    authorizes_implementation: false
  - id: ARCH-V4-008
    kind: ARCH
    title: Idempotent commands and exactly-once effect
    statement: "Commands are idempotent and governed effects are exactly-once through transactional state control."
    authority: House
    architecture_status: TARGET_DEFINED
    traces_to: [V3-04]
    chapter_ref: V4-04
    authorizes_implementation: false
  - id: ARCH-V4-009
    kind: ARCH
    title: Transactional outbox; side effects after commit
    statement: "External side effects are dispatched through a transactional outbox only after commit."
    authority: House
    architecture_status: TARGET_DEFINED
    traces_to: [V3-04]
    chapter_ref: V4-07
    authorizes_implementation: false
  - id: ARCH-V4-010
    kind: ARCH
    title: Auditable workflow; derived projections
    statement: "Workflow is auditable and reconstructable and projections are derived, never authoritative."
    authority: House
    architecture_status: TARGET_DEFINED
    traces_to: [V3-03]
    chapter_ref: V4-06
    authorizes_implementation: false
  - id: ARCH-V4-011
    kind: ARCH
    title: Explicit versioned integration contracts
    statement: "Integration contracts are explicit, versioned, and owned."
    authority: Shared
    architecture_status: TARGET_DEFINED
    traces_to: [V3-05]
    chapter_ref: V4-07
    authorizes_implementation: false
  - id: ARCH-V4-012
    kind: ARCH
    title: Observable and recoverable operations
    statement: "Operations are observable and recoverable, including outbox publishing."
    authority: House
    architecture_status: TARGET_DEFINED
    traces_to: [V3-06]
    chapter_ref: V4-08
    authorizes_implementation: false
  - id: ARCH-V4-013
    kind: ARCH
    title: Bilingual-equivalent and accessible experiences
    statement: "Experiences are bilingual-equivalent and accessible."
    authority: Button
    architecture_status: TARGET_DEFINED
    traces_to: [V3-07]
    chapter_ref: V4-01
    authorizes_implementation: false
  - id: ARCH-V4-014
    kind: ARCH
    title: Privacy minimization and classification
    statement: "Personal data is minimized and classified across governed concepts and contracts."
    authority: House
    architecture_status: TARGET_DEFINED
    traces_to: [V3-07]
    chapter_ref: V4-06
    authorizes_implementation: false
  - id: ARCH-V4-015
    kind: ARCH
    title: Infrastructure as code and secure supply chain
    statement: "Infrastructure is defined as code and the supply chain is secured."
    authority: Shared
    architecture_status: TARGET_DEFINED
    traces_to: [V3-06]
    chapter_ref: V4-08
    authorizes_implementation: false

