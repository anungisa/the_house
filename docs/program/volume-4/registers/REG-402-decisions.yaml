  - id: ADR-V4-028
    class: D1
    title: Software-supply-chain provenance and controlled infrastructure
    decision: "Artifacts are reproducible and traceable to source with retained dependency and image provenance, infrastructure is expressed as controlled infrastructure-as-code, and promotion is not business authorization."
