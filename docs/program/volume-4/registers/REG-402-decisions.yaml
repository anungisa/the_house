    context: "External semantics differ from House semantics and must not silently substitute authority."
    options: ["Anti-corruption boundary", "Direct external coupling", "External authority absorption"]
    selected_posture: "Anti-corruption boundaries with inbound validation before governed state changes."
    rationale: "Boundaries preserve House authority and prevent silent corruption."
    constraints: ["Inbound validated before governed state changes"]
    consequences: ["Integration authentication and reconciliation verification required"]
    risks: ["External contract semantics unresolved"]
