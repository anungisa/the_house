  - id: ADR-V4-026
    class: D1
    title: Production and test composition separation
    decision: "Production composition is explicitly separated from test composition and production-required services cannot resolve to test doubles or no-ops."
    context: "A production composition with test doubles or no-ops gives false readiness."
    options: ["Explicit composition separation", "Shared composition", "Environment-conditional doubles"]
    selected_posture: "Distinct production composition that fails closed on a missing required dependency."
    rationale: "Separation prevents production reliance on test substitutes."
    constraints: ["Production-required services cannot be no-ops or test doubles"]
    consequences: ["Production composition verification required"]
    risks: ["Deployment platform and topology unresolved"]
