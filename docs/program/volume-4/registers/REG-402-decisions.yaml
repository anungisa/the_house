register_id: REG-402
name: Volume 4 Architecture Decision Register
status: RATIFIED
version: 1.2.0
records:
  - id: ADR-V4-001
    class: D1
    title: Modular monolith as the default deployment posture
    decision: "Adopt a modular monolith with explicit bounded contexts as the default; permit later extraction only through a governed decision."
    context: "The platform must preserve governed authority and transactional consistency while remaining maintainable; microservices add distributed-consistency cost without a justifying requirement."
    options: ["Modular monolith", "Microservices from the outset", "Ungoverned monolith"]
    selected_posture: "Modular monolith with independent bounded contexts and seams for later extraction."
    rationale: "Transactional governed effects and outbox consistency are simplest and safest within a single deployment; bounded contexts keep the design modular."
    constraints: ["No microservices without a governed decision", "Bounded contexts independent of deployment"]
    consequences: ["Single composition root", "Cross-context consistency via events and outbox"]
    risks: ["Module coupling if boundaries erode"]
    evidence_refs: [ARCH-V4-001, V3-01]
    validation_status: SPECIFIED
    supersession_rule: "Superseded only by a governed architecture decision at a later gate."
    evidence_label: AUTHOR-VERIFIED
    chapter_ref: V4-01
    authorizes_implementation: false
  - id: ADR-V4-002
    class: D1
    title: House and Button authority separation
    decision: "The House owns governed authority and lifecycle; the Button is a guided experience and projection surface with no governed authority."
    context: "Experience layers must not become a second source of governed truth."
    options: ["House-owns-authority with Button projection", "Shared authority", "Button-owns-workflow"]
    selected_posture: "House-owns-authority; Button requests and projects."
    rationale: "A single governed authority preserves auditability and prevents divergent state."
    constraints: ["Button never mutates governed state directly"]
    consequences: ["All governed effects flow through House application services"]
    risks: ["Experience latency if projections lag"]
    evidence_refs: [ARCH-V4-002, V3-02]
    validation_status: SPECIFIED
    supersession_rule: "Superseded only by a governed architecture decision at a later gate."
    evidence_label: AUTHOR-VERIFIED
    chapter_ref: V4-02
    authorizes_implementation: false
  - id: ADR-V4-003
    class: D1
    title: Default-deny, resource- and jurisdiction-aware authorization
    decision: "Authorization is computed from identity, role, resource, jurisdiction, assignment, action, lifecycle state, evidence sensitivity, delegation, and policy version, and defaults to deny."
    context: "Governed actions span jurisdictions and assignments; over-broad authorization risks cross-jurisdiction leakage."
    options: ["Default-deny resource-aware", "Role-only authorization", "Coarse tenant checks"]
    selected_posture: "Default-deny with full authorization input set."
    rationale: "Fail-closed authorization protects governed authority and privacy."
    constraints: ["Fail closed on missing inputs"]
    consequences: ["Authorization requires resource and jurisdiction context"]
    risks: ["Complexity of the authorization input set"]
    evidence_refs: [ARCH-V4-004, CTRL-V4-002, V3-02]
    validation_status: SPECIFIED
    supersession_rule: "Superseded only by a governed architecture decision at a later gate."
    evidence_label: AUTHOR-VERIFIED
    chapter_ref: V4-05
    authorizes_implementation: false
  - id: ADR-V4-004
    class: D1
    title: Transactional outbox for external side effects
    decision: "External side effects are enqueued in a transactional outbox committed with the governed state change and dispatched only after commit."
    context: "External effects inside governed transactions risk partial failure and duplicate effects."
    options: ["Transactional outbox", "Direct synchronous calls", "Best-effort async"]
    selected_posture: "Transactional outbox with post-commit dispatch and true full jitter retries."
    rationale: "Atomic state-and-intent capture with retry-safe dispatch preserves consistency."
    constraints: ["No external side effects inside governed transactions", "No Service Bus sessions in v1"]
    consequences: ["Outbox processor is a required runtime component"]
    risks: ["Outbox backlog under sustained publisher failure"]
    evidence_refs: [ARCH-V4-009, CTRL-V4-004, CTRL-V4-007, V3-04]
    validation_status: SPECIFIED
    supersession_rule: "Superseded only by a governed architecture decision at a later gate."
    evidence_label: AUTHOR-VERIFIED
    chapter_ref: V4-07
    authorizes_implementation: false
  - id: ADR-V4-005
    class: D1
    title: Idempotent, exactly-once activation effect
    decision: "Activation produces one authoritative effect through transactional state control and an idempotency key; this is exactly-once effect, not exactly-once delivery."
    context: "Retries and duplicate requests must not double-activate."
    options: ["Idempotent transactional effect", "At-least-once with dedupe downstream", "Distributed exactly-once delivery"]
    selected_posture: "Idempotent command plus transactional state transition."
    rationale: "A single authoritative effect is achievable and verifiable without distributed delivery guarantees."
    constraints: ["Idempotency key on state-changing commands"]
    consequences: ["Activation recovery re-drives without duplicating the effect"]
    risks: ["Misinterpretation as universal exactly-once delivery"]
    evidence_refs: [ARCH-V4-008, CTRL-V4-010, V3-04]
    validation_status: SPECIFIED
    supersession_rule: "Superseded only by a governed architecture decision at a later gate."
    evidence_label: AUTHOR-VERIFIED
    chapter_ref: V4-04
    authorizes_implementation: false
  - id: ADR-V4-006
    class: D1
    title: PostgreSQL as the governed state store
    decision: "Governed state is stored in PostgreSQL and validated against PostgreSQL; no in-memory or alternate substitute stands in for governed persistence."
    context: "Governed transactional consistency and RLS-style isolation require a real relational store validated as used."
    options: ["PostgreSQL validated as used", "Abstract store with substitute validation", "Document store"]
    selected_posture: "PostgreSQL, validated against PostgreSQL."
    rationale: "Transactional outbox and tenant isolation depend on relational guarantees exercised in tests."
    constraints: ["Deployment-path tests exercise PostgreSQL"]
    consequences: ["Test harness requires a real PostgreSQL"]
    risks: ["Provider lock beyond assigned constraints"]
    evidence_refs: [DEP-V4-009, CTRL-V4-004, V3-06]
    validation_status: SPECIFIED
    supersession_rule: "Superseded only by a governed architecture decision at a later gate."
    evidence_label: AUTHOR-VERIFIED
    chapter_ref: V4-08
    authorizes_implementation: false
  - id: ADR-V4-007
    class: D2
    title: Fail-on-missing production composition
    decision: "The production composition root fails when a required dependency is absent; no production no-op integration substitutes for a required governed effect."
    context: "Silent no-op integrations can mask unconfigured required effects in production."
    options: ["Fail-on-missing composition", "No-op fallbacks", "Warn-and-continue"]
    selected_posture: "Fail-closed composition with deployment-path tests over the real composition root."
    rationale: "Required governed effects must never be silently skipped."
    constraints: ["No no-op stand-ins for required effects"]
    consequences: ["Configuration completeness is enforced at startup"]
    risks: ["Startup failures when configuration is incomplete"]
    evidence_refs: [CTRL-V4-007, CTRL-V4-008, V3-06]
    validation_status: SPECIFIED
    supersession_rule: "Superseded only by a governed architecture decision at a later gate."
    evidence_label: AUTHOR-VERIFIED
    chapter_ref: V4-08
    authorizes_implementation: false
  - id: ADR-V4-008
    class: D2
    title: Fitness functions specified, not implemented, in Package 1
    decision: "Package 1 specifies fitness functions and their invariants; it does not implement them and claims no executing verification."
    context: "Architectural conformance will be verified continuously downstream; premature implementation claims would be fabricated evidence."
    options: ["Specify-only in Package 1", "Implement in Package 1", "Defer specification"]
    selected_posture: "Specify fitness functions and invariants; implementation authorized downstream."
    rationale: "Specification is achievable now with author-verified evidence; implementation requires downstream authorization."
    constraints: ["implemented: false for all fitness functions"]
    consequences: ["Verification model distinguishes specification from implementation"]
    risks: ["Specified invariants not yet enforced"]
    evidence_refs: [V4-09, ARCH-V4-010]
    validation_status: SPECIFIED
    supersession_rule: "Superseded only by a governed architecture decision at a later gate."
    evidence_label: AUTHOR-VERIFIED
    chapter_ref: V4-09
    authorizes_implementation: false
  # ==== Package 2: affiliation domain and application architecture ====
  - id: ADR-V4-009
    class: D1
    title: Layered application architecture with inward dependency direction
    decision: "Adopt a layered architecture (transport -> application services -> domain modules -> ports; infrastructure adapters implement ports) with a single inward dependency direction."
    context: "Governed authority and invariants must be protected from transport and infrastructure concerns."
    options: ["Layered inward dependency", "Anemic transactional script", "Framework-coupled domain"]
    selected_posture: "Domain modules depend on nothing outward; adapters depend inward on application and domain contracts."
    rationale: "Inward dependency keeps domain policy independent of transports, databases, and vendors and enables verification of dependency direction."
    constraints: ["Domain modules do not depend on transports, databases, vendor SDKs, or deployment frameworks"]
    consequences: ["Composition only at the composition root", "Ports define testing seams"]
    risks: ["Boundary erosion under delivery pressure"]
    evidence_refs: [ARCH-V4-016, V4-10]
    validation_status: SPECIFIED
    supersession_rule: "Superseded only by a governed architecture decision at a later gate."
    evidence_label: AUTHOR-VERIFIED
    chapter_ref: V4-10
    authorizes_implementation: false
  - id: ADR-V4-010
    class: D1
    title: Domain-module ownership of concepts and invariants
    decision: "Each affiliation domain concept has exactly one owning module that guarantees its invariants; cross-module access occurs only through controlled contracts."
    context: "Bounded contexts must encapsulate their model to keep invariants enforceable."
    options: ["Single owning module per concept", "Shared mutable model", "Cross-module reach-in"]
    selected_posture: "One owning module per concept with encapsulated internal model."
    rationale: "Single ownership makes invariants enforceable and boundaries verifiable."
    constraints: ["No cross-module access to internal state"]
    consequences: ["Public surfaces are the invariant boundary"]
    risks: ["Boundary disputes require governed resolution"]
    evidence_refs: [MOD-V4-017, MOD-V4-018, V4-11]
    validation_status: SPECIFIED
    supersession_rule: "Superseded only by a governed architecture decision at a later gate."
    evidence_label: AUTHOR-VERIFIED
    chapter_ref: V4-11
    authorizes_implementation: false
  - id: ADR-V4-011
    class: D1
    title: Authoritative lifecycle owned by the House
    decision: "The affiliation lifecycle and its governed transitions are owned by the House lifecycle and decision module; recommendation, decision, reconciliation, and activation are distinct effects."
    context: "Approval must not imply reconciliation or activation, and correction must not substitute for a decision."
    options: ["Single owning lifecycle module", "Distributed lifecycle authority", "Status-flag mutation"]
    selected_posture: "One governed lifecycle authority with explicitly separated effects."
    rationale: "Separation prevents conflation of approval, reconciliation, and activation."
    constraints: ["No direct status mutation outside governed transitions"]
    consequences: ["Distinct states between approval and activation"]
    risks: ["Vocabulary refinement in detailed design"]
    evidence_refs: [MOD-V4-022, V4-13]
    validation_status: SPECIFIED
    supersession_rule: "Superseded only by a governed architecture decision at a later gate."
    evidence_label: AUTHOR-VERIFIED
    chapter_ref: V4-13
    authorizes_implementation: false
  - id: ADR-V4-012
    class: D1
    title: Resource-aware default-deny authorization
    decision: "Authorization is computed from identity, role, resource, jurisdiction, assignment, action, lifecycle state, and evidence sensitivity, and defaults to deny."
    context: "Role alone is insufficient; unresolved scope or jurisdiction must fail closed."
    options: ["Resource-aware default-deny", "Role-only authorization", "Default-permit"]
    selected_posture: "Policy decision point over resolved resource facts; enforcement at application-service boundaries."
    rationale: "Resource-aware evaluation prevents privilege leakage across organizations and jurisdictions."
    constraints: ["Resource loaded before authorization", "Fail closed on unresolved scope or jurisdiction"]
    consequences: ["Decision logging for audit"]
    risks: ["Identity-provider claim availability"]
    evidence_refs: [MOD-V4-025, CTRL-V4-011, V4-15]
    validation_status: SPECIFIED
    supersession_rule: "Superseded only by a governed architecture decision at a later gate."
    evidence_label: AUTHOR-VERIFIED
    chapter_ref: V4-15
    authorizes_implementation: false
  - id: ADR-V4-013
    class: D1
    title: Evidence binding and derived completeness
    decision: "Evidence binds to case, applicable requirement version, actor, provenance, and evidence version; completeness is derived from authoritative facts, not a stored flag."
    context: "Completeness flags drift from underlying facts; evidence must be bound to a governed context."
    options: ["Bind + derive", "Stored completeness flag", "Unbound evidence"]
    selected_posture: "Bound evidence with derived completeness."
    rationale: "Binding and derivation keep completeness consistent with authoritative requirement, response, and evidence facts."
    constraints: ["No independent completeness flag"]
    consequences: ["Requirement-version changes re-evaluate binding"]
    risks: ["Evidence-storage contract unresolved"]
    evidence_refs: [CTRL-V4-013, CTRL-V4-014, V4-12]
    validation_status: SPECIFIED
    supersession_rule: "Superseded only by a governed architecture decision at a later gate."
    evidence_label: AUTHOR-VERIFIED
    chapter_ref: V4-12
    authorizes_implementation: false
  - id: ADR-V4-014
    class: D1
    title: Atomic transaction, audit, and outbox consistency
    decision: "Governed state change, audit records, and required outbox records commit atomically in one unit of work; publication occurs after commit."
    context: "Partial commits and lost audit or outbox records break governed consistency."
    options: ["Atomic state+audit+outbox", "Separate transactions", "Best-effort audit"]
    selected_posture: "Single unit of work for state, audit, and required outbox records."
    rationale: "Atomicity guarantees that governed effects and their evidence are never partially recorded."
    constraints: ["No partial commit of state without audit and required outbox records"]
    consequences: ["Publication retried after commit"]
    risks: ["PostgreSQL concurrency posture unresolved"]
    evidence_refs: [CTRL-V4-015, V4-16]
    validation_status: SPECIFIED
    supersession_rule: "Superseded only by a governed architecture decision at a later gate."
    evidence_label: AUTHOR-VERIFIED
    chapter_ref: V4-16
    authorizes_implementation: false
  - id: ADR-V4-015
    class: D1
    title: Authoritative exactly-once activation with at-least-once messaging
    decision: "The authoritative activation effect is committed once via transactional state control and idempotent command execution; external messages remain at-least-once unless a stronger contract is independently established."
    context: "Distributed exactly-once delivery cannot be claimed; the authoritative effect must still be exactly once."
    options: ["Authoritative once + at-least-once messaging", "Claimed distributed exactly-once", "At-most-once"]
    selected_posture: "Idempotent authoritative activation; at-least-once external delivery tolerated by idempotent consumers."
    rationale: "This gives a correct authoritative effect without an unsupported delivery guarantee."
    constraints: ["Duplicate activation commands cannot create duplicate authoritative effects"]
    consequences: ["Consumers must be idempotent"]
    risks: ["Consumer idempotency required downstream"]
    evidence_refs: [CTRL-V4-016, V4-16]
    validation_status: SPECIFIED
    supersession_rule: "Superseded only by a governed architecture decision at a later gate."
    evidence_label: AUTHOR-VERIFIED
    chapter_ref: V4-16
    authorizes_implementation: false
  - id: ADR-V4-016
    class: D1
    title: Fail-closed composition and dependency completeness
    decision: "Production composition fails when a required dependency is absent; required integrations have no production no-op implementation."
    context: "Silent no-op dependencies hide missing integrations and break governed effects."
    options: ["Fail-closed composition", "Silent no-op fallback", "Optional-by-default"]
    selected_posture: "Required dependencies must be present; only explicitly optional capabilities may be absent."
    rationale: "Fail-closed composition prevents production from running without a required governed integration."
    constraints: ["No production no-op for required integrations", "Config consumed by actual entry points"]
    consequences: ["Dependency-completeness verification required"]
    risks: ["Deployment topology unresolved"]
    evidence_refs: [CTRL-V4-017, CTRL-V4-018, V4-17]
    validation_status: SPECIFIED
    supersession_rule: "Superseded only by a governed architecture decision at a later gate."
    evidence_label: AUTHOR-VERIFIED
    chapter_ref: V4-17
    authorizes_implementation: false
  - id: ADR-V4-017
    class: D1
    title: Projections derive from authoritative state and never define authority
    decision: "Projections (read models) are derived from authoritative state and outbox records; projection failure never redefines governed state, and replay is observable and controlled."
    context: "Read models must not become a competing source of governed truth."
    options: ["Derived projections", "Authoritative read model", "Uncontrolled replay"]
    selected_posture: "Projections rebuilt from authoritative state; authority remains with governed records."
    rationale: "Derivation keeps a single source of governed truth and allows safe rebuild."
    constraints: ["Projection failure does not change governed state"]
    consequences: ["Projection rebuild and controlled replay required"]
    risks: ["Projection recovery ownership unresolved"]
    evidence_refs: [ADR-V4-014, V4-16]
    validation_status: SPECIFIED
    supersession_rule: "Superseded only by a governed architecture decision at a later gate."
    evidence_label: AUTHOR-VERIFIED
    chapter_ref: V4-16
    authorizes_implementation: false
  - id: ADR-V4-018
    class: D1
    title: Configuration governance with provenance and validation
    decision: "Configuration has provenance, validation, effective scope, and audit, is consumed by actual entry points, and fails closed when incomplete."
    context: "Unconsumed or unvalidated configuration gives false assurance of a working dependency."
    options: ["Governed configuration", "Ad hoc environment variables", "Unvalidated config"]
    selected_posture: "Governed configuration consumed by real entry points with validation and audit."
    rationale: "Governed configuration prevents silent misconfiguration and false readiness."
    constraints: ["Incomplete production configuration fails closed"]
    consequences: ["Configuration-completeness verification required"]
    risks: ["Numeric quality targets unresolved"]
    evidence_refs: [CTRL-V4-018, V4-17]
    validation_status: SPECIFIED
    supersession_rule: "Superseded only by a governed architecture decision at a later gate."
    evidence_label: AUTHOR-VERIFIED
    chapter_ref: V4-17
    authorizes_implementation: false
  # ==== Package 3: data, integration, security, and platform decisions ====
  - id: ADR-V4-019
    class: D1
    title: PostgreSQL as authoritative relational persistence
    decision: "Governed authoritative state is persisted in PostgreSQL; object and binary content resides in a separate evidence-storage service."
    context: "Governed state requires transactional relational integrity distinct from binary content storage."
    options: ["PostgreSQL relational persistence", "Document store", "Mixed authoritative stores"]
    selected_posture: "PostgreSQL holds authoritative governed records; storage service holds content only."
    rationale: "Relational integrity, transactions, and constraints support governed invariants."
    constraints: ["No DDL, schema, or database provisioned in Package 3"]
    consequences: ["PostgreSQL behavioural verification required"]
    risks: ["Data volumes and isolation behaviour unresolved"]
    evidence_refs: [ARCH-V4-020, DEP-V4-017, V4-20]
    validation_status: SPECIFIED
    supersession_rule: "Superseded only by a governed architecture decision at a later gate."
    evidence_label: AUTHOR-VERIFIED
    chapter_ref: V4-20
    authorizes_implementation: false
  - id: ADR-V4-020
    class: D1
    title: Invariant allocation between database and domain logic
    decision: "Each invariant is allocated to database enforcement, domain-logic enforcement, or both; structural invariants favour the database and governed lifecycle invariants remain in domain logic."
    context: "Invariants must be enforced at the right layer to prevent silent corruption."
    options: ["Database-only", "Domain-only", "Explicit allocation"]
    selected_posture: "Explicit per-invariant allocation across database and domain logic."
    rationale: "Layer-appropriate enforcement balances integrity and governed authority."
    constraints: ["No constraints or migrations authored in Package 3"]
    consequences: ["Concurrency and integrity verification required"]
    risks: ["PostgreSQL isolation behaviour unresolved"]
    evidence_refs: [CTRL-V4-020, CTRL-V4-021, V4-20]
    validation_status: SPECIFIED
    supersession_rule: "Superseded only by a governed architecture decision at a later gate."
