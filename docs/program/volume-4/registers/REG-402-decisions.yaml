  - id: ADR-V4-022
    class: D1
    title: Projections are non-authoritative and rebuildable
    decision: "Read models, projections, search indexes, and reports are derived and rebuildable from authoritative state or retained events and never authoritative."
    context: "Derived views must not become competing sources of governed truth."
    options: ["Rebuildable projections", "Authoritative read models", "Uncontrolled indexes"]
    selected_posture: "Projections rebuildable and non-authoritative with detectable staleness."
    rationale: "Rebuildability preserves a single source of governed truth."
    constraints: ["Projection failure does not change governed state"]
    consequences: ["Projection rebuild verification required"]
    risks: ["Search technology and staleness tolerance unresolved"]
