  - id: ADR-V4-027
    class: D1
    title: Evidence-gated backup, restore, and recovery claims
    decision: "Backup, restore, continuity, and recovery claims require evidence; only accepted business recovery supported by verified restore evidence supports a recovery claim."
    context: "Configuration alone does not prove recoverability."
    options: ["Evidence-gated recovery", "Configuration-claimed recovery", "Unverified backup claims"]
    selected_posture: "Distinguish backup configured, restore verified, and business recovery accepted."
    rationale: "Evidence gating prevents false recovery assurance."
    constraints: ["No RTO, RPO, or availability figure asserted"]
    consequences: ["Verified restore evidence required downstream"]
    risks: ["RTO, RPO, and restore acceptance unresolved"]
