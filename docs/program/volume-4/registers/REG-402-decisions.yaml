    class: D1
    title: Evidence metadata and binary-content separation
    decision: "Authoritative evidence metadata and binding are owned by the House while binary content resides in a controlled storage service that is not authoritative over binding or lifecycle."
    context: "Metadata authority must remain in the House independent of storage."
    options: ["Unified store", "Metadata and content separation", "Storage-owned metadata"]
    selected_posture: "House owns metadata and binding; storage service owns content."
    rationale: "Separation keeps governed authority independent of storage vendor."
    constraints: ["No storage vendor or schema selected in Package 3"]
    consequences: ["Metadata-to-object binding verification required"]
    risks: ["Storage provider capabilities unresolved"]
