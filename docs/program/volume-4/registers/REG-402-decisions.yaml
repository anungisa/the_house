  - id: ADR-V4-024
    class: D1
    title: Contract versioning and idempotency for integrations
    decision: "Integration contracts define versioning and idempotency so retried or duplicated exchanges do not create duplicate governed effects; unsupported capability remains contract-validation-pending."
    context: "Integrations must tolerate retries and duplicates without duplicating governed effects."
