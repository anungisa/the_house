records:
  - id: STK-V2-001
    name: Curling Canada (National Sport Organization)
    type: institutional
    description: >-
      The accountable national sport organization and system-of-record owner. Holds
      authoritative governance over affiliation policy, lifecycle authority, and the
      evidentiary record.
    primary_product: House
    personas:
      - Program governance authority
      - Membership and affiliation policy owner
    governed_authority: true
    validation_status: author_asserted
    source_refs:
      - V1-15
      - V1-24
  - id: STK-V2-002
    name: Provincial and Territorial Association (Member Organization)
    type: member_organization
    description: >-
      A regional member body with delegated responsibility for clubs in its
      jurisdiction. Consumes and contributes to affiliation state; does not own the
      authoritative lifecycle record.
    primary_product: House
    personas:
      - Regional membership administrator
      - Affiliation oversight reviewer
    governed_authority: true
    validation_status: stakeholder_validation_pending
    source_refs:
      - V1-15
      - V1-16
  - id: STK-V2-003
    name: Affiliated Club
    type: club
    description: >-
      The entity whose affiliation is governed. Subject of the affiliation lifecycle;
      interacts through guided experiences but does not adjudicate its own state.
    primary_product: Both
    personas:
      - Club as governed entity
    governed_authority: false
    validation_status: stakeholder_validation_pending
    source_refs:
      - V1-16
  - id: STK-V2-004
    name: Club Administrator
    type: administrator
    description: >-
      The individual acting on behalf of a club to prepare, submit, and maintain an
      affiliation application through the guided client experience.
    primary_product: Button
    personas:
      - Affiliation applicant
      - Required-action responder
    governed_authority: false
    validation_status: stakeholder_validation_pending
    source_refs:
      - V1-16
  - id: STK-V2-005
    name: Participant and Member
    type: participant
    description: >-
      A registered participant whose membership context depends on club affiliation
      status. Receives status and communication through the guided experience.
    primary_product: Button
    personas:
      - Status recipient
    governed_authority: false
    validation_status: stakeholder_validation_pending
    source_refs:
      - V1-16
  - id: STK-V2-006
    name: NSO Membership and Governance Officer (Reviewer)
    type: administrator
    description: >-
      The authorized reviewer who evaluates submitted affiliation applications against
      policy and records governed decisions with evidence.
    primary_product: House
    personas:
      - Affiliation reviewer
      - Evidence custodian
    governed_authority: true
    validation_status: author_asserted
    source_refs:
      - V1-12
      - V1-24
  - id: STK-V2-007
    name: Executive Accountable Authority
    type: executive
    description: >-
      The executive authority accountable for material organizational commitment and
      for accepting downstream implementation and procurement decisions.
    primary_product: House
    personas:
      - Executive acceptance authority
    governed_authority: true
    validation_status: author_asserted
    source_refs:
      - V1-26
  - id: STK-V2-008
    name: External System of Authority
    type: external_system
    description: >-
      An external system (for example registration, payment, or reference data) that
      exchanges data with the NSO record but does not become the authoritative
      affiliation system of record.
    primary_product: Neither
    personas:
      - Reconciliation source
    governed_authority: false
    validation_status: stakeholder_validation_pending
    source_refs:
      - V1-17
      - V1-18
  - id: STK-V2-009
    name: National Affiliation Administrator
    type: administrator
    description: >-
      A national operations administrator who manages recognition, jurisdiction
      assignment, review routing, escalation, and administrative correction across the
      affiliation service.
    primary_product: House
    personas:
      - Recognition and routing administrator
      - Escalation and correction handler
    governed_authority: true
    validation_status: author_asserted
    source_refs:
      - V2-08
  - id: STK-V2-010
    name: Support Agent
    type: administrator
    description: >-
      A support representative who assists applicants and reviewers, triages issues, and
      hands off to the appropriate authority without owning governed lifecycle state.
    primary_product: Both
    personas:
      - Applicant support
      - Reviewer support
    governed_authority: false
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-10
  - id: STK-V2-011
    name: Fee Reconciliation Steward
    type: administrator
    description: >-
      An administrator responsible for reconciling external fee-paid signals into the
      affiliation record at the boundary. Holds no accounting-system authority within the
      service.
    primary_product: House
    personas:
      - Fee-signal reconciler
    governed_authority: false
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-06
  - id: STK-V2-012
    name: Club Authorized Representative
    type: club
    description: >-
      An individual formally authorized to act on behalf of a club in recognition and
      affiliation matters, distinct from a general club administrator.
    primary_product: Both
    personas:
      - Authorized signer
      - Recognition contact
    governed_authority: false
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-07
  # --- Package 3: policy and validation authorities ---
  - id: STK-V2-013
    name: Fee and Reconciliation Policy Authority
    type: institutional
    description: >-
      The authority accountable for affiliation fee policy, exemptions, waivers, and the
      reconciliation boundary between fee obligation and external accounting. Owns fee
      policy; does not own payment execution or ledger authority. Validation lead: Helene.
    primary_product: House
    personas:
      - Fee policy owner
      - Reconciliation boundary authority
    governed_authority: true
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-16
  - id: STK-V2-014
    name: National Operating Alignment Authority
    type: institutional
    description: >-
      The authority accountable for national alignment of affiliation operating rules
      across member organizations and seasons. Confirms operating-rule consistency;
      does not own club-level discretion. Validation lead: Rich.
    primary_product: House
    personas:
      - National operating-rule steward
    governed_authority: true
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-12
      - V2-13
  - id: STK-V2-015
    name: Pathway and Evidence Policy Authority
    type: institutional
    description: >-
      The authority accountable for pathway eligibility, evidence validity, carry-forward,
      and completeness policy. Owns eligibility and evidence rules; does not own financial
      or activation authority. Validation lead: Jen.
    primary_product: House
    personas:
      - Pathway eligibility policy owner
      - Evidence policy owner
    governed_authority: true
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-13
      - V2-14
  # --- Package 4: service-experience validation authorities ---
  - id: STK-V2-016
    name: Bilingual Experience and Official-Languages Authority
    type: institutional
    description: >-
      The authority accountable for English and French parity, equivalent status and error
      meaning, plain-language terminology, and official-languages obligations across the
      affiliation service experience. Owns bilingual conformance policy; does not own
      lifecycle authority. Conformance level remains validation pending.
    primary_product: Both
    personas:
      - Official-languages conformance owner
      - Bilingual content steward
    governed_authority: false
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-24
  - id: STK-V2-017
    name: Accessibility and Inclusive-Design Authority
    type: institutional
    description: >-
      The authority accountable for accessibility conformance, keyboard and screen-reader
      access, colour-independent status, and accessible error and evidence interaction across
      the affiliation service experience. Owns accessibility conformance policy; does not own
      lifecycle authority. Conformance level remains validation pending.
    primary_product: Both
    personas:
      - Accessibility conformance owner
      - Inclusive-design steward
    governed_authority: false
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-24
  - id: STK-V2-018
    name: Privacy and Data-Protection Authority
    type: institutional
    description: >-
      The authority accountable for privacy notices, minimum-necessary disclosure, restricted
      evidence handling, and representative and reviewer visibility boundaries across the
      affiliation service experience. Owns privacy policy; does not own lifecycle authority.
      Privacy conformance remains validation pending.
    primary_product: House
    personas:
      - Privacy policy owner
      - Data-protection steward
    governed_authority: true
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-24
  - id: STK-V2-019
    name: Product Authority
    type: institutional
    description: >-
      The accountable function that owns the definition of the affiliation product: its scope,
      capabilities, boundaries, and the integrated product-service baseline. Owns product-definition
      decisions and the Volume 3 hand-off; does not own affiliation policy, financial policy, or
      technical architecture. Named-role confirmation remains pending organizational approval.
    primary_product: House
    personas:
      - Product definition owner
      - Volume authoring authority
    governed_authority: true
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-27
      - V2-28
  - id: STK-V2-020
    name: National Strategy Authority
    type: institutional
    description: >-
      The accountable function that owns national strategic direction and confirms that the
      affiliation product serves the sport's strategic outcomes. Consulted on product scope and
      material commitments; does not own operational execution or technical delivery. Named-role
      confirmation remains pending organizational approval.
    primary_product: House
    personas:
      - Strategic direction owner
    governed_authority: true
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-28
  - id: STK-V2-021
    name: Service Owner
    type: institutional
    description: >-
      The accountable function that owns operational execution of the affiliation service: routing,
      review operations, exception handling, and day-to-day service delivery within governed policy.
      Owns service operations; does not own policy authorship or product definition. Named-role and
      permanent staffing confirmation remain pending organizational approval.
    primary_product: House
    personas:
      - Affiliation service operations owner
    governed_authority: true
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-28
  - id: STK-V2-022
    name: Product and Technology Consistency Authority
    type: institutional
    description: >-
      The accountable function that maintains consistency between product definition and technology
      direction and advises on downstream design impact. Advisory to product and delivery; does not
      hold governed affiliation lifecycle authority and does not authorize implementation or
      architecture. Named-role confirmation remains pending organizational approval.
    primary_product: House
    personas:
      - Technology consistency advisor
    governed_authority: false
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-28
  - id: STK-V2-023
    name: Domain Data Owner
    type: institutional
    description: >-
      The accountable function that owns the authoritative affiliation domain data, its meaning,
      quality, retention, and reconciliation with external systems of authority. Owns data authority;
      does not own policy or lifecycle transitions. Named-role confirmation remains pending
      organizational approval.
    primary_product: House
    personas:
      - Affiliation data owner
      - Data reconciliation steward
    governed_authority: true
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-28
  - id: STK-V2-024
    name: Support Operations Owner
    type: institutional
    description: >-
      The accountable function that owns the support service for the affiliation experience: assisted
      recovery, escalation handling, and support-channel quality within permitted assistance boundaries.
      Owns support operations; does not own governed decisions or lifecycle authority. Named-role and
      permanent staffing confirmation remain pending organizational approval.
    primary_product: Both
    personas:
      - Support service owner
    governed_authority: false
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-28
