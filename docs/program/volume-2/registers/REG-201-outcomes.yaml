register_id: REG-201
name: Volume 2 Outcome Register
status: IN_REVIEW
version: 1.4.0
records:
  - id: OUT-V2-001
    statement: >-
      A club can complete affiliation for a season through a guided experience without
      ambiguity about required actions or current status.
    stakeholder_refs:
      - STK-V2-003
      - STK-V2-004
    product: Button
    success_signal: >-
      A club administrator can submit a complete affiliation application unaided and
      always knows the next required action.
    validation_status: stakeholder_validation_pending
    source_refs:
      - V1-16
      - V1-24
  - id: OUT-V2-002
    statement: >-
      The NSO holds a single authoritative, audited record of each club's affiliation
      lifecycle state.
    stakeholder_refs:
      - STK-V2-001
    product: House
    success_signal: >-
      Every club's affiliation state is retrievable from one authoritative record with
      complete transition history.
    validation_status: author_asserted
    source_refs:
      - V1-18
      - V1-24
  - id: OUT-V2-003
    statement: >-
      Reviewers can make consistent, evidence-backed affiliation decisions within
      policy.
    stakeholder_refs:
      - STK-V2-006
    product: House
    success_signal: >-
      Every affiliation decision is attributable to an authorized reviewer and carries
      the evidence on which it was based.
    validation_status: author_asserted
    source_refs:
      - V1-12
      - V1-24
  - id: OUT-V2-004
    statement: >-
      Member organizations have visibility into affiliation status across the clubs in
      their jurisdiction.
    stakeholder_refs:
      - STK-V2-002
    product: House
    success_signal: >-
      A member organization can see current and historical affiliation status for its
      clubs without ad hoc requests.
    validation_status: stakeholder_validation_pending
    source_refs:
      - V1-15
      - V1-16
  - id: OUT-V2-005
    statement: >-
      Every affiliation state change is attributable, reversible only through governed
      transitions, and produces evidence.
    stakeholder_refs:
      - STK-V2-001
      - STK-V2-006
    product: House
    success_signal: >-
      No affiliation state changes except through a governed transition that records
      audit and evidence.
    validation_status: author_asserted
    source_refs:
      - V1-12
      - V1-24
  - id: OUT-V2-006
    statement: >-
      Participants and administrators receive clear status and required-action
      communication.
    stakeholder_refs:
      - STK-V2-004
      - STK-V2-005
    product: Button
    success_signal: >-
      Affected parties are notified of status changes and outstanding required actions
      through the guided experience.
    validation_status: stakeholder_validation_pending
    source_refs:
      - V1-16
  - id: OUT-V2-007
    statement: >-
      External systems of authority reconcile with the NSO record without becoming the
      system of record.
    stakeholder_refs:
      - STK-V2-001
      - STK-V2-008
    product: House
    success_signal: >-
      External data is reconciled into the NSO record and the NSO record remains the
      single authoritative source of affiliation state.
    validation_status: stakeholder_validation_pending
    source_refs:
      - V1-17
      - V1-18
  - id: OUT-V2-008
    statement: >-
      Clubs are recognized and affiliated through governed pathways matched to their
      situation (continuity, renewal with remediation, or new affiliation).
    stakeholder_refs:
      - STK-V2-002
      - STK-V2-003
    product: House
    success_signal: >-
      Every affiliating club is routed to the correct pathway and reaches an active
      affiliation through governed transitions.
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-07
      - V1-24
  - id: OUT-V2-009
    statement: >-
      Reviewers and administrators operate affiliation work through defined journeys
      with clear authority, routing, and evidence.
    stakeholder_refs:
      - STK-V2-006
      - STK-V2-009
    product: House
    success_signal: >-
      Every review, return, decision, and correction follows a defined journey with
      attributable authority and recorded evidence.
    validation_status: author_asserted
    source_refs:
      - V2-08
  - id: OUT-V2-010
    statement: >-
      Applicants and clubs receive timely, bilingual, and accessible communication
      about status and required actions.
    stakeholder_refs:
      - STK-V2-004
      - STK-V2-005
    product: Button
    success_signal: >-
      Affected parties are notified in their chosen official language and can always
      determine the next required action.
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-10
  - id: OUT-V2-011
    statement: >-
      Affiliation product measures are defined or explicitly recorded as pending
      validation, each with an owner.
    stakeholder_refs:
      - STK-V2-001
      - STK-V2-007
    product: House
    success_signal: >-
      Every candidate product measure is classified as defined or pending a named
      validation, with no fabricated targets.
    validation_status: author_asserted
    source_refs:
      - V2-11
  - id: OUT-V2-012
    statement: >-
      Non-standard club scenarios (withdrawn, dormant, merged, reconstituted) are
      handled through governed transitions rather than ad hoc process.
    stakeholder_refs:
      - STK-V2-001
      - STK-V2-002
    product: House
    success_signal: >-
      Every non-standard club scenario resolves through a governed transition with audit
      and evidence.
    validation_status: author_asserted
    source_refs:
      - V2-08
  # --- Package 3: operating-rule outcomes ---
  - id: OUT-V2-013
    statement: >-
      Affiliation behaviour is determined by governed, versioned operating rules that are
      consistent across seasons and jurisdictions rather than by ad hoc discretion.
    stakeholder_refs:
      - STK-V2-001
      - STK-V2-002
    product: House
    success_signal: >-
      For a given season, jurisdiction, and pathway, the applicable rules and requirements
      are resolvable from a single governed rule set with recorded versions.
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-12
      - V2-13
  - id: OUT-V2-014
    statement: >-
      Fee policy, payment execution, accounting authority, and lifecycle activation are
      explicitly bounded so financial authority is never conflated with lifecycle authority.
    stakeholder_refs:
      - STK-V2-001
      - STK-V2-013
    product: House
    success_signal: >-
      Every activation records governed approval and reconciliation status without the
      affiliation service asserting ledger or payment-execution authority.
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-16
  - id: OUT-V2-015
    statement: >-
      Reviewers and decision authorities operate under explicit, auditable rules, with
      administrative correction kept distinct from governed decision change.
    stakeholder_refs:
      - STK-V2-001
      - STK-V2-005
    product: House
    success_signal: >-
      Every decision and correction records a permitted actor, rationale, evidence, and
      audit entry, and corrections are distinguishable from governed decision changes.
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-15
  - id: OUT-V2-016
    statement: >-
      The affiliation service is operated with defined support, recovery, and control
      behaviour, with service levels defined or explicitly recorded as pending validation.
    stakeholder_refs:
      - STK-V2-001
      - STK-V2-010
    product: Both
    success_signal: >-
      Material operational exceptions have a defined recovery path, and every service level
      is classified as defined or pending a named validation with no unsupported commitment.
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-17
  # --- Package 4: service-experience outcomes ---
  - id: OUT-V2-017
    statement: >-
      Each operating actor can encounter and operate the affiliation service through a
      role-appropriate workspace that presents governed status, required actions, and
      evidence, without visibility being mistaken for authority.
    stakeholder_refs:
      - STK-V2-004
      - STK-V2-006
      - STK-V2-009
    product: Both
    success_signal: >-
      Every actor can determine their current work, its governed status, and the next
      required action from a single role-appropriate workspace, and no actor gains authority
      merely because information is visible.
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-19
      - V2-20
  - id: OUT-V2-018
    statement: >-
      Governed lifecycle state is translated into clear, plain-language, bilingual
      user-visible status and required actions, and The Button never invents or mutates
      lifecycle status.
    stakeholder_refs:
      - STK-V2-003
      - STK-V2-004
      - STK-V2-005
    product: Both
    success_signal: >-
      Every user-visible status maps to a source governed state with defined meaning,
      audience, responsible party, and required action, and no displayed status changes
      governed state.
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-21
  - id: OUT-V2-019
    statement: >-
      Information capture and evidence interaction, including drafts, correction, replacement,
      and resubmission, behave predictably and recoverably without losing history.
    stakeholder_refs:
      - STK-V2-004
      - STK-V2-012
    product: Button
    success_signal: >-
      A representative can capture information, submit and replace evidence, save and resume,
      correct errors, and resubmit with history preserved and clear recovery behaviour.
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-22
  - id: OUT-V2-020
    statement: >-
      Communication, notification, and support across the affiliation lifecycle are timely,
      bilingual, accessible, and privacy-aware, and support intervention never creates
      unauthorized decision authority.
    stakeholder_refs:
      - STK-V2-004
      - STK-V2-005
      - STK-V2-010
    product: Both
    success_signal: >-
      Material lifecycle events produce defined communications in the recipient's official
      language with accessible, privacy-respecting content, and support actions stay within
      permitted assistance.
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-23
      - V2-24
  - id: OUT-V2-021
    statement: >-
      The complete affiliation service experience is acceptance-defined through end-to-end
      scenarios that trace to rules, controls, and tests, with experience validations
      classified and owned.
    stakeholder_refs:
      - STK-V2-001
      - STK-V2-007
    product: Both
    success_signal: >-
      Every material service scenario links an outcome, persona, use case, rule, workflow,
      experience requirement, control, and acceptance test, and each unresolved experience
      validation has a named owner and blocking gate.
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-25
      - V2-26
  - id: OUT-V2-022
    statement: >-
      Volume 2 delivers one integrated affiliation product-service definition baseline that
      consolidates every ratified package as the authoritative input to Volume 3, without
      introducing new governed decisions.
    stakeholder_refs:
      - STK-V2-001
      - STK-V2-007
    product: Both
    success_signal: >-
      A single integrated baseline restates every material capability with its outcome, personas,
      House and Button responsibilities, controlling rules, experience commitment, acceptance
      coverage, and unresolved conditions, and no consolidation record creates a new decision.
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-27
      - V2-33
  - id: OUT-V2-023
    statement: >-
      Product ownership, decision rights, and service accountability are explicit, so that authority
      derives from an accountable function rather than from workspace visibility.
    stakeholder_refs:
      - STK-V2-001
      - STK-V2-007
      - STK-V2-008
    product: House
    success_signal: >-
      Each governance domain names an accountable authority, consulted functions, required evidence,
      delegation rules, escalation route, change classification, and approval status, and no Button
      surface holds governed authority.
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-28
  - id: OUT-V2-024
    statement: >-
      Affiliation service commitments and measures form a controlled, measurable baseline with owners
      and acceptance relationships, without fabricated numeric targets.
    stakeholder_refs:
      - STK-V2-001
      - STK-V2-007
    product: Both
    success_signal: >-
      Every material service measure family is defined with an outcome, calculation concept, evidence
      source, accountable owner, baseline and target status, validation authority, acceptance
      relationship, and future blocking gate, and no measure invents a numeric service target.
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-29
  - id: OUT-V2-025
    statement: >-
      The affiliation product has a governed lifecycle and change-governance model, so that every
      product change is classified and routed to the correct approving authority before it takes effect.
    stakeholder_refs:
      - STK-V2-001
      - STK-V2-003
    product: House
    success_signal: >-
      Each change class defines its approving authority, required evidence, affected registers and
      acceptance coverage, effective-date handling, notice requirements, transition consideration, and
      downstream design impact, and authority-boundary and breaking changes require executive acceptance.
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-30
  - id: OUT-V2-026
    statement: >-
      Volume 2 closes with complete requirement traceability and a managed validation backlog, so that
      every material gap is dispositioned and every unresolved validation carries an owner and a future
      blocking gate before Volume 3 begins.
    stakeholder_refs:
      - STK-V2-001
      - STK-V2-007
    product: Both
    success_signal: >-
      A deterministic traceability projection reports identifier counts, orphan analysis, chain coverage,
      acceptance coverage, and authority-boundary analysis; every material gap is CLOSED, deferred,
      validation or policy pending, intentionally excluded, or flagged as a defect; and no gap closes
      merely because schema validation passes.
    validation_status: stakeholder_validation_pending
    source_refs:
      - V2-31
      - V2-32
