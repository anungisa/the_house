register_id: REG-204
name: Volume 2 Governance Decision Register
status: IN_REVIEW
version: 1.3.0
records:
  - id: DEC-V2-001
    class: D1
    question: >-
      What is the scope of Volume 2 Package 1, and what requirement architecture
      governs it?
    decision: >-
      Adopt Volume 2 Package 1 as product and service definition only. Package 1
      defines the affiliation product/service, its stakeholders, personas and
      outcomes, the House/Button product boundary, the affiliation service blueprint,
      and the requirements and acceptance architecture. It adopts the requirement
      identifier chain OUT -> CAP -> BR -> FR -> NFR -> UC -> RULE -> WF -> UX ->
      DATA -> API -> EVT -> CTRL -> TEST as the traceability spine. Package 1 does
      not author runtime code, migrations, or APIs; does not authorize
      implementation or procurement; and is not a master development plan. It
      proceeds from the corrected Volume 1 v1.0.1 baseline under the conditional
      authorization recorded in DEC-V1-029.
    evidence_refs:
      - V2-00
      - V2-01
      - V2-05
      - REG-203
      - DEC-V1-029
    approver: Aubert Nungisa (Accountable Program Authority)
    evidence_label: SELF-ATTESTED / AUTHOR-VERIFIED
    executive_acceptance: pending
    effective_date: TBD
    status: accepted_by_accountable_authority
  - id: DEC-V2-002
    class: D1
    question: >-
      Where does the product boundary between The House and The Button lie for the
      affiliation service?
    decision: >-
      The House is the authoritative governed platform and system of record; it owns
      affiliation lifecycle state, authority, evidence, decisions, and audit, and all
      governed transitions execute through the Governance Kernel. The Button is a
      guided client-facing experience that presents required actions, status,
      submission, and communication. The Button never independently owns or mutates
      governed lifecycle state; it requests actions that the House adjudicates. This
      boundary is binding for all Volume 2 requirements.
    evidence_refs:
      - V2-03
      - V1-24
      - V1-12
    approver: Aubert Nungisa (Accountable Program Authority)
    evidence_label: SELF-ATTESTED / AUTHOR-VERIFIED
    executive_acceptance: pending
    effective_date: TBD
    status: accepted_by_accountable_authority
  - id: DEC-V2-003
    class: D1
    question: >-
      What service blueprint and acceptance architecture form the Package 1
      foundation?
    decision: >-
      Adopt the affiliation service blueprint (V2-04) describing the end-to-end
      affiliation journey across House and Button, and the requirements and
      acceptance architecture (V2-05) that traces every requirement from outcome to
      acceptance test. Acceptance criteria are defined at the TEST level and linked
      to requirements; no requirement in Package 1 authorizes implementation.
    evidence_refs:
      - V2-04
      - V2-05
      - REG-203
    approver: Aubert Nungisa (Accountable Program Authority)
    evidence_label: SELF-ATTESTED / AUTHOR-VERIFIED
    executive_acceptance: pending
    effective_date: TBD
    status: accepted_by_accountable_authority
  - id: DEC-V2-004
    class: D2
    question: >-
      Is the Product-Definition Foundation ready, and is Package 1 closed and frozen?
    decision: >-
      Record Gate V2-G1 (Product-Definition Foundation Ready) as PASS against its ten
      conditions and close Volume 2 Package 1 with a freeze of V2-00 through V2-05 and
      V2-A at version 1.0.0. Closure records product definition only. It authorizes no
      implementation and no procurement, is not a master development plan, and leaves
      executive organizational acceptance pending at a later material-commitment gate.
    evidence_refs:
      - V2-A
      - GATE-V2-G1
      - REG-205
    approver: Aubert Nungisa (Accountable Program Authority)
    evidence_label: SELF-ATTESTED / AUTHOR-VERIFIED
    executive_acceptance: pending
    effective_date: TBD
    status: accepted_by_accountable_authority
  - id: DEC-V2-005
    class: D2
    question: >-
      Does the Package 1 freeze record unambiguously distinguish the source snapshot,
      closure/freeze, and merged commits?
    decision: >-
      Amend the Package 1 freeze provenance metadata. The original record named the
      freeze baseline only as "the Package 1 closure commit on the volume-2 branch,"
      which is ambiguous: Package 1 content, Gate V2-G1 closure, and the freeze record
      were authored in a single branch commit, so the freeze record is co-located with
      the content it freezes. Record the distinct commits explicitly. Package 1 source
      snapshot commit 71c2be6; closure/freeze commit 71c2be6 (coincides with the source
      snapshot because of single-commit authoring); merged commit 8ee3a74. This is a
      narrow provenance-metadata clarification recorded self-attested / author-verified.
      It does not reopen Package 1 content and does not alter Gate V2-G1, whose
      disposition remains PASS. V2-A is amended to version 1.0.1 to carry the explicit
      provenance; V2-00 through V2-05 remain frozen at 1.0.0 and are unchanged.
    evidence_refs:
      - V2-A
      - REG-205
      - APP-V2-009
      - DEC-V2-004
    approver: Aubert Nungisa (Accountable Program Authority)
    evidence_label: SELF-ATTESTED / AUTHOR-VERIFIED
    executive_acceptance: not_required
    effective_date: TBD
    status: accepted_by_accountable_authority
    amends: DEC-V2-004
    amendment_reason: >-
      Removes ambiguity in the Package 1 freeze baseline by recording the distinct
      source snapshot (71c2be6), closure/freeze (71c2be6), and merged (8ee3a74)
      commits. Narrow provenance-metadata correction only; no Package 1 content or gate
      disposition changes.
  - id: DEC-V2-006
    class: D1
    question: >-
      What is the product scope and what is explicitly excluded from the affiliation
      service?
    decision: >-
      Adopt the affiliation product scope defined in V2-06: the governed capability by
      which a club becomes and remains recognized and affiliated for a season, delivered
      across The House (system of record) and The Button (guided experience). Explicitly
      exclude membership registration, accreditation and certification, competition and
      event entry, payment processing and accounting as a system of record, learning
      management, and general-purpose compliance case management. These exclusions are
      product-scope boundaries only.
    evidence_refs:
      - V2-06
      - V2-01
    approver: Aubert Nungisa (Accountable Program Authority)
    evidence_label: SELF-ATTESTED / AUTHOR-VERIFIED
    executive_acceptance: pending
    effective_date: TBD
    status: accepted_by_accountable_authority
  - id: DEC-V2-007
    class: D1
    question: >-
      What recognition and affiliation pathways does the product support?
    decision: >-
      Adopt the three governed pathways defined in V2-07 - continuity confirmation,
      renewal with remediation, and new affiliation - inherited from the Volume 1 target
      operating model (V1-24). The product must support the three pathways and apply
      versioned season requirements. The detailed eligibility rules governing each
      pathway remain subject to policy and operational validation and are not ratified
      in this package.
    evidence_refs:
      - V2-07
      - V1-24
    approver: Aubert Nungisa (Accountable Program Authority)
    evidence_label: SELF-ATTESTED / AUTHOR-VERIFIED
    executive_acceptance: pending
    effective_date: TBD
    status: accepted_by_accountable_authority
  - id: DEC-V2-008
    class: D1
    question: >-
      How are the affiliation capabilities, use cases, requirements, and product
      measures recorded?
    decision: >-
      Adopt the expanded capability and requirement catalogue (V2-09, REG-203) covering
      thirty-one capability areas and the twenty-six controlled use cases (V2-08), the
      experience, communication, and support model (V2-10), and the product-measure
      classification (V2-11). No requirement authorizes implementation and no numerical
      target is fabricated; measures requiring an approved baseline are recorded as
      pending validation.
    evidence_refs:
      - V2-08
      - V2-09
      - V2-10
      - V2-11
      - REG-203
    approver: Aubert Nungisa (Accountable Program Authority)
    evidence_label: SELF-ATTESTED / AUTHOR-VERIFIED
    executive_acceptance: pending
    effective_date: TBD
    status: accepted_by_accountable_authority
  - id: DEC-V2-009
    class: D2
    question: >-
      Is Volume 2 Package 2 complete against Gate V2-G2, and may it be closed and
      frozen?
    decision: >-
      Record Gate V2-G2 (Affiliation Product Definition Complete) as PASS against its
      twelve conditions and close Volume 2 Package 2 with a freeze of V2-06 through
