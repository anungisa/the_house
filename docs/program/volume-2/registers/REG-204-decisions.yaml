      renewal with remediation, and new affiliation - inherited from the Volume 1 target
      operating model (V1-24). The product must support the three pathways and apply
      versioned season requirements. The detailed eligibility rules governing each
      pathway remain subject to policy and operational validation and are not ratified
      in this package.
