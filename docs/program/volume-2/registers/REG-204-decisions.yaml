    decision: >-
      Adopt the detailed pathway-specific service blueprints (V2-19); the role-based
      workspace and task model (V2-20); and the separated status, state, required-action,
      and service-information model (V2-21). Visibility never grants authority; the
      Governance Kernel remains the sole authority for lifecycle state; and The Button
      presents and requests but never mutates governed status. Definition only; no
