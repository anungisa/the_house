register_id: REG-903
name: Volume 9 Decisions
status: RATIFIED
version: 1.0.0
records:
  - id: ADR-V9-001
    title: Test definition precedes test execution
    decision: Volume 9 Package 1 defines test obligations only and authorizes no execution.
    status: ACCEPTED
    context: >-
      The program requires a governed definition of what must be tested before any test is written
      or run.
    consequence: Downstream volumes inherit a stable, versioned test-definition baseline.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-00
  - id: ADR-V9-002
    title: Evidence is tiered and non-substitutable
    decision: >-
      Evidence is ranked into fifteen tiers and a lower tier may not substitute for a required
      higher tier.
    status: ACCEPTED
    context: Assurance claims must be grounded in evidence of adequate strength.
    consequence: Acceptance decisions can be audited against a fixed evidence hierarchy.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-00
  - id: ADR-V9-003
    title: Real production data is prohibited in Package 1 test definition
    decision: No test data requirement or environment class may name real production data.
    status: ACCEPTED
    context: Privacy and records obligations forbid unauthorized use of real data.
    consequence: A separate purpose-limited authorization is required before any real data use.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-00
  - id: ADR-V9-004
    title: Gate V9-G1 disposes readiness, not implementation
    decision: Gate V9-G1 confers foundation readiness only and authorizes no construction.
    status: ACCEPTED
    context: The program separates documentary readiness from implementation authority.
    consequence: Package 2 may proceed to bounded test-definition only.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-00
  - id: ADR-V9-005
    title: Every governed affiliation action requires a test disposition
    decision: >-
      Every material affiliation action inherited from Volumes 7-8 is decomposed into a governed
      test requirement or scenario with an expected and a negative outcome.
    status: ACCEPTED
    context: Undefined actions cannot be assured; coverage must be traceable to governed actions.
    consequence: Package 2 enumerates test obligations per action without authorizing execution.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-11
  - id: ADR-V9-006
    title: Oracles derive from governed authority
    decision: Every affiliation oracle derives from a governed specification, not tester intuition.
    status: ACCEPTED
    context: A result can only be judged against an authoritative basis.
    consequence: Oracles are auditable against Volume 7-8 contracts and the state machine.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-11
  - id: ADR-V9-007
    title: Authority distinctions require negative tests
    decision: >-
      Account, membership, representative authority, delegation, assignment, finance, and support
      distinctions each require a negative or denial test.
    status: ACCEPTED
    context: Distinctions that are not negatively tested collapse under implementation pressure.
    consequence: Each authority distinction is bound to a governed negative or denial scenario.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-12
  - id: ADR-V9-008
    title: Completeness remains a derived determination
    decision: Completeness is recalculated from governed inputs and never stored as a mutable claim.
    status: ACCEPTED
    context: A stored completeness flag can diverge from the governed inputs.
    consequence: Completeness carries a recalculation test obligation.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-14
  - id: ADR-V9-009
    title: Submission receipt is not approval
    decision: A submission receipt confers no eligibility, approval, or activation.
    status: ACCEPTED
    context: Conflating receipt with approval would bypass governed decision authority.
    consequence: Submission, approval, and activation each remain distinct governed transitions.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-15
  - id: ADR-V9-010
    title: Return for information is not refusal
    decision: A return for information preserves history and is held distinct from a refusal decision.
    status: ACCEPTED
    context: Returns and refusals have different governed consequences and authority.
    consequence: Return, correction, and resubmission carry history-preservation obligations.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-16
  - id: ADR-V9-011
    title: Resubmission preserves history
    decision: Resubmission after correction preserves the full prior submission and review history.
    status: ACCEPTED
    context: Governed audit requires an unbroken history across correction cycles.
    consequence: Resubmission carries a history-preservation test obligation.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-16
  - id: ADR-V9-012
    title: Recommendation is not decision
    decision: A reviewer recommendation is held distinct from a governed decision transition.
    status: ACCEPTED
    context: Only authorized decision authority may change governed standing.
    consequence: Recommendation and decision each carry distinct workflow test obligations.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-17
  - id: ADR-V9-013
    title: Payment acknowledgement is not reconciliation
    decision: >-
      Payment acknowledgement is held distinct from accounting confirmation and reconciliation
      resolution.
    status: ACCEPTED
    context: A payment acknowledgement does not by itself resolve financial reconciliation.
    consequence: Finance testing preserves the decision-authority and reconciliation boundaries.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-17
  - id: ADR-V9-014
    title: Approval is not activation
    decision: >-
      Approval, activation authorization, activation execution, and active standing are held
      distinct.
    status: ACCEPTED
    context: Collapsing approval into activation would bypass governed activation authority.
    consequence: Each activation distinction carries a distinct test obligation.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-17
  - id: ADR-V9-015
    title: Exactly-once activation is a business invariant, not a transport guarantee
    decision: >-
      Exactly-once activation is tested as a governed business invariant, independent of any
      transport delivery guarantee.
    status: ACCEPTED
    context: Transport delivery guarantees do not establish a single governed active standing.
    consequence: Activation carries duplicate and recovery scenario obligations.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-17
  - id: ADR-V9-016
    title: Provider mocks are not provider integration
    decision: >-
      A mocked provider response is held distinct from provider integration evidence and end-to-end
      operational proof.
    status: ACCEPTED
    context: A mock demonstrates contract shape, not provider integration or operation.
    consequence: Provider testing carries distinct receipt, acceptance, and reconciliation obligations.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-18
  - id: ADR-V9-017
    title: Database behaviour is not schema inspection
    decision: >-
      Governed database behaviour is exercised against a database and is held distinct from schema
      inspection and mock behaviour.
    status: ACCEPTED
    context: Schema inspection cannot establish row-level-security or transactional behaviour.
    consequence: Database-behaviour testing carries an integration-tier evidence obligation.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-19
  - id: ADR-V9-018
    title: Migration execution is not business acceptance
    decision: >-
      Migration execution is held distinct from business acceptance; provenance and reconciliation
      are required before acceptance.
    status: ACCEPTED
    context: A completed migration run does not by itself establish business acceptance.
    consequence: Migration testing carries provenance, quarantine, and reconciliation obligations.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-19
  - id: ADR-V9-019
    title: Authentication is not authorization
    decision: >-
      Authentication is held strictly distinct from authorization; every security obligation
      evaluates resource-aware authority independently of identity proof.
    status: ACCEPTED
    context: A valid session establishes identity, not the authority to act on a specific resource.
    consequence: Security testing carries distinct authentication and resource-aware authorization obligations.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-22
  - id: ADR-V9-020
    title: Every success path carries a denial counterpart
    decision: >-
      Every governed success path in the assurance domains carries an explicit denial or negative
      counterpart, and missing authority or policy context fails closed.
    status: ACCEPTED
    context: A demonstrated success path does not establish that unauthorized paths are refused.
    consequence: Assurance testing carries denial, negative, and fail-closed scenario obligations.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-22
  - id: ADR-V9-021
    title: Privacy testing is not legal compliance
    decision: >-
      A privacy test outcome is held strictly distinct from a legal or regulatory compliance
      determination.
    status: ACCEPTED
    context: A passing privacy test does not by itself establish legal or regulatory compliance.
    consequence: Privacy testing carries a minimization and disclosure obligation, not a compliance claim.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-23
  - id: ADR-V9-022
    title: Logging and tracing carry the minimum necessary
    decision: >-
      Governed logs and traces carry only the minimum-necessary fields, and read access is held
      distinct from export authority.
    status: ACCEPTED
    context: Diagnostics and logs can silently over-collect restricted information.
    consequence: Privacy testing carries minimum-necessary logging and export-authority obligations.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-23
  - id: ADR-V9-023
    title: Automated accessibility scanning is incomplete
    decision: >-
      Automated accessibility scanning is held strictly distinct from manual inspection, keyboard
      completion, and assistive-technology evidence.
    status: ACCEPTED
    context: An automated scan cannot establish keyboard operability or assistive-technology usability.
    consequence: Accessibility testing carries distinct static, manual, keyboard, and assistive-technology obligations.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-24
  - id: ADR-V9-024
    title: A bilingual string is not semantic equivalence
    decision: >-
      The presence of a translated string is held strictly distinct from accurate translation and
      governed semantic equivalence.
    status: ACCEPTED
    context: A present translated string can still diverge in governed meaning.
    consequence: Bilingual testing carries a semantic-equivalence obligation across statuses, actions, errors, and documents.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-25
  - id: ADR-V9-025
    title: Payment acknowledgement is not accounting reconciliation
    decision: >-
      Payment acknowledgement is held strictly distinct from accounting confirmation and
      reconciliation, and approval is held distinct from activation and standing.
    status: ACCEPTED
    context: An acknowledgement of receipt does not establish that accounts reconcile.
    consequence: Financial-control testing carries distinct acknowledgement, reconciliation, and activation obligations.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-26
  - id: ADR-V9-026
    title: Backup completion is not restore evidence
    decision: >-
      Backup completion is held strictly distinct from demonstrated restorability.
    status: ACCEPTED
    context: A completed backup that cannot be restored provides no recovery assurance.
    consequence: Resilience testing carries a distinct backup-integrity and restoration obligation.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-27
  - id: ADR-V9-027
    title: Restore is not recovery or reconciliation
    decision: >-
      Restoration is held strictly distinct from service recovery and business reconciliation;
      recovery includes authoritative-state and outstanding-obligation reconciliation.
    status: ACCEPTED
    context: A restored dataset does not by itself establish that service and obligations are reconciled.
    consequence: Recovery testing carries a distinct restoration, recovery, and reconciliation obligation.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-27
  - id: ADR-V9-028
    title: Telemetry is not incident response
    decision: >-
      Telemetry emission is held strictly distinct from alert delivery, incident detection, and
      incident handling.
    status: ACCEPTED
    context: Emitted telemetry does not establish that an incident is detected or handled.
    consequence: Operational-assurance testing carries distinct observability and incident-response obligations.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-28
  - id: ADR-V9-029
    title: Build success is not deployment-path evidence
    decision: >-
      A successful build is held strictly distinct from a valid deployment path and a functioning
      production composition.
    status: ACCEPTED
    context: A build can succeed while configuration, secrets, or entry points are missing at deployment.
    consequence: Deployment-path testing carries configuration, secret-dependency, composition, and rollback obligations.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-28
  - id: ADR-V9-030
    title: Provider certification is not end-to-end assurance
    decision: >-
      Provider certification and provider-managed tests are held strictly distinct from end-to-end
      assurance, and contract termination is held distinct from data returned, deleted, and
      reconciled.
    status: ACCEPTED
    context: A provider certificate does not establish end-to-end behaviour in the governed system.
    consequence: Provider-assurance testing carries distinct continuity, substitution, return, deletion, and exit obligations.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-29
  - id: ADR-V9-031
    title: An exception or waiver is not a passing test
    decision: >-
      A governed exception or waiver is held strictly distinct from a passing test and requires an
      owner, an expiry, and an approval.
    status: ACCEPTED
    context: An unresolved exception can be mistaken for demonstrated conformance.
    consequence: Backlog exceptions and waivers carry owner, expiry, and approval obligations.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-30
  - id: ADR-V9-032
    title: Operational proof requires environment- and configuration-bound evidence
    decision: >-
      Operational and assurance evidence must bind environment, configuration, version, identity,
      organization, jurisdiction, data, and time to be admissible.
    status: ACCEPTED
    context: Evidence detached from its environment and configuration cannot be reproduced or trusted.
    consequence: Assurance evidence carries an environment- and configuration-binding obligation.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V9-30
