    title: Assurance context and authorities assumption
    statement: >-
      Assumes that identity-provider, service-identity, policy and configuration, evidence
      classifications, logging and trace fields, export authority, retention and legal-hold rules,
      accessibility task inventory, assistive-technology matrix, bilingual reviewer qualifications,
      financial-provider and accounting authorities, backup technology, restore environment,
      continuity and provider-assurance authorities, deployment topology, data-return and deletion
      authorities, operational ownership, and independent-assurance authority will be resolved
      before any assurance test is authorized. No such context is asserted to exist.
    owner: Aubert Nungisa (Accountable Program Authority)
    required_evidence: Resolved and governed assurance context, authorities, and inventories recorded as an accepted input.
    future_blocking_gate: V10-G1
