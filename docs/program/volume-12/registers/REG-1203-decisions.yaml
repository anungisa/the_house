  - id: ADR-V12-010
    kind: DECISION_BOUNDARY
    title: A mocked or single-provider result is not end-to-end evidence
    statement: >-
      A mocked dependency or an isolated provider result is not the same as
      end-to-end integration evidence or operational proof.
    decision_status: APPROVED_FOR_PLANNING
    context: >-
      Integration and provider evidence must reflect real boundaries and real
      provider states.
    alternatives_considered:
      - Accept a mock as integration evidence — rejected.
    consequences: >-
      The integration and provider evidence requirements demand real-boundary evidence.
    decision_authority: Technical Acceptance Authority
    prohibited_inference: Mocked provider result is never provider integration evidence is never operational proof.
