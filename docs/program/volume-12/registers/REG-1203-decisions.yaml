  - id: ADR-V12-001
    kind: DECISION_BOUNDARY
    title: Documentary approval is distinct from executed proof
    statement: >-
      Documentary approval of a governance artifact is distinct from executed
      proof of an obligation. Ratification of Volume 12 defines the gate,
      release, and acceptance-evidence framework; it does not constitute, accept,
      or substitute for any evidence, acceptance decision, or release
      authorization.
    decision_status: APPROVED_FOR_PLANNING
    context: >-
      Volume 12 Package 1 establishes the documentary foundation for evidence,
      acceptance, gating, and release governance. It must be impossible to read
      ratification as evidence that the governed obligations are met.
    alternatives_considered:
      - Treat ratification as conditional acceptance — rejected as unsafe.
      - Defer the distinction to implementation — rejected as fail-open.
    consequences: >-
      Every Volume 12 record carries a non-authorizing posture. No documentary
      artifact admits, validates, accepts, gates, or authorizes release of any
      evidence.
    decision_authority: Release Governance Authority
    prohibited_inference: Documentary approval is never executed proof.
    traces_to:
