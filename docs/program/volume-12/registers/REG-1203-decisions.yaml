  - id: ADR-V12-013
    kind: DECISION_BOUNDARY
    title: Bilingual string checks are not semantic acceptance
    statement: >-
      Confirming that English and French strings exist is not the same as
      translation accuracy, semantic equivalence, or a validated bilingual
      experience.
    decision_status: APPROVED_FOR_PLANNING
    context: >-
      Bilingual acceptance is semantic and experiential, not a presence check.
    alternatives_considered:
      - Accept string presence as bilingual acceptance — rejected.
    consequences: >-
      The bilingual-semantic evidence requirement demands independent semantic review.
    decision_authority: Accessibility and Bilingual Acceptance Authority
    prohibited_inference: English and French strings exist is never semantic equivalence.
    traces_to:
