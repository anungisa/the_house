  - id: ADR-V12-016
    kind: DECISION_BOUNDARY
    title: Technical acceptance is not business or executive acceptance
    statement: >-
      Technical acceptance is not business acceptance, business acceptance is not
      operational acceptance, and none of these is executive release
      authorization.
    decision_status: APPROVED_FOR_PLANNING
    context: >-
      The acceptance ladder separates distinct authorities and dispositions.
    alternatives_considered:
      - Collapse the acceptance ladder — rejected as unsafe.
    consequences: >-
      Each acceptance class in REG-1201 has a distinct authority and disposition.
    decision_authority: Executive Sponsor
    prohibited_inference: Technical acceptance is never business acceptance or executive authorization.
