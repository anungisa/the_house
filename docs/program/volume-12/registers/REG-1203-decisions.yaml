  # === PACKAGE 2 — AFFILIATION EVIDENCE DECISION BOUNDARIES ================
  - id: ADR-V12-005
    kind: DECISION_BOUNDARY
    title: Club affiliation is the first evidence-definition vertical
    statement: >-
      Club affiliation is the first evidence-definition vertical. It defines the
      evidence and acceptance obligations of a single governed vertical and does
      not define, generalize, or authorize any other vertical.
    decision_status: APPROVED_FOR_PLANNING
    context: >-
      Package 2 decomposes the affiliation vertical into evidence domains and
      acceptance classes. Its scope must not be read as program-wide evidence.
    alternatives_considered:
      - Define evidence for all verticals at once — rejected as unbounded.
    consequences: >-
      The affiliation evidence requirements bind only the affiliation vertical.
    decision_authority: Release Governance Authority
    prohibited_inference: An affiliation evidence definition is never another vertical's evidence.
    traces_to:
      - V12-11
    chapter_ref: V12-11
    future_gate: EXEC-MCG
