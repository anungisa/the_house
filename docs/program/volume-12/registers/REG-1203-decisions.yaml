  - id: ADR-V12-008
    kind: DECISION_BOUNDARY
    title: Schema inspection is not database behaviour
    statement: >-
      Inspecting a schema definition is not the same as proving physical database
      behaviour under concurrency with representative data.
    decision_status: APPROVED_FOR_PLANNING
    context: >-
      Database invariants are behavioural and must be observed, not inferred from
      structure.
    alternatives_considered:
      - Accept schema inspection as behaviour evidence — rejected.
    consequences: >-
      The database-behaviour evidence requirement demands physical execution evidence.
    decision_authority: Technical Acceptance Authority
    prohibited_inference: Schema exists is never database invariant proven.
    traces_to:
      - V12-12
