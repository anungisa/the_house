  - id: ADR-V12-003
    kind: DECISION_BOUNDARY
    title: Waivers and conditions do not convert failure to success
    statement: >-
      A waiver or conditional acceptance records a bounded, owned, and expiring
      exception with a compensating control. It never converts a failed or
      absent obligation into a met obligation.
    decision_status: APPROVED_FOR_PLANNING
    context: >-
      Exceptions are unavoidable but must be visible, expiring, and owned, never
      a silent path to release.
    alternatives_considered:
      - Permanent waivers — rejected as fail-open.
    consequences: >-
      Every waiver and condition in REG-1202 carries an owner, expiry,
      compensating control, and release effect. Expiry is a fail-closed gate
      condition.
    decision_authority: Release Governance Authority
    prohibited_inference: A waiver approved is never a failure converted to success.
    traces_to:
