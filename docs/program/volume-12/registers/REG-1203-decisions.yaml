  - id: ADR-V12-004
    kind: DECISION_BOUNDARY
    title: Generated foundation artifacts are non-authoritative projections
    statement: >-
      Foundation reports and projections generated from the Volume 12 registers
      are non-authoritative reflections of the ratified corpus. The registers and
      chapters remain the sole source of authority.
    decision_status: APPROVED_FOR_PLANNING
    context: >-
      Generated summaries aid review but must never be mistaken for the
      authoritative record or for evidence.
    alternatives_considered:
      - Treat generated reports as authoritative — rejected.
    consequences: >-
      Every generated projection is labelled non-authoritative and derives only
      from the ratified registers.
    decision_authority: Release Governance Authority
    prohibited_inference: A projection is never authoritative and never evidence.
