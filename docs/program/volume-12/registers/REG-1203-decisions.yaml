  - id: ADR-V12-017
    kind: DECISION_BOUNDARY
    title: Executive authorization cannot substitute for missing evidence
    statement: >-
      Executive support or authorization cannot substitute for missing,
      unaccepted, or expired evidence. Executive release authorization presupposes
      that the evidence and acceptance chain is complete.
    decision_status: APPROVED_FOR_PLANNING
    context: >-
      The most dangerous failure mode is executive override of missing evidence.
      The framework fails closed against it.
    alternatives_considered:
      - Permit executive override of missing evidence — rejected as fail-open.
    consequences: >-
      The executive release-decision class in REG-1201 prohibits inference from
      support to substitution.
    decision_authority: Executive Sponsor
    prohibited_inference: Executive support is never evidence substitution.
    traces_to:
      - V12-19
