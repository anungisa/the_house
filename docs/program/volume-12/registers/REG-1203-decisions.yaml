  - id: ADR-V12-002
    kind: DECISION_BOUNDARY
    title: Evidence, acceptance, gate, and release are separate decisions
    statement: >-
      Evidence existence, evidence validity, evidence sufficiency, acceptance,
      gate passage, and release authorization are separate decisions taken by
      separate authorities and must never be collapsed.
    decision_status: APPROVED_FOR_PLANNING
    context: >-
      Collapsing these decisions is the most common cause of unsafe release. The
      framework separates them by authority, independence, and disposition.
    alternatives_considered:
      - A single combined sign-off — rejected as unsafe.
    consequences: >-
      Each decision class has a defined authority, independence requirement, and
      prohibited inference in REG-1201.
    decision_authority: Release Governance Authority
    prohibited_inference: One decision in the chain never implies another.
    traces_to:
