  - id: ADR-V12-006
    kind: DECISION_BOUNDARY
    title: Dossier completeness is not evidence availability is not acceptance
    statement: >-
      A defined and structurally complete acceptance dossier is not the same as
      available evidence, and available evidence is not the same as accepted
      evidence.
    decision_status: APPROVED_FOR_PLANNING
    context: >-
      Package 2 defines dossiers and evidence requirements only. It must be
      impossible to read a defined dossier as populated or accepted.
    alternatives_considered:
      - Treat a defined dossier as evidence — rejected as fail-open.
    consequences: >-
      Every dossier carries a non-authorizing posture and an authoritative source.
    decision_authority: Release Governance Authority
    prohibited_inference: Dossier section defined is never dossier populated is never acceptance granted.
    traces_to:
      - V12-11
    chapter_ref: V12-11
