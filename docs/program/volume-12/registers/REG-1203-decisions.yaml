  - id: ADR-V12-011
    kind: DECISION_BOUNDARY
    title: Migration execution is not migration acceptance
    statement: >-
      Executing a migration is not the same as accepting a migration. Acceptance
      requires reconciliation, business acceptance, and only then source
      retirement.
    decision_status: APPROVED_FOR_PLANNING
    context: >-
      Migration correctness is bounded by reconciliation and identity resolution,
      not by execution.
    alternatives_considered:
      - Accept a completed migration run as acceptance — rejected.
    consequences: >-
      The migration evidence requirement separates execution from acceptance and retirement.
    decision_authority: Migration Acceptance Authority
    prohibited_inference: Migration executed is never migration accepted is never source retired.
    traces_to:
      - V12-15
