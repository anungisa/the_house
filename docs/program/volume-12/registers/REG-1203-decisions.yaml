    title: Accessibility automation is not accessibility acceptance
    statement: >-
      An automated accessibility scan is not a conformance determination and is
      not accessibility acceptance.
    decision_status: APPROVED_FOR_PLANNING
    context: >-
      Accessibility acceptance requires manual, keyboard, and assistive-technology
