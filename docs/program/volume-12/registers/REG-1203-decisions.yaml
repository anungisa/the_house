  - id: ADR-V12-009
    kind: DECISION_BOUNDARY
    title: Authentication is not authorization
    statement: >-
      Demonstrating that a principal is authenticated is not the same as
      demonstrating that authorization boundaries, including cross-organization
      and cross-jurisdiction denial, are enforced.
    decision_status: APPROVED_FOR_PLANNING
    context: >-
      Isolation and denial are the core institutional invariants of the actor
      model and must be evidenced by denial cases.
    alternatives_considered:
      - Accept authentication as authorization evidence — rejected as unsafe.
    consequences: >-
      The authorization evidence requirement demands denial-case evidence.
    decision_authority: Security and Privacy Acceptance Authority
    prohibited_inference: Authentication evidence is never authorization evidence.
    traces_to:
      - V12-13
    chapter_ref: V12-13
