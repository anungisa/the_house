  - id: ADR-V12-007
    kind: DECISION_BOUNDARY
    title: Implementation completion is not accepted evidence
    statement: >-
      Completion of implementation, build, environment, or deployment-path work
      is not accepted evidence. Acceptance is a separate decision by a separate
      authority.
    decision_status: APPROVED_FOR_PLANNING
    context: >-
      The implementation evidence domain defines what would be required; it does
      not accept anything.
    alternatives_considered:
      - Treat a completed build as accepted evidence — rejected.
    consequences: >-
      Implementation evidence requirements route to the technical acceptance authority.
    decision_authority: Technical Acceptance Authority
    prohibited_inference: Implementation completed is never implementation evidence accepted.
    traces_to:
