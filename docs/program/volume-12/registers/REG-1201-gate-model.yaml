  # --- Evidence classes -----------------------------------------------------
  - id: ECLASS-V12-001
    kind: EVIDENCE_CLASS
    title: Documentary definition
    statement: A ratified documentary artifact defining an obligation.
    evidence_class: DOCUMENTARY_DEFINITION
    authoritative_requirement: A ratified, source-controlled document exists and defines the obligation.
    permitted_claim: An obligation is documented.
    prohibited_inference: A documented obligation is not evidence that the obligation is met.
    minimum_provenance: Source-controlled commit and ratification record.
    independence_requirement: Author-verified; no independence required for definition.
    review_authority: Evidence Governance Authority
    acceptance_authority: Evidence Governance Authority
    expiry_or_revalidation_dependency: Revalidated when the referenced requirement changes.
    evidentiary_limitation: Documentary completeness is never evidence of execution or outcome.
