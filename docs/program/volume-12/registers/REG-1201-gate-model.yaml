    title: Gate V12-G1 — Gate, Release, and Acceptance-Evidence Governance Foundation Ready
    statement: >-
      Deterministic readiness gate for the Volume 12 Package 1 gate, release, and
      acceptance-evidence governance foundation. Reports readiness from the
      corpus; accepts no evidence and authorizes no release.
    gate_disposition_target: GATE_RELEASE_AND_ACCEPTANCE_EVIDENCE_GOVERNANCE_FOUNDATION_READY
    decision_authority: Release Governance Authority
    escalation_path: Escalates unmet conditions to the Executive Sponsor for disposition.
