      performed.
    required_test_evidence: >-
      Requires the reproducible verification evidence planned in EVID-V10-001.
    security_privacy_evidence: >-
      Requires tenant-isolation, row-level-security, and privacy evidence prior to
      acceptance.
    accessibility_bilingual_evidence: >-
