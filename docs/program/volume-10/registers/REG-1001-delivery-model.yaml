    id: AOUT-V10-201
    kind: AFFILIATION_OUTCOME
    title: Club-affiliation implementation delivery outcome
    statement: Documentary outcome for implementing the club-affiliation vertical as the first implementation vertical. Defines the outcome only; authorizes no construction, provisioning, test execution, release, or deployment.
    objective: Deliver a governed, tenant-isolated, evidence-bearing club-affiliation lifecycle capability across House and Button responsibilities.
    scope: The full affiliation lifecycle from representative authority through requirements, evidence, submission, review, return, resubmission, decision, reconciliation, exactly-once activation, standing, and expiry.
    excluded_scope: No runtime code, environment, executable test, dataset, identity, secret, provider engagement, migration, or infrastructure is produced or authorized.
    house_responsibility: The House owns institutional authority, lifecycle state, authorization, evidence, and the system of record.
    button_responsibility: The Button remains a governed consumer of House contracts and performs no independent institutional mutation.
    external_system_responsibility: External providers acknowledge and exchange only; they retain no institutional decision authority.
    lifecycle_states: requirement, evidence, completeness, submission, review, return, resubmission, decision, reconciliation, activation, standing, expiry.
    security_privacy_obligations: Tenant isolation, row-level-security, minimum-necessary collection, restricted evidence, and records retention are embedded obligations.
    accessibility_bilingual_obligations: Accessibility and English/French bilingual obligations are first-class acceptance obligations.
    release_gate: V11-G1
    chapter_ref: V10-11
