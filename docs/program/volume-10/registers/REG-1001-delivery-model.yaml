  - id: CAP-V10-001
    kind: CAPABILITY
    title: Delivery governance and program-management capability
    statement: >-
      Capability required to plan, coordinate, and govern delivery of the
      club-affiliation outcome without authorizing implementation.
    capability_domain: PRODUCT_SERVICE_OWNERSHIP
    responsible_role: Accountable Program Authority
    decision_rights: >-
      Holds planning-level decision rights over scope baseline, work-package
      definition, and gate readiness recommendations; holds no implementation,
      procurement, provisioning, or release authorization rights.
    accountabilities: >-
      Accountable for the integrity, completeness, and fail-closed posture of the
      delivery-planning governance foundation.
    required_competence: >-
      Program governance, phase-gate delivery, and evidence-based readiness
      assessment for regulated non-profit sport administration.
    independence_requirement: >-
      Planning authority is separated from implementation authority; the same
      role may not both author a plan and authorize its execution.
    capacity_assumption: >-
      Planning-estimate only; no staffing assignment, engagement, or hiring is
      represented or committed by this record.
    availability_status: ASSUMED
    conflict_of_interest_constraint: >-
      A role authoring an estimate, decision, or readiness recommendation may not
      independently approve it for execution.
    escalation_route: >-
      Unresolved planning conflicts escalate to the Executive Acceptance Authority
      and the future executive master-coordination gate (EXEC-MCG).
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    planning_status: DOCUMENTARY_PLAN_ONLY
    commitment_status: NOT_COMMITTED
    chapter_ref: V10-06
    future_gate: V11-G1

