  - id: WORK-V10-001
    kind: WORK_PACKAGE
    title: Club-affiliation lifecycle implementation plan
    statement: >-
      Plan for constructing the governed club-affiliation lifecycle through the
      Governance Kernel. This is a plan; it does not begin or authorize
      construction.
    objective: >-
      Define the construction plan for the club-affiliation lifecycle state
      machine, guards, evidence, and outbox integration as a documentary plan.
    scope: >-
      Lifecycle transitions, guard planning, evidence-obligation planning, and
      outbox-integration planning for club affiliation.
    excluded_scope: >-
      No runtime code, no schema migration, no environment, no executable test, no
      dataset, no identity, no secret, and no deployment are produced or authorized.
    source_requirements:
      - V9-39
      - V9-40
      - central-registration-volume-9-v1.0.0
    responsible_role: Engineering Delivery Lead
    required_capabilities:
      - CAP-V10-001
      - CAP-V10-002
    dependencies:
      - DEP-V10-001
      - DEP-V10-002
    deliverables:
      - DELIV-V10-001
    definition_of_ready: >-
      Inherited Volume 9 obligations mapped, dependencies identified with owners,
      and required environments defined at planning level.
    definition_of_done: >-
      Construction plan is complete, traceable to inherited obligations, and every
      execution step is bound to a future authorization gate; no execution occurs.
    evidence_obligations: >-
      Plans the reproducible, provenance-bearing evidence that later verification
      and release-acceptance gates will require (EVID-V10-001).
    security_privacy_obligations: >-
      Embeds tenant-isolation, row-level-security, privacy, and records-retention
      obligations inherited from the House P0 findings into the work-package plan.
    accessibility_bilingual_obligations: >-
      Embeds accessibility and English/French bilingual obligations into the
      work-package plan.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    planning_status: DOCUMENTARY_PLAN_ONLY
    commitment_status: NOT_COMMITTED
    chapter_ref: V10-02
    future_gate: V11-G1

