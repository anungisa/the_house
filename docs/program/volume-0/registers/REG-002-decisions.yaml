    decision: >-
      Adopt the authority doctrine in V0-06: each system holds exactly one primary
      authority type; The House is system-of-record foundation (production-candidate,
      not final production truth); The Button owns experience only; Base44 is
      evidence only; external platforms are classified in REG-005 SRC-005..SRC-012.
    evidence_refs: [V0-06, REG-005]
    approver: Aubert Nungisa (Accountable Program Authority)
    evidence_label: AUTHOR-VERIFIED
    executive_acceptance: pending
    effective_date: TBD
