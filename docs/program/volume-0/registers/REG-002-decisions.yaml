  - id: DEC-V0-017
    class: D1
    question: What is the Gate G0 disposition?
    decision: >-
      Gate G0 is PASS_WITH_TIME_BOUNDED_CONDITIONS; executive acceptance, funding,
      domain validation, independent assurance, outcome baselines, and pilot cohort
      are time-bounded conditions at their applicable later gates and do not block
      controlled delivery of the affiliation slice.
