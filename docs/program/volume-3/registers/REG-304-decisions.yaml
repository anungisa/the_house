register_id: REG-304
name: Volume 3 Governance Decision Register
status: RATIFIED
version: 1.4.0
records:
  - id: DEC-V3-001
    class: D1
    question: >-
      Should the Volume 3 Package 1 business operating-model foundation (V3-00 through V3-07) be
      adopted as the definitional institutional and service operating model for the affiliation
      service, without authorizing staffing, cost, procurement, architecture, delivery
      sequencing, or implementation?
    decision: >-
      Adopt V3-00 through V3-07 as the ratified Volume 3 Package 1 operating-model foundation.
      The chapters define the target institutional operating model, the affiliation service
      operating model across all three pathways, roles and segregation of duties, work
      management and service controls, the financial and reconciliation operating boundary,
      support/privacy/continuity assurance, and operating measures with a validation backlog.
      Adoption is definition-only and authorizes no construction or commitment.
    evidence_refs:
      - V3-00
      - V3-01
      - V3-02
      - V3-03
      - V3-04
      - V3-05
      - V3-06
      - V3-07
    approver: Aubert Nungisa (Accountable Program Authority)
    evidence_label: AUTHOR-VERIFIED
    executive_acceptance: pending
    effective_date: TBD
    status: accepted_by_accountable_authority
  - id: DEC-V3-002
    class: D1
    question: >-
      Is Gate V3-G1 (Business Operating-Model Foundation Ready) satisfied, and should the
      Volume 3 Package 1 corpus be frozen at version 1.0.0 through a separate freeze commit?
    decision: >-
      Gate V3-G1 is dispositioned BUSINESS_OPERATING_MODEL_FOUNDATION_READY (PASS). All
      fourteen gate conditions are satisfied to the extent of author assertion: corrected
      Volume 2 provenance inherited; institutional operating functions defined;
      responsibilities separated; all three pathways modelled; decision authority
      distinguished from execution; delegation, escalation, conflicts, and segregation of
      duties represented; queues, handoffs, exceptions, and recovery defined; financial
      operating boundary defined; support acquires no governed decision authority; operating
      measures defined or validation-pending; unresolved assumptions carry owners and future
      gates; no staffing, cost, procurement, architecture, delivery, or implementation
      authorized; no master development plan created; and Package 1 receives a separate freeze
      commit. The Package 1 corpus (V3-00..V3-07, V3-A) is frozen at version 1.0.0.
    evidence_refs:
      - GATE-V3-G1
      - V3-A
      - REG-305
    approver: Aubert Nungisa (Accountable Program Authority)
    evidence_label: AUTHOR-VERIFIED
    executive_acceptance: pending
    effective_date: TBD
    status: accepted_by_accountable_authority
  - id: DEC-V3-003
    class: D1
    question: >-
      Should Volume 3 Package 2 be authorized as a definition-only continuation of the
      operating-model work, without authorizing any material commitment?
    decision: >-
      Authorize Volume 3 Package 2 as a definition-only continuation of the business
      operating-model work. Package 2 authorizes no implementation, procurement, technical
      architecture, delivery sequencing, staffing, or cost, and does not create a master
      development plan. Executive organizational acceptance remains pending at the
      material-commitment gate.
    evidence_refs:
      - V3-A
      - GATE-V3-G1
      - DEC-V3-002
    approver: Aubert Nungisa (Accountable Program Authority)
    evidence_label: AUTHOR-VERIFIED
    executive_acceptance: pending
    effective_date: TBD
    status: accepted_by_accountable_authority
  - id: DEC-V3-004
    class: D2
    question: >-
      Does the permanent PACKAGE-3-1 freeze record distinguish the source snapshot, the
      closure/freeze commit, and the post-merge merged commit, and if not, how is the freeze
      provenance completed without reopening Package 1 content or altering Gate V3-G1?
    decision: >-
      The original PACKAGE-3-1 freeze approval (APP-V3-011) was ratified at freeze time and
      could not record the post-merge merged commit. This narrow post-merge amendment completes
      the Package 1 freeze provenance through a superseding approval (APP-V3-012) that
      distinguishes source snapshot commit 34eba63, closure/freeze commit ce41279, and merged
      commit 8c4f4ff, with a self-attested / author-verified evidence posture. V3-A and Gate
      V3-G1 are preserved and no substantive Package 1 content is reopened.
    evidence_refs:
      - GATE-V3-G1
      - V3-A
      - REG-305
    approver: Aubert Nungisa (Accountable Program Authority)
    evidence_label: AUTHOR-VERIFIED
    executive_acceptance: not_required
    effective_date: TBD
    status: accepted_by_accountable_authority
  - id: DEC-V3-005
    class: D1
    question: >-
      Is Gate V3-G2 (Seasonal Operations Foundation Ready) satisfied, and should the Volume 3
      Package 2 corpus be frozen at version 1.0.0 through a separate freeze commit?
    decision: >-
      Gate V3-G2 is dispositioned SEASONAL_OPERATIONS_FOUNDATION_READY (PASS). All fourteen
      gate conditions are satisfied to the extent of author assertion: the Package 1 freeze
      provenance is unambiguous; a complete seasonal operating cycle is defined; recognition,
      jurisdiction, pathway triage, and case-opening are operationally defined with
      determination classes and authorities; queue ownership, assignment, reassignment, and
      handoffs are defined with explicit authority disposition; remediation, exceptions,
      reconsideration, and corrections are distinguished as distinct categories; financial
      reconciliation and activation preserve the authority boundaries and one-time activation;
      support and recovery acquire no governed decision authority; operational quality and
      assurance controls are defined; capacity and workload assumptions carry no staffing
      commitment; all three pathways are covered through season closure; unresolved assumptions
      carry owners and future gates; no requirement authorizes implementation or procurement;
      no technical architecture, staffing plan, cost plan, delivery sequence, or master
      development plan is created; and Package 2 receives a separate freeze commit. The Package
      2 corpus (V3-08..V3-16, V3-B) is frozen at version 1.0.0.
    evidence_refs:
      - GATE-V3-G2
      - V3-B
      - REG-305
    approver: Aubert Nungisa (Accountable Program Authority)
    evidence_label: AUTHOR-VERIFIED
    executive_acceptance: pending
    effective_date: TBD
    status: accepted_by_accountable_authority
