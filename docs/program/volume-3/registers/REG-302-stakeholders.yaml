    primary_product: Neither
    governed_authority: false
    validation_status: stakeholder_validation_pending
    source_refs:
      - V3-05
      - V2-16
  - id: STK-V3-015
    name: External Accounting and Ledger System
    type: external_system
    description: >-
      External accounting authority that confirms financial postings; produces ledger
      confirmations consumed by reconciliation operations.
    primary_product: Neither
    governed_authority: false
    validation_status: stakeholder_validation_pending
    source_refs:
      - V3-05
      - V2-16
  - id: STK-V3-016
    name: Executive Material-Commitment Authority
    type: executive
    description: >-
      Executive authority that accepts material organizational commitments; the acceptance
