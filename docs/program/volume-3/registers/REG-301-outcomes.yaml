    source_refs:
      - V3-03
      - V2-28
  - id: OUT-V3-004
    statement: >-
      Work management is defined for queue ownership, assignment, aging, handoffs, exceptions,
      escalation, recovery, and audit review without introducing unsupported service-level
      targets.
