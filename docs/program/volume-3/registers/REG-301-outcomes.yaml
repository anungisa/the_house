    statement: >-
      Operating governance is defined through decision forums and mechanisms covering
      seasonal-readiness governance, affiliation-policy governance, operational service review,
      financial and reconciliation review, exception and escalation review, privacy and
      restricted-evidence oversight, bilingual and accessibility oversight, external-dependency
      review, post-season assurance, and material organizational commitment.
    stakeholder_refs:
      - STK-V3-001
      - STK-V3-007
      - STK-V3-016
    product: House
    success_signal: >-
      Each governance forum has a defined purpose, decision scope, accountable function, and
      delegation limits, without asserting a standing committee or cadence absent organizational
      approval.
