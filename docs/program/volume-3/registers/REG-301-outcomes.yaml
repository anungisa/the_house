records:
  - id: OUT-V3-001
    statement: >-
      A target institutional operating model is defined across Curling Canada, PTSOs, clubs,
      reviewers, compliance, finance, support, technology stewardship, and external providers,
      with purpose, accountability, authority, and controls recorded per function.
    stakeholder_refs:
      - STK-V3-001
      - STK-V3-002
      - STK-V3-003
    product: House
    success_signal: >-
      Each institutional function has a documented operating definition distinguishing decision
      authority from operational execution.
    validation_status: stakeholder_validation_pending
    source_refs:
      - V3-01
      - V2-27
      - V2-28
  - id: OUT-V3-002
    statement: >-
      The three affiliation product pathways (continuity confirmation, renewal with
      remediation, new affiliation) are translated into operating practice across the full
      service lifecycle from opening to expiry and closure.
    stakeholder_refs:
      - STK-V3-003
      - STK-V3-004
      - STK-V3-005
    product: House
    success_signal: >-
      Each pathway has a defined operating model separating normal operation from exceptional
      and escalated handling.
    validation_status: stakeholder_validation_pending
    source_refs:
      - V3-02
      - V2-07
      - V2-19
  - id: OUT-V3-003
    statement: >-
      Functional roles, accountable decisions, delegation, conflict restrictions, and
      segregation-of-duty controls are defined without committing to permanent named staffing
      or headcount.
    stakeholder_refs:
      - STK-V3-005
      - STK-V3-007
      - STK-V3-008
    product: House
    success_signal: >-
      Every operating role has accountable decisions, prohibited actions, delegation, and
      segregation-of-duty controls recorded.
