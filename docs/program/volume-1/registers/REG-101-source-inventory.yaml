    classification: observed_evidence
    authority_note: >-
      Product and experience evidence only, not production authority (V0-06).
      Assessed as a prototype: reusable value is qualified, prototype behaviour
      and hardcoded assumptions are rejected. SRC-001 is bound to the program's
      DECLARED CURRENT Base44 export (curl-link-hub (7).zip). The prior export
      (curl-link-hub (5).zip), on which the original Package 2 assessment was
      mistakenly based, is retained as historical source SRC-009.
    custodian: Aubert Nungisa (Accountable Program Authority)
    location: legacy/curl-link-hub-7-extracted (extracted from legacy/curl-link-hub (7).zip)
    controlled: true
    fingerprint:
      filename: curl-link-hub (7).zip
      sha256: 50d94c56a40caf853bffa3ede8183a9b424dd2874ceccd5fa8cc1247ca1d0412
      size_bytes: 3336492
      ingestion_date: '2026-07-25'
      extraction_location: legacy/curl-link-hub-7-extracted
      export_type: Base44 application export (frontend source + entity schemas + Deno serverless functions)
      generation_date: '2025-07-25'
      prior_export_relationship: >-
        Seventh captured export in the curl-link-hub series (archive suffix
        "(7)"). This is the program's declared current-state Base44 export and
        is the authoritative baseline for the corrected Package 2 assessment.
        The fifth export (SRC-009, curl-link-hub (5).zip) is a strict subset of
        this export and is superseded for current-state qualification; see
        generated/base44/delta-5-to-7.json for the deterministic delta.
      includes_generated_assets: true
      includes_dependencies: false
      excluded_material:
        - node_modules (dependencies not vendored in the archive; reinstall required to run)
        - Base44 platform runtime and hosted database state (not exportable)
        - Live secrets and environment configuration (not present in export)
      reproducibility_note: >-
        Archive lists 1576 files; extraction (excluding node_modules) yields
        exactly 1576 files. Extraction is clean and reproducible. All corrected
        Package 2 counts are regenerated mechanically by
        npm run qualification:base44 -- --source-id SRC-001.
    qualification_status: in_assessment
    evidence_rating: E3
    notes: >-
      Structural evidence (routes, entities, functions, access model) is E3
      DEMONSTRATED via cryptographic fingerprint and reproducible deterministic
      extraction against the CURRENT export (7). Product-value and
      stakeholder-acceptance claims about those surfaces remain capped at E1
      pending independent stakeholder evidence and are rated per item in
      REG-102. Corrected current-state counts: 155 routes, 95 entities, 101
      server functions, 151 pages, 604 components, 288 markdown documents.
