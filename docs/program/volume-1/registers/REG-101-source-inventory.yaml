register_id: REG-101
name: Source Inventory
status: IN_REVIEW
version: 0.4.0
# Controlled assessment sources for Volume 1 current-state qualification.
# Package 2 hardens SRC-001 with an immutable source fingerprint (SHA-256) so a
# later Base44 export cannot silently replace the evidence baseline under the
# same source id, and records the material internal sub-corpora discovered in
# the export (SRC-004..SRC-008).
#
# v0.3.0 (Package 2 corrective amendment, DEC-V1-011): SOURCE BASELINE
# CORRECTION. The original Package 2 assessment fingerprinted and inventoried
# curl-link-hub (5).zip, but the program's declared CURRENT Base44 export is
# curl-link-hub (7).zip. This amendment repoints SRC-001 (and its sub-corpora
# SRC-004..SRC-008) at the current export (7) and registers the superseded (5)
# export as a NEW immutable historical source SRC-009 for longitudinal
# comparison. The (5) fingerprint and its evidence trail are preserved, not
# deleted. Source ids follow the schema pattern ^SRC-[0-9]{3}$; the historical
# export therefore takes a distinct numeric id rather than a SRC-001 suffix.
#
# v0.4.0 (Package 3, House implementation qualification): HARDEN SRC-002 with an
# immutable repository/runtime fingerprint (assessed commit 51795ca; true
# runtime-tree last-change commit de6312f8 over src + db/migrations only; src and
# migration tree digests) so a later House commit cannot silently replace the
# assessed baseline under the same source id. Registers the material House
# implementation sub-corpora discovered by the deterministic qualification:house
# tooling (SRC-010..SRC-015). The runtime-vs-documentation distinction is
# explicit: everything committed after de6312f8 is documentation-program work,
# not application-runtime change.
