register_id: REG-101
name: Source Inventory
status: IN_REVIEW
version: 0.3.0
# Controlled assessment sources for Volume 1 current-state qualification.
# Package 2 hardens SRC-001 with an immutable source fingerprint (SHA-256) so a
# later Base44 export cannot silently replace the evidence baseline under the
# same source id, and records the material internal sub-corpora discovered in
# the export (SRC-004..SRC-008).
#
# v0.3.0 (Package 2 corrective amendment, DEC-V1-011): SOURCE BASELINE
# CORRECTION. The original Package 2 assessment fingerprinted and inventoried
# curl-link-hub (5).zip, but the program's declared CURRENT Base44 export is
# curl-link-hub (7).zip. This amendment repoints SRC-001 (and its sub-corpora
# SRC-004..SRC-008) at the current export (7) and registers the superseded (5)
# export as a NEW immutable historical source SRC-009 for longitudinal
# comparison. The (5) fingerprint and its evidence trail are preserved, not
# deleted. Source ids follow the schema pattern ^SRC-[0-9]{3}$; the historical
# export therefore takes a distinct numeric id rather than a SRC-001 suffix.
records:
  - id: SRC-001
    name: Base44 export (current declared product and experience prototype)
    source_type: base44_repository
    classification: observed_evidence
    authority_note: >-
      Product and experience evidence only, not production authority (V0-06).
      Assessed as a prototype: reusable value is qualified, prototype behaviour
      and hardcoded assumptions are rejected. SRC-001 is bound to the program's
      DECLARED CURRENT Base44 export (curl-link-hub (7).zip). The prior export
      (curl-link-hub (5).zip), on which the original Package 2 assessment was
      mistakenly based, is retained as historical source SRC-009.
    custodian: Aubert Nungisa (Accountable Program Authority)
    location: legacy/curl-link-hub-7-extracted (extracted from legacy/curl-link-hub (7).zip)
    controlled: true
    fingerprint:
      filename: curl-link-hub (7).zip
      sha256: 50d94c56a40caf853bffa3ede8183a9b424dd2874ceccd5fa8cc1247ca1d0412
      size_bytes: 3336492
      ingestion_date: '2026-07-25'
      extraction_location: legacy/curl-link-hub-7-extracted
      export_type: Base44 application export (frontend source + entity schemas + Deno serverless functions)
      generation_date: '2025-07-25'
      prior_export_relationship: >-
        Seventh captured export in the curl-link-hub series (archive suffix
        "(7)"). This is the program's declared current-state Base44 export and
        is the authoritative baseline for the corrected Package 2 assessment.
        The fifth export (SRC-009, curl-link-hub (5).zip) is a strict subset of
        this export and is superseded for current-state qualification; see
        generated/base44/delta-5-to-7.json for the deterministic delta.
      includes_generated_assets: true
      includes_dependencies: false
      excluded_material:
        - node_modules (dependencies not vendored in the archive; reinstall required to run)
        - Base44 platform runtime and hosted database state (not exportable)
        - Live secrets and environment configuration (not present in export)
      reproducibility_note: >-
        Archive lists 1576 files; extraction (excluding node_modules) yields
        exactly 1576 files. Extraction is clean and reproducible. All corrected
        Package 2 counts are regenerated mechanically by
        npm run qualification:base44 -- --source-id SRC-001.
    qualification_status: in_assessment
    evidence_rating: E3
    notes: >-
      Structural evidence (routes, entities, functions, access model) is E3
      DEMONSTRATED via cryptographic fingerprint and reproducible deterministic
      extraction against the CURRENT export (7). Product-value and
      stakeholder-acceptance claims about those surfaces remain capped at E1
      pending independent stakeholder evidence and are rated per item in
      REG-102. Corrected current-state counts: 155 routes, 95 entities, 101
      server functions, 151 pages, 604 components, 288 markdown documents.
  - id: SRC-002
    name: The House v2 repository (production-candidate implementation)
    source_type: house_repository
    classification: implementation_truth
    authority_note: >-
      Production-candidate implementation truth, not established production truth
      (V0-06 DEC-V0-002). Assessed against the constitutional requirements for
      retain/harden/rebuild dispositions. Registered as a controlled source;
      substantive qualification deferred to Volume 1 Package 3.
    custodian: Aubert Nungisa (Accountable Program Authority)
    location: ccacurling/the_house (this repository)
    controlled: true
    fingerprint:
      baseline_commit: 33c4d440112f43e0b7b7a2544c08f8b6cd0408e5
      branch: docs/volume-1-base44-qualification
      repository_remote: https://github.com/ccacurling/the_house.git
      working_tree_state: clean
      assessment_date: '2026-07-25'
      dependency_install_status: node_modules installed at assessment time
      validation_limitations:
        - >-
          Package 2 fingerprints The House baseline for provenance only;
          substantive House qualification is deferred to Package 3.
        - >-
          The recorded commit is the Package 1 closure commit; House runtime,
          database, and deployment state are not assessed in Package 2.
    qualification_status: registered
    evidence_rating: E1
    notes: >-
      Existence of the codebase is directly demonstrable, but its qualified
      current-state disposition is not yet assessed (E1 until Package 3).
  - id: SRC-003
    name: Volume 0 Program Constitution (ratified baseline)
