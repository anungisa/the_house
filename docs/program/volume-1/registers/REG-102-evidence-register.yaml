    notes: >-
      Extraction method: analyze-base44-routes.mjs regex over Route nodes.
      Reproducible via npm run qualification:base44 -- --source-id SRC-001.
      Current export (7); historical (5) reported 148 routes (none=45,
      RoleGate=82, ProtectedRoute=18) at generated/base44/historical-5/. The 7
      net-new routes are /iebok/* and /jobs* (delta-5-to-7.json). Limitation:
      dynamic/param routes counted by literal declaration only.
