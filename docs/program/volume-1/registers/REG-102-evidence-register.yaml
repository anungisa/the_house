# Reviewable evidence items supporting Volume 1 Package 2 (Base44) findings and
# dispositions. Each entry cites a controlled source (REG-101), a reviewable
# location, an artifact type, and an evidence rating (E0-E4). Structural items
# are E3 (reproducible deterministic extraction); product-value and stakeholder
# claims are capped lower pending independent evidence. Notes record extraction
# method, reproducibility, and limitations.
#
# v0.3.0 (Package 2 corrective closure, DEC-V1-011): every evidence record was
# reconciled to the program's DECLARED CURRENT Base44 export (SRC-001,
# curl-link-hub (7)). EV-001..EV-016 now report current-export (7) counts and
# cite the (7) extraction (legacy/curl-link-hub-7-extracted) and the
# regenerated deterministic artifacts (generated/base44/*.json); the superseded
# (5) equivalents are preserved at generated/base44/historical-5/*.json under
# historical source SRC-009 (REG-101). EV-017..EV-022 add current-export
# evidence for the source manifest/fingerprint, the (5)->(7) delta, the two
# domains missed by the original (5) assessment (IEBOK -> CAP-017, Jobs board ->
# CAP-018), the re-verified affiliation lifecycle, and the preserved historical
# (5) baseline. The evidence lineage is therefore SRC-001 (current export) ->
# generated extraction artifact -> EV current evidence record -> FND current
# finding (REG-104) -> QD qualification decision (REG-106).
