      Determine that the discrepancy is a parser-semantics artifact, not a
      defect. The static Package 3 figure (1326) is a lexical it/test token count
      that includes tokens appearing in comments and strings and cannot expand
      it.each() blocks; the executed figure (1300 passed, 0 skipped, 0 todo, 0
      excluded, 99 files, npx vitest run tests/unit, 2026-07-25) is the true
      runtime case count. The controlling figure for Volume 1 is 1300 executed and
      passed. This is a narrow evidence correction recorded in the Package 5 layer
      (REG-101 SRC-023, REG-102 EV-052) and does NOT reopen or modify the frozen
      Package 3 artifacts (V1-C, Package 3 chapters).
