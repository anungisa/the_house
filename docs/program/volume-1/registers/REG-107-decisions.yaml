  - id: DEC-V1-025
    class: D2
    question: >-
      What convergence methodology and evidence-precedence rules govern the
      Volume 1 target disposition, and are they adopted?
    decision: >-
      Adopt the Package 5 convergence methodology recorded in V1-21 and the
      controlled convergence input (REG-101 SRC-022): the three ratified
      baselines (Base44 product intelligence, The House implementation truth, and
      the Curling Canada operating and ecosystem reality) are converged under
      explicit evidence-precedence rules in which claim type determines
      controlling evidence. Newer, implemented, or more polished evidence is not
      automatically authoritative; a source authoritative for one claim type is
