register_id: REG-107
name: Volume 1 Governance Decision Register
status: IN_REVIEW
version: 0.2.0
# Governance decisions for Volume 1 itself (document ratifications, methodology
# adoption, gate dispositions, package closure). Distinct from REG-106, which
# records per-capability qualification dispositions.
records:
  - id: DEC-V1-001
    class: D1
    question: Does Volume 1 inherit and preserve the Volume 0 constitutional controls?
    decision: >-
      Volume 1 inherits all Volume 0 controls unchanged and must not weaken audit,
      evidence, idempotency, tenancy, authority, or ratification controls. Volume 0
      remains frozen at central-registration-volume-0-v1.0.0 (d897b13); Volume 1
      work never modifies Volume 0 artifacts.
    evidence_refs:
      - V1-00
      - REG-101
    approver: Aubert Nungisa (Accountable Program Authority)
    evidence_label: SELF-ATTESTED / AUTHOR-VERIFIED
    executive_acceptance: pending
    effective_date: TBD
    status: accepted_by_accountable_authority
  - id: DEC-V1-002
    class: D1
    question: What methodology governs current-state qualification?
    decision: >-
      Adopt the V1-01 qualification methodology: source-classified, evidence-rated,
      capability-oriented assessment that separates validated value from unsafe
      assumptions and does not authorize implementation from findings alone.
    evidence_refs:
      - V1-01
    approver: Aubert Nungisa (Accountable Program Authority)
    evidence_label: SELF-ATTESTED / AUTHOR-VERIFIED
    executive_acceptance: pending
    effective_date: TBD
    status: accepted_by_accountable_authority
  - id: DEC-V1-003
    class: D1
    question: What source classifications and evidence-quality scale apply?
    decision: >-
      Adopt the V1-02 source-and-evidence model (eight source classifications) and
      the V1-04 evidence-quality scale (E0-E4). A recent timestamp must not
      automatically raise evidence quality.
    evidence_refs:
      - V1-02
      - V1-04
    approver: Aubert Nungisa (Accountable Program Authority)
    evidence_label: SELF-ATTESTED / AUTHOR-VERIFIED
    executive_acceptance: pending
    effective_date: TBD
    status: accepted_by_accountable_authority
  - id: DEC-V1-004
    class: D1
    question: What disposition vocabulary governs capability qualification?
    decision: >-
      Adopt the V1-03 disposition standard with eight values: ADOPT, ADAPT,
      CONSOLIDATE, RETAIN, REBUILD, DEFER, EXTERNALIZE, RETIRE. RETAIN and REBUILD
      are added as implementation classifications for the production-candidate
      foundation.
    evidence_refs:
      - V1-03
    approver: Aubert Nungisa (Accountable Program Authority)
    evidence_label: SELF-ATTESTED / AUTHOR-VERIFIED
    executive_acceptance: pending
    effective_date: TBD
    status: accepted_by_accountable_authority
  - id: DEC-V1-007
    class: D1
    question: Is Volume 1 Package 1 reviewed, closed, and frozen?
    decision: >-
      Close and freeze Volume 1 Package 1. The qualification framework and source
      control machinery are complete and validated by the governance toolchain
      with zero errors. Chapters V1-00..V1-04 and this closure record V1-A are
      frozen at v1.0.0; further change requires the recorded amendment process.
    evidence_refs:
      - V1-A
      - GATE-V1-G1
    approver: Aubert Nungisa (Accountable Program Authority)
    evidence_label: SELF-ATTESTED / AUTHOR-VERIFIED
    executive_acceptance: pending
    effective_date: TBD
    status: accepted_by_accountable_authority
  - id: DEC-V1-005
    class: D1
    question: How are the Base44 export and The House repository entered into Volume 1?
    decision: >-
      Register the Base44 export (SRC-001) and The House repository (SRC-002) as
      controlled assessment sources only. Substantive capability qualification of
      each is deferred to Volume 1 Packages 2 and 3 respectively and is not begun
      in Package 1.
    evidence_refs:
      - REG-101
    approver: Aubert Nungisa (Accountable Program Authority)
    evidence_label: SELF-ATTESTED / AUTHOR-VERIFIED
    executive_acceptance: not_required
    effective_date: TBD
    status: accepted_by_accountable_authority
  - id: DEC-V1-006
    class: D1
    question: Is the Volume 1 qualification system ready (Gate V1-G1)?
    decision: >-
      Gate V1-G1 (Qualification System Ready) disposition PASS. Volume 0 controls
      inherited; method, source classifications, disposition vocabulary, evidence
      scale, and contradiction handling defined; registers schema-validated by the
      governance toolchain; no implementation authorized by Volume 1 findings alone.
      Executive organizational acceptance remains a time-bounded condition.
    evidence_refs:
      - V1-00
      - V1-01
      - V1-02
      - V1-03
      - V1-04
      - GATE-V1-G1
    approver: Aubert Nungisa (Accountable Program Authority)
    evidence_label: SELF-ATTESTED / AUTHOR-VERIFIED
    executive_acceptance: pending
    effective_date: TBD
    status: accepted_by_accountable_authority
  - id: DEC-V1-008
    class: D1
    question: How is the Base44 export substantively qualified in Package 2?
    decision: >-
      Apply the V1-01 methodology to the Base44 export (SRC-001). Fix the export by
      cryptographic fingerprint; decompose it into controlled sub-sources
      (SRC-004..008) separating implementation truth from design-intent narrative;
      extract a reproducible technical inventory (npm run qualification:base44);
      normalize 16 capabilities (REG-103) with evidence (REG-102) and findings
      (REG-104); register contradictions (REG-105); and record per-capability
      dispositions (REG-106). No Base44 capability is dispositioned ADOPT or RETAIN,
      and every Package 2 qualification decision sets authorizes_implementation
      false. Chapters V1-05..V1-09 record the result.
    evidence_refs:
      - V1-05
      - V1-06
      - V1-07
      - V1-08
      - V1-09
      - REG-101
      - REG-102
      - REG-103
      - REG-104
      - REG-105
      - REG-106
    approver: Aubert Nungisa (Accountable Program Authority)
    evidence_label: SELF-ATTESTED / AUTHOR-VERIFIED
    executive_acceptance: pending
    effective_date: TBD
    status: accepted_by_accountable_authority
  - id: DEC-V1-009
    class: D1
    question: Is Base44 qualification complete (Gate V1-G2)?
    decision: >-
      Gate V1-G2 (Base44 Qualification Complete) disposition PASS. The export is
      cryptographically fingerprinted; the inventory is reproducible; material
      routes, entities, and functions are inventoried; every normalized capability
      has evidence and a disposition or an explicit unresolved state;
      security/prototype debt is recorded separately from product value; the
      affiliation journey is assessed at journey level; contradictions are
      registered; no Base44 implementation is declared production-authoritative;
      and no application development is authorized from Package 2 alone. Line-level
      closure and freeze are recorded separately in V1-B. Executive organizational
      acceptance remains a time-bounded condition.
    evidence_refs:
      - V1-05
      - V1-06
      - V1-07
      - V1-08
      - V1-09
      - GATE-V1-G2
    approver: Aubert Nungisa (Accountable Program Authority)
    evidence_label: SELF-ATTESTED / AUTHOR-VERIFIED
    executive_acceptance: pending
    effective_date: TBD
    status: accepted_by_accountable_authority
