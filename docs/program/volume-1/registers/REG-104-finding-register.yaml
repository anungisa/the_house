    finding_type: capability_gap
    evidence_rating: E3
    source_refs: [SRC-001, SRC-004, SRC-008, EV-018, EV-019]
    capability_refs: [CAP-017]
    production_risk: unknown
    recommended_disposition: DEFER
    status: open
    current_state_validation: NEW_IN_CURRENT
    notes: >-
