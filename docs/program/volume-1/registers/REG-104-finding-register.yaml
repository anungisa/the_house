    finding_type: capability_gap
    evidence_rating: E1
    source_refs: [EV-013, CAP-003]
    capability_refs: [CAP-003]
    production_risk: unknown
    recommended_disposition: DEFER
    status: open
    current_state_validation: CONFIRMED_IN_CURRENT
    notes: Revisit after the affiliation and registry spine is established.
