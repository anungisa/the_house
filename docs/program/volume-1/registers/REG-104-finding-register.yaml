register_id: REG-104
name: Finding Register
status: IN_REVIEW
version: 0.3.1
# Qualification findings from Package 2 (Base44). Findings are grouped by
# character: PRODUCT VALUE (reusable intelligence), PRODUCTION RISK (why the
# prototype must not become production authority), and UNKNOWN/CONSTRAINT (open
# evidence questions). A finding does not authorize implementation on its own
# (Volume 1 operating rule; Gate V1-G1).
#
# v0.3.0 (Package 2 corrective amendment, DEC-V1-011): every finding was
# revalidated against the current declared export (SRC-001, curl-link-hub (7))
# after the source-baseline defect was discovered. Each record carries a
# current_state_validation tag. Findings are NOT auto-carried: the (5)->(7)
# delta (generated/base44/delta-5-to-7.json) is strictly additive (zero removed
# routes/entities/functions), so every prior finding reproduces against (7);
# count-bearing statements were refreshed to (7) evidence. Two capability
# domains present in (7) but absent from (5) (IEBOK, Jobs board) were missed by
# the original assessment and are recorded as NEW_IN_CURRENT (FND-021, FND-022).
records:
  # --- PRODUCT VALUE ---
  - id: FND-001
    statement: >-
      Base44's tiered affiliation review (club submission -> PTSO review -> CC
      review, with a more-information loop) is a coherent, reusable product
      concept for the first governed vertical.
    finding_type: reusable_value
    evidence_rating: E2
    source_refs: [EV-006, EV-015, CAP-001]
    capability_refs: [CAP-001]
    production_risk: medium
    recommended_disposition: ADAPT
    status: corroborated
    current_state_validation: CONFIRMED_IN_CURRENT
    notes: >-
      The concept is valuable; the direct-mutation implementation is not.
      Confirmed in current export (7): Application entity retains the
      submitted/ptso_review/cc_review/more_info_needed lifecycle.
  - id: FND-002
    statement: >-
      The Curling Canada -> PTSO -> Club -> Member hierarchy and an org_id-scoped
      tenancy concept form a valid, reusable organizational model.
    finding_type: reusable_value
    evidence_rating: E2
    source_refs: [EV-002, EV-012, CAP-002]
    capability_refs: [CAP-002]
    production_risk: medium
    recommended_disposition: ADAPT
    status: corroborated
    current_state_validation: CONFIRMED_IN_CURRENT
    notes: Reuse the model; rebuild the enforcement on DB-level tenancy.
  - id: FND-003
    statement: >-
      Compliance, consent, waiver, and safe-sport concepts are present and
      relevant to Curling Canada's obligations.
    finding_type: reusable_value
    evidence_rating: E2
    source_refs: [EV-002, CAP-006]
    capability_refs: [CAP-006]
    production_risk: medium
    recommended_disposition: ADAPT
    status: open
    current_state_validation: CONFIRMED_IN_CURRENT
    notes: Concepts reusable; audited enforcement must be built in the House.
  - id: FND-004
    statement: >-
      A payments/fees capability was explored with a recognized processor
      (Stripe), establishing fee handling as a real product need.
    finding_type: reusable_value
    evidence_rating: E2
    source_refs: [EV-008, CAP-008]
    capability_refs: [CAP-008]
    production_risk: high
    recommended_disposition: EXTERNALIZE
    status: open
    current_state_validation: CONFIRMED_IN_CURRENT
    notes: >-
      The need is real; payment execution should be externalized and
      reconciled. Stripe dependency present in (7) (dependency set identical to
      (5)).
  - id: FND-020
    statement: >-
      The national decision-governance surfaces (decision instances, approval
      tiers, workflow steps) contain reusable governance intelligence about how
      Curling Canada makes authoritative decisions.
    finding_type: reusable_value
    evidence_rating: E2
    source_refs: [EV-011, CAP-012]
    capability_refs: [CAP-012]
    production_risk: high
    recommended_disposition: REBUILD
    status: open
    current_state_validation: CONFIRMED_IN_CURRENT
    notes: Mine the concepts; rebuild the mechanism in the Governance Kernel.
  # --- PRODUCTION RISK ---
  - id: FND-005
    statement: >-
      68 of 101 server functions mutate entities with no server-side permission
      check (only 2 of 101 reference any permission check), so authorization is
      effectively absent on the write path.
    finding_type: production_readiness_gap
    evidence_rating: E3
    source_refs: [EV-003, EV-007, CAP-014]
    capability_refs: [CAP-014, CAP-001]
    production_risk: critical
    recommended_disposition: REBUILD
    status: corroborated
    current_state_validation: CONFIRMED_IN_CURRENT
    notes: >-
      Disqualifies the server layer as production authority as-is. Confirmed and
      marginally worse in current export (7): 68/101 mutate without a check vs
      66/99 in historical (5); permission-check coverage remains 2.
  - id: FND-006
    statement: >-
      80 of 101 server functions execute with elevated privilege via asServiceRole,
      amplifying the impact of the missing authorization checks.
    finding_type: production_readiness_gap
    evidence_rating: E3
    source_refs: [EV-014, CAP-014]
    capability_refs: [CAP-014]
    production_risk: critical
    recommended_disposition: REBUILD
    status: corroborated
    current_state_validation: CONFIRMED_IN_CURRENT
    notes: >-
      Service-role breadth turns any missing check into a privilege-escalation
      path. Confirmed and worse in (7): 80/101 use asServiceRole vs 78/99 in (5).
  - id: FND-007
    statement: >-
      Authorization is client-side (RoleGate) and default-open: canAccessPath
      treats unknown paths as accessible, so access control fails open rather than
      closed.
    finding_type: architectural_accident
    evidence_rating: E3
    source_refs: [EV-004, EV-016, CAP-014]
    capability_refs: [CAP-014]
    production_risk: critical
    recommended_disposition: REBUILD
    status: corroborated
    current_state_validation: CONFIRMED_IN_CURRENT
    notes: >-
      Fails the House fail-closed doctrine; must be rebuilt server-side.
      Confirmed in (7): unknown_path_defaults_open remains true.
  - id: FND-008
    statement: >-
      83 routes hardcode role lists directly in App.jsx while the access matrix is
      declared the single source of truth, so displayed and enforced access can
      and do drift.
    finding_type: hardcoded_assumption
    evidence_rating: E3
    source_refs: [EV-001, EV-004, CAP-014]
    capability_refs: [CAP-014]
    production_risk: high
    recommended_disposition: REBUILD
    status: corroborated
    current_state_validation: CONFIRMED_IN_CURRENT
    notes: >-
      The single-source-of-truth claim is contradicted by the code (see
      CON-001). Confirmed and worse in (7): 83 route-role drift entries and 23
      routes missing from the matrix vs 82 and 18 in (5).
  - id: FND-009
    statement: >-
      The export contains no automated tests and no CI configuration, so no
      behaviour is regression-protected or independently verifiable from the code.
    finding_type: prototype_debt
    evidence_rating: E3
    source_refs: [EV-010]
    capability_refs: [CAP-014, CAP-001]
    production_risk: high
    recommended_disposition: REBUILD
    status: corroborated
    current_state_validation: CONFIRMED_IN_CURRENT
    notes: >-
      Absence in the export; corroborated by exhaustive file walk. Re-verified
      against (7) by the evidence-based tests/CI detector: 0 test files, no CI
      configuration, no runnable test script (tests-ci-inventory.json).
  - id: FND-010
    statement: >-
      Affiliation lifecycle is advanced by direct status mutation from functions
      and UI, with no transition guard, approval gate, or audit boundary in the
      code path.
    finding_type: hardcoded_assumption
    evidence_rating: E3
    source_refs: [EV-003, EV-006, CAP-001]
    capability_refs: [CAP-001]
    production_risk: high
    recommended_disposition: REBUILD
    status: corroborated
    current_state_validation: CONFIRMED_IN_CURRENT
    notes: Concept ADAPTED; mechanism REBUILT through the Governance Kernel.
  - id: FND-012
    statement: >-
      A generic workflow-builder surface exists, which conflicts directly with the
      House doctrine forbidding arbitrary JSON/expression workflow and rule
      builders.
    finding_type: architectural_accident
    evidence_rating: E2
    source_refs: [EV-001, EV-011, CAP-016]
    capability_refs: [CAP-016]
    production_risk: high
    recommended_disposition: RETIRE
    status: open
    current_state_validation: CONFIRMED_IN_CURRENT
    notes: >-
      The kernel provides versioned, typed transitions instead. Confirmed in
      (7): WorkflowStep.jsonc entity and src/pages/WorkflowBuilder.jsx persist.
  - id: FND-013
    statement: >-
      Tenancy/isolation is an app-layer construct: 93 of 95 entities carry
      Mongo-style rls blocks (not a database boundary) and org_id was retrofitted
      via a 100% backfill to Curling Canada.
    finding_type: production_readiness_gap
    evidence_rating: E3
    source_refs: [EV-002, EV-012, CAP-002]
    capability_refs: [CAP-002, CAP-014]
    production_risk: high
    recommended_disposition: REBUILD
    status: corroborated
    current_state_validation: CONFIRMED_IN_CURRENT
    notes: >-
      Must be rebuilt on Postgres row-level security; app-layer rls is not an
      isolation guarantee. Confirmed in (7): 93/95 entities carry rls blocks vs
      85/87 in (5).
  - id: FND-014
    statement: >-
      Payment readiness is represented by boolean flags (e.g. annual_fee_paid) on
      the Application entity rather than a reconciled external payment authority,
      risking state divergence from the processor.
    finding_type: hardcoded_assumption
    evidence_rating: E2
    source_refs: [EV-006, EV-008, CAP-008]
    capability_refs: [CAP-008, CAP-001]
    production_risk: critical
    recommended_disposition: EXTERNALIZE
    status: open
    current_state_validation: CONFIRMED_IN_CURRENT
    notes: >-
      Fee state must be reconciled against the processor, not asserted by a flag
      (see CON-004). Confirmed in (7): Application entity retains the
      annual_fee_paid boolean.
  - id: FND-019
    statement: >-
      Base44's direct-mutation and client-side authorization model conflicts with
      the House Program Constitution requiring all governed transitions to pass
      through the Governance Kernel; the prototype cannot be production authority.
    finding_type: authority_conflict
    evidence_rating: E2
    source_refs: [EV-003, EV-007, CAP-014]
    capability_refs: [CAP-001, CAP-012, CAP-014]
    production_risk: high
    recommended_disposition: REBUILD
    status: corroborated
    current_state_validation: CONFIRMED_IN_CURRENT
    notes: See CON-007; resolved by policy authority in favour of the governed kernel.
  # --- UNKNOWN / CONSTRAINT ---
