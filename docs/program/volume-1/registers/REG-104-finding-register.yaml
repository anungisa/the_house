register_id: REG-104
name: Finding Register
status: IN_REVIEW
version: 0.5.0
# Qualification findings from Package 2 (Base44). Findings are grouped by
# character: PRODUCT VALUE (reusable intelligence), PRODUCTION RISK (why the
# prototype must not become production authority), and UNKNOWN/CONSTRAINT (open
# evidence questions). A finding does not authorize implementation on its own
# (Volume 1 operating rule; Gate V1-G1).
#
# v0.3.0 (Package 2 corrective amendment, DEC-V1-011): every finding was
# revalidated against the current declared export (SRC-001, curl-link-hub (7))
# after the source-baseline defect was discovered. Each record carries a
# current_state_validation tag. Findings are NOT auto-carried: the (5)->(7)
# delta (generated/base44/delta-5-to-7.json) is strictly additive (zero removed
# routes/entities/functions), so every prior finding reproduces against (7);
# count-bearing statements were refreshed to (7) evidence. Two capability
# domains present in (7) but absent from (5) (IEBOK, Jobs board) were missed by
# the original assessment and are recorded as NEW_IN_CURRENT (FND-021, FND-022).
records:
