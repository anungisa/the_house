    finding_type: constraint
    evidence_rating: E2
    source_refs: [EV-011, CAP-012]
    capability_refs: [CAP-012]
    production_risk: unknown
    recommended_disposition: DEFER
    status: open
    current_state_validation: CONFIRMED_IN_CURRENT
