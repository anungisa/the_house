  - id: CAP-028
    name: Idempotency enforcement
    description: >-
      Every transition request carries an idempotency key enforced across a
      kernel pre-check, an in-transaction double-check, and a stable outbox
      dedupe key, so retries do not duplicate transitions, audit events,
      evidence, or outbox messages.
    stakeholder: Platform / integrations
    business_capability: Safe retries
    observed_value: >-
      Multi-layer idempotency implemented in the kernel and outbox (EV-025,
      EV-028).
    target_house_domain: Governance Kernel (platform core)
    target_button_experience: N/A (platform core)
    disposition: RETAIN
    production_risk: low
    evidence_rating: E3
    source_refs: [SRC-002, SRC-011]
    notes: >-
      Retain. Database-level uniqueness and dedupe are present in source; runtime
      proof depends on the DB-gated suites (FND-028).
  - id: CAP-029
    name: Fail-closed configuration and secret providers
