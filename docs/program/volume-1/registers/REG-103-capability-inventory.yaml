    stakeholder: Platform security
    business_capability: Coarse-grained access control
    observed_value: >-
      A clean fail-closed edge authorization surface (EV-026); appropriate as a
      first gate.
    target_house_domain: Authorization (platform core)
    target_button_experience: N/A (platform core)
    disposition: ADAPT
    production_risk: high
    evidence_rating: E3
    source_refs: [SRC-002, SRC-011]
    finding_refs: [FND-023]
    notes: >-
      Adapt: governed affiliation authority is role-based only and NOT
