register_id: REG-103
name: Capability Inventory
status: IN_REVIEW
version: 0.5.0
# Normalized capabilities observed in the Base44 export (SRC-001). ONE record per
# real capability, not one per route. Dispositions here are the proposed target
# treatment; the governed decision (with rationale and evidence) is recorded in
# REG-106 and authorizes no implementation. No Base44 capability is dispositioned
# ADOPT or RETAIN: the prototype's architecture disqualifies as-is adoption, and
# RETAIN (production-candidate) applies to The House (Package 3), not Base44.
#
# v0.3.0 (Package 2 corrective amendment, DEC-V1-011): all dispositions were
# reassessed against the current declared export (SRC-001, curl-link-hub (7)).
# Because the (5)->(7) delta is strictly additive and every underlying finding
# is CONFIRMED_IN_CURRENT (REG-104), the sixteen original dispositions are
# REAFFIRMED unchanged on current evidence. Two capability domains present in
# (7) but absent from (5) (IEBOK, Jobs board), missed by the original
# assessment, are added as CAP-017 and CAP-018 with disposition DEFER pending a
# dedicated assessment.
