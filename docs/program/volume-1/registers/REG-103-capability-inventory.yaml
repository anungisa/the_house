  # --- Package 4: current ecosystem and operating-reality capabilities (CAP-031..036) ---
  - id: CAP-031
    name: External-system authority and boundary mapping
    description: >-
      A structured authority matrix over the ecosystem: each external system and
      manual control is mapped to a bounded authority (synchronization partner,
      transition platform, execution plane, external system of record,
      replaceable provider, reporting source, manual control) with explicit
      reconciliation boundaries and authority tiers (national/provincial/club/
      individual).
    stakeholder: Curling Canada, Member Associations/PTSOs
    business_capability: Ecosystem authority governance
    observed_value: >-
      SYS-001..008 authority classifications are grounded in ratified Volume 0
      (REG-005/V0-06); SYS-009..012 are unvalidated and flagged.
    target_house_domain: Identity/authority context (platform core)
    disposition: null
    production_risk: medium
    evidence_rating: E2
    source_refs: [SRC-016, SRC-017]
    finding_refs: [FND-039]
    notes: >-
      No system is automatically retained or retired; target dispositions are
      UNPROVEN hypotheses recorded in the input, not decisions.
  - id: CAP-032
    name: Current club-affiliation operating process
    description: >-
      The end-to-end current process by which a club is affiliated: identity,
