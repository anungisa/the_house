    target_house_domain: Deployment / tooling (platform core)
    target_button_experience: N/A (platform core)
    disposition: RETAIN
    production_risk: medium
    evidence_rating: E2
    source_refs: [SRC-002, SRC-014]
    finding_refs: [FND-029]
    notes: >-
      Retain the validators; they verify baselines, not a deployed environment.
