      an affiliation release.
  - id: CAP-026
    name: Affiliation application governed lifecycle
    description: >-
      The first vertical slice: a 10-state / 12-transition AffiliationApplication
      lifecycle on the Governance Kernel with six guards, evidence/approval
      requirements, and a transition HTTP endpoint.
    stakeholder: Clubs, PTSOs, Curling Canada
    business_capability: Affiliation lifecycle management
    observed_value: >-
      The governed transition backbone exists and is wired to PostgreSQL
      (EV-027, EV-030); the strongest candidate for the first complete release.
    target_house_domain: Affiliation domain
    target_button_experience: Affiliation application experience (The Button)
    disposition: ADAPT
    production_risk: high
    evidence_rating: E3
    source_refs: [SRC-002, SRC-011, SRC-012]
    finding_refs: [FND-023, FND-024, FND-025, FND-026, FND-027, FND-031]
    notes: >-
      Retain the governed lifecycle; adapt to close the release-blocking gaps:
      no create/bootstrap path (FND-026), role-only authorization (FND-023), no
      reviewer routing (FND-024), evidence upload not wired (FND-025), no
      return-for-information/resubmission (FND-027), no versioned requirements
      (FND-031).
  - id: CAP-027
    name: Reference-data registries (organization, participant, facility)
    description: >-
      Organization, participant, and facility registries backed by RLS-enforced
      PostgreSQL stores with HTTP read/write adapters, supplying the reference
      data affiliation guards depend on.
    stakeholder: All tenants
    business_capability: Master/reference data
    observed_value: >-
      Registries are wired into the production composition (EV-030) and provide
      the facts guards evaluate.
    target_house_domain: Registry domains
    target_button_experience: Directory / registry surfaces (candidate)
    disposition: RETAIN
    production_risk: medium
    evidence_rating: E3
    source_refs: [SRC-002, SRC-012]
    notes: >-
