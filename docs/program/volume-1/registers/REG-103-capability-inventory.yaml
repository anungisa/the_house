  - id: CAP-019
    name: Governance Kernel lifecycle state machine
    description: >-
      A single authority for governed lifecycle transitions implementing the
      full ordered transition() algorithm: fail-closed transition/guard/
      permission resolution, entity-state locking, guard evaluation and
      persistence, approval-branch without premature mutation, and atomic write
      of state, transition journal, audit event, evidence metadata, and outbox
      row in one transaction.
    stakeholder: Curling Canada, PTSOs
    business_capability: Governed state management
    observed_value: >-
      Implements the constitutional kernel requirement in source (EV-025). This
      is the platform's central production VALUE and the reason The House is the
      production candidate.
    target_house_domain: Governance Kernel (platform core)
    target_button_experience: N/A (platform core)
    disposition: ADOPT
    production_risk: low
    evidence_rating: E3
    source_refs: [SRC-002, SRC-011]
    finding_refs: [FND-032]
    notes: >-
      Retain and harden. Structural implementation is E3; end-to-end governed
      behaviour against a database is unproven under the default hermetic run
      (FND-028).
  - id: CAP-020
    name: Transactional outbox and lease-based worker
    description: >-
      Outbox rows enqueued inside the transition transaction; a leased worker
      claims rows via FOR UPDATE SKIP LOCKED with locked_until/locked_by,
      publishes after commit, and retries transient failures with true full
      jitter. Real Azure Service Bus publisher present but config-gated; default
      is a Noop publisher. Sessions are not enabled in v1.
    stakeholder: Platform / integrations
    business_capability: Reliable at-least-once side-effect delivery
    observed_value: >-
      Correct transactional-outbox shape with leasing and jitter (EV-028); the
      right mechanism for deferring external side effects out of the governance
      transaction.
    target_house_domain: Governance Kernel / workers (platform core)
    target_button_experience: N/A (platform core)
    disposition: RETAIN
    production_risk: medium
    evidence_rating: E3
    source_refs: [SRC-002, SRC-011]
    finding_refs: [FND-030]
    notes: >-
      Retain the mechanism; harden by config-defaulting a real publisher for
      release environments and proving delivery against a broker. Default Noop is
      a production-readiness gap, not a design defect.
  - id: CAP-021
    name: Tenant isolation via forced row-level security
    description: >-
      Tenant-owned governance and registry tables carry tenant_id with RLS
      ENABLED and FORCED; application code sets app.tenant_id inside the
      transaction before governed access; global-policy catalog tables are
      intentionally tenant-nullable global configuration.
    stakeholder: All tenants (PTSOs, Curling Canada)
    business_capability: Multi-tenant data isolation
    observed_value: >-
      20 of 26 tables forced-RLS with tenant context set in-transaction
      (EV-024); a strong, database-enforced isolation posture.
    target_house_domain: Data layer (platform core)
    target_button_experience: N/A (platform core)
    disposition: RETAIN
    production_risk: low
    evidence_rating: E3
    source_refs: [SRC-002, SRC-010]
    notes: >-
      Retain. Cross-schema parent references are not DB foreign keys by design
      (single RLS isolation mechanism); this is registered as CON-011, not a
      defect.
  - id: CAP-022
    name: Named guard registry
    description: >-
      Governed transitions are gated by named, read-only TypeScript guard
      handlers registered in a registry; unknown guard codes fail closed. The
      six seeded affiliation guard codes map exactly to six implemented handlers.
    stakeholder: Program governance
    business_capability: Policy-as-code preconditions
    observed_value: >-
      Deterministic, testable guard model with perfect seed-to-handler parity
      (EV-027); no dynamic JSON expression engine.
    target_house_domain: Governance Kernel (platform core)
    target_button_experience: N/A (platform core)
    disposition: RETAIN
    production_risk: low
    evidence_rating: E3
    source_refs: [SRC-002, SRC-011]
    notes: >-
      Retain. The reviewer-scope guard is role-only (see CAP-025/FND-023); the
      registry mechanism itself is sound.
  - id: CAP-023
    name: Evidence capture, scanning, and quarantine subsystem
    description: >-
      Pluggable evidence storage (in-memory / Azure Blob), signature malware
      scanning with a scan gate, quarantine service, and an RLS-enforced
      evidence store; kernel-created evidence metadata is written in the
      transition transaction and references the state transition.
    stakeholder: Program governance, auditors
    business_capability: Immutable evidence metadata
    observed_value: >-
      A complete evidence-handling subsystem with metadata bound to transitions
      in-transaction (EV-029).
    target_house_domain: Governance Kernel / evidence (platform core)
    target_button_experience: N/A (platform core)
    disposition: ADAPT
    production_risk: medium
    evidence_rating: E3
    source_refs: [SRC-002, SRC-011]
    finding_refs: [FND-025]
    notes: >-
      Retain the subsystem; adapt to wire the HTTP upload transport to the
      pending governed decision so evidence is captured as part of the flow.
  - id: CAP-024
    name: Approval workflow with exactly-once execution
    description: >-
      Approval-required transitions create a transition_request and workflow
      placeholder without mutating state; an ApprovedWorkflowExecutionService
      applies the approved transition exactly once via idempotent replay,
      request/entity locks, and state-drift fail-closed.
    stakeholder: Reviewers, approvers
    business_capability: Multi-step governed approval
    observed_value: >-
      Correct deferred-mutation and exactly-once activation semantics (EV-025,
      EV-027).
    target_house_domain: Governance Kernel / workflow (platform core)
    target_button_experience: N/A (platform core)
    disposition: RETAIN
    production_risk: medium
    evidence_rating: E3
    source_refs: [SRC-002, SRC-011]
    finding_refs: [FND-024]
    notes: >-
      Retain the execution engine; it lacks a reviewer-routing/assignment
      dispatcher (FND-024) to select WHO may execute a given request.
  - id: CAP-025
    name: Edge authorization action catalog
    description: >-
      A fail-closed catalog of edge actions and roles (platform_admin wildcard;
