register_id: REG-106
name: Qualification Decision Register
status: IN_REVIEW
version: 0.2.0
# Per-capability target dispositions for the Base44 corpus. These are decisions
# by the Accountable Program Authority about how each capability should be
# treated by the program; they are NOT construction authorization. Every Package
# 2 decision therefore sets authorizes_implementation=false and authorizing_gate=
# null. No Base44 capability is dispositioned ADOPT or RETAIN: the prototype's
# architecture disqualifies as-is adoption, and RETAIN (production-candidate)
# applies to The House assessment (Package 3), not to Base44.
records:
  - id: QD-001
    capability_ref: CAP-001
    disposition: ADAPT
    rationale: >-
      The tiered affiliation concept is the strongest reusable product asset, but
      the direct-mutation lifecycle must be rebuilt on the Governance Kernel.
    evidence_rating: E2
    evidence_refs: [CAP-001, FND-001, FND-010, EV-006]
    decided_by: Aubert Nungisa (Accountable Program Authority)
    decision_status: accepted_by_accountable_authority
    authorizes_implementation: false
    authorizing_gate: null
    notes: Concept adapted; mechanism rejected. Implementation awaits later authorization.
