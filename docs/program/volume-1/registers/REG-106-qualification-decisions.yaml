register_id: REG-106
name: Qualification Decision Register
status: IN_REVIEW
version: 0.6.0
# Per-capability target dispositions for the Base44 corpus. These are decisions
# by the Accountable Program Authority about how each capability should be
# treated by the program; they are NOT construction authorization. Every Package
# 2 decision therefore sets authorizes_implementation=false and authorizing_gate=
# null. No Base44 capability is dispositioned ADOPT or RETAIN: the prototype's
# architecture disqualifies as-is adoption, and RETAIN (production-candidate)
# applies to The House assessment (Package 3), not to Base44.
#
# v0.3.0 (Package 2 corrective closure, DEC-V1-011): every disposition was
# re-ratified against the program's DECLARED CURRENT Base44 export (SRC-001,
# curl-link-hub (7)). The (5)->(7) delta is strictly additive
# (generated/base44/delta-5-to-7.json, EV-018), so no prior disposition is
# reversed by the corrected baseline; each record now cites current-export
# evidence (REG-102 EV-001..EV-022) alongside its original findings. Two
# capability domains present in (7) but missed by the original (5) assessment
# are added as QD-017 (IEBOK, CAP-017) and QD-018 (Jobs board, CAP-018), both
# DEFER. All decisions remain authorizes_implementation=false: this closure
# re-ratifies dispositions, it does not authorize construction.
