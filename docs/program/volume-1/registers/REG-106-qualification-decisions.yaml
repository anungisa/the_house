    disposition: RETAIN
    rationale: >-
      The transactional outbox has correct shape (in-txn enqueue, lease-based
      claim, true full jitter, no sessions). Retain the mechanism; the default
      Noop publisher and the unproven broker path are production-readiness gaps
      to close before release (FND-030), not design defects.
    evidence_rating: E3
    evidence_refs: [CAP-020, FND-030, EV-028, SRC-011]
    decided_by: Aubert Nungisa (Accountable Program Authority)
    decision_status: accepted_by_accountable_authority
