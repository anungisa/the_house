    data_owned: Decision correspondence and evidence attachments
    authority_classification: manual_control (evidence outside governed store)
    inbound_flows: Correction requests, supporting documents
    outbound_flows: Approvals/decisions communicated by email
    reconciliation: >-
      Decisions and evidence live outside a governed store; audit and evidence
      binding are weak.
    contract_dependency: None
    known_limitation: >-
      Evidence and decisions are not bound to a governed transition; must not be
      recreated.
    target_disposition_hypothesis: RETIRE / replace with governed evidence binding (unvalidated)
    truth_classification: STAKEHOLDER_STATEMENT
    validation_status: pending_stakeholder_validation
    source_ref: null

# V1-16: current club-affiliation process, traced end to end. Each step is
# STAKEHOLDER_STATEMENT/ASSUMPTION pending club/PTSO validation unless it restates a
# ratified Volume 0 authority boundary.
affiliation_process:
  - step: 1
    name: Club identification or creation
    actor: Club administrator
    accountable_authority: Curling Canada (master-data intent), PTSO (jurisdiction)
    system_used: Incumbent registration provider / manual
    manual_artifact: Email, spreadsheet
    data_created: Prospective club record
    evidence_retained: Correspondence
    decision: Whether the club exists or must be created
    handoff: To prior-affiliation/continuity review
    service_delay: Manual identity matching
    known_exception: Historical/goodwill clubs already recognized
    failure_mode: Duplicate or mismatched club identity
    authoritative_source: Incumbent registration provider (transition-only)
    reconciliation_requirement: Match to any existing master record
    truth_classification: STAKEHOLDER_STATEMENT
    validation_status: pending_stakeholder_validation
  - step: 2
    name: Prior affiliation and continuity review
    actor: PTSO / Curling Canada staff
    accountable_authority: PTSO (provincial), Curling Canada (national)
    system_used: Incumbent provider / spreadsheets
    manual_artifact: Prior-season records
    data_created: Continuity determination
    evidence_retained: Prior affiliation history
    decision: Returning vs new applicant
    handoff: To seasonal requirements
    service_delay: Locating prior-season records
    known_exception: Goodwill/continuity clubs without a full new application
    failure_mode: Treating a continuing club as a brand-new applicant
    authoritative_source: Historical affiliation baseline
    reconciliation_requirement: Governed transition policy for existing clubs
    truth_classification: STAKEHOLDER_STATEMENT
    validation_status: pending_stakeholder_validation
  - step: 3
    name: Seasonal requirements determination
    actor: Curling Canada / PTSO staff
    accountable_authority: Curling Canada (national), PTSO (provincial)
    system_used: Policy documents / manual
    manual_artifact: Season requirement checklists
    data_created: Applicable requirement set for the season
    evidence_retained: Requirement checklist
    decision: Which requirements apply this season
    handoff: To fee determination
    service_delay: Ambiguity between national and provincial requirements
    known_exception: Mid-season rule changes
    failure_mode: Applying the wrong season's ruleset
    authoritative_source: Ratified seasonal policy
    reconciliation_requirement: Version the requirement set to the season
    truth_classification: STAKEHOLDER_STATEMENT
    validation_status: pending_stakeholder_validation
  - step: 4
    name: Fee determination
    actor: Curling Canada finance / PTSO
    accountable_authority: Curling Canada + PTSO (combined fee framework)
    system_used: Spreadsheets / incumbent provider
    manual_artifact: Fee schedule
    data_created: Fee obligation for the club
    evidence_retained: Fee calculation
    decision: Amount owed (national + provincial components)
    handoff: To supporting evidence and payment
    service_delay: Manual fee computation and splits
    known_exception: Discounts, waivers, multi-tier fees
    failure_mode: Incorrect fee or split
    authoritative_source: Curling Canada fee policy
    reconciliation_requirement: Fee policy owned by The House; processors execute only
    truth_classification: STAKEHOLDER_STATEMENT
    validation_status: pending_stakeholder_validation
  - step: 5
    name: Supporting evidence submission
    actor: Club administrator
    accountable_authority: PTSO / Curling Canada reviewers
    system_used: Email / incumbent provider uploads
    manual_artifact: Documents attached to email
    data_created: Evidence set
    evidence_retained: Documents (often in email/shared files)
    decision: Whether evidence is sufficient
    handoff: To PTSO interaction
    service_delay: Back-and-forth on missing documents
    known_exception: Late or partial documents
    failure_mode: Evidence not bound to the decision; lost in email
    authoritative_source: Governed evidence store (target)
    reconciliation_requirement: Bind evidence to the governed transition
    truth_classification: STAKEHOLDER_STATEMENT
    validation_status: pending_stakeholder_validation
  - step: 6
    name: PTSO interaction and review
    actor: PTSO reviewer
    accountable_authority: PTSO (provincial jurisdiction)
    system_used: Email / incumbent provider
    manual_artifact: Review notes
    data_created: PTSO review outcome
    evidence_retained: Review correspondence
    decision: PTSO endorsement / return for information
    handoff: To Curling Canada review
    service_delay: Reviewer availability; no routing
    known_exception: Provincial-specific requirements
    failure_mode: No assigned reviewer; ad hoc assignment
    authoritative_source: PTSO jurisdiction
    reconciliation_requirement: Jurisdiction-aware reviewer routing (target)
    truth_classification: STAKEHOLDER_STATEMENT
    validation_status: pending_stakeholder_validation
  - step: 7
    name: Curling Canada review
    actor: Curling Canada staff reviewer
    accountable_authority: Curling Canada (national)
    system_used: Email / incumbent provider / spreadsheets
    manual_artifact: Review notes
    data_created: National review outcome
    evidence_retained: Review correspondence
    decision: Approve / reject / return for information
    handoff: To corrections or payment/reconciliation
    service_delay: Manual coordination across PTSO and CC
    known_exception: Escalations
    failure_mode: Coarse role authority; any reviewer can act on any file
    authoritative_source: Curling Canada national authority
    reconciliation_requirement: Resource/jurisdiction-scoped authority (target)
    truth_classification: STAKEHOLDER_STATEMENT
    validation_status: pending_stakeholder_validation
  - step: 8
    name: Corrections and follow-up
    actor: Club administrator / reviewers
    accountable_authority: PTSO / Curling Canada
    system_used: Email
    manual_artifact: Correction correspondence
    data_created: Updated application data / evidence
    evidence_retained: Email threads
    decision: Whether corrections satisfy requirements
    handoff: Back to review or to payment
    service_delay: Round trips over email
    known_exception: Repeated correction cycles
    failure_mode: No governed return-for-information/resubmission loop
    authoritative_source: Governed lifecycle (target)
    reconciliation_requirement: Return-for-information + resubmission transition (target)
    truth_classification: STAKEHOLDER_STATEMENT
    validation_status: pending_stakeholder_validation
  - step: 9
    name: Payment and reconciliation
    actor: Club / Curling Canada finance
    accountable_authority: Helene (business/financial), Curling Canada
    system_used: Payment processor / accounting system / spreadsheets
    manual_artifact: Reconciliation spreadsheet
    data_created: Payment record; reconciliation entry
    evidence_retained: Payment confirmation
    decision: Whether payment clears and reconciles
    handoff: To approval
    service_delay: Manual reconciliation across processor and ledger
    known_exception: Partial payments, refunds, chargebacks
    failure_mode: Reconciliation gaps between processor and ledger
    authoritative_source: Accounting system (ledger), The House (charge decision)
    reconciliation_requirement: Explicit processor-vs-ledger reconciliation boundary
    truth_classification: STAKEHOLDER_STATEMENT
    validation_status: pending_stakeholder_validation
  - step: 10
    name: Approval
    actor: Curling Canada authority
    accountable_authority: Curling Canada (national)
    system_used: Incumbent provider / manual
    manual_artifact: Approval notice
    data_created: Approved affiliation
    evidence_retained: Approval record
    decision: Affiliation approved
    handoff: To club status and downstream recognition
    service_delay: Manual status updates
    known_exception: Conditional approvals
    failure_mode: Approval not atomically tied to fee/evidence state
    authoritative_source: Governed approval transition (target)
    reconciliation_requirement: Atomic approval with evidence + fee state
    truth_classification: STAKEHOLDER_STATEMENT
    validation_status: pending_stakeholder_validation
  - step: 11
    name: Club status and downstream recognition
    actor: Curling Canada / PTSO / downstream systems
    accountable_authority: Curling Canada (national)
    system_used: Incumbent provider / Curling I/O / analytics
    manual_artifact: Status notifications
    data_created: Active club status; downstream projections
    evidence_retained: Status change record
    decision: Recognize the club as affiliated/active
    handoff: To ongoing compliance
    service_delay: Propagation to downstream systems
    known_exception: Delayed downstream recognition
    failure_mode: Inconsistent status across systems
    authoritative_source: The House (master data, target)
    reconciliation_requirement: Single master status projected outward
    truth_classification: STAKEHOLDER_STATEMENT
    validation_status: pending_stakeholder_validation
  - step: 12
    name: Ongoing compliance
    actor: Curling Canada compliance / PTSO
    accountable_authority: Jen (compliance/policy), Curling Canada, PTSO
    system_used: Sideline Learning / accreditation / manual
    manual_artifact: Compliance tracking
    data_created: Ongoing compliance status
    evidence_retained: Certification/accreditation projections
    decision: Whether the club remains compliant
    handoff: Renewal cycle
    service_delay: Manual compliance tracking
    known_exception: Lapsed certifications mid-season
    failure_mode: Compliance flags not enforced at governed transitions
    authoritative_source: External SoRs (Sideline, accreditation) projected into The House
    reconciliation_requirement: Compliance projections gate governed transitions
    truth_classification: STAKEHOLDER_STATEMENT
    validation_status: pending_stakeholder_validation

historical_affiliation_baseline:
  statement: >-
    A population of clubs is already recognized through historical or goodwill
    affiliation and continuity. The target platform must not force every existing
    club to behave as a brand-new applicant; a governed transition policy for
    existing/continuing clubs is required.
  truth_classification: STAKEHOLDER_STATEMENT
  validation_status: pending_stakeholder_validation
  target_constraint: >-
    Provide a governed continuity/transition transition for existing clubs
    (distinct from new-applicant bootstrap).

