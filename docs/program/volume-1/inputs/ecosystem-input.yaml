# Package 4 controlled ecosystem input (current-state qualification evidence).
#
# This is a CONTROLLED SOURCE FILE. The `qualification:ecosystem` tooling structures
# these records deterministically into generated/ecosystem/*; it derives nothing from
# absence. Every current-state statement carries a truth classification and a
# validation_status. Records grounded in ratified Volume 0 authority doctrine
# (REG-005, V0-06) are POLICY_TRUTH; records not yet stakeholder- or vendor-validated
# are ASSUMPTION or STAKEHOLDER_STATEMENT pending validation, and MUST NOT be read as
# ratified policy or proven operational fact.
#
# Truth classifications (V1-02 + Package 4 extension):
#   POLICY_TRUTH OPERATIONAL_TRUTH IMPLEMENTATION_TRUTH CONTRACTUAL_TRUTH
#   VENDOR_CLAIM OBSERVED_EVIDENCE STAKEHOLDER_STATEMENT ASSUMPTION UNRESOLVED_CONTRADICTION
meta:
  package: Volume 1 Package 4 - Current Ecosystem and Operating Reality
  authority_baseline: docs/program/volume-0 (frozen constitutional baseline)
  primary_grounding:
    - REG-005 Source and Authority Register (Volume 0)
    - V0-06 Product and Authority Doctrine (Volume 0)
    - REG-003 RAID (Volume 0)
    - V0-02 Problem and Opportunity (Volume 0)
    - docs/sport-profiles/curling-canada-reference-profile.md
  disclaimer: >-
    No implementation is authorized by this input. Stakeholder and vendor
    validation are pending; pending validation blocks only the affected claim,
    not the package.

authority_boundaries:
  - id: AUTH-NATIONAL
    tier: national
    body: Curling Canada
    holds: >-
      National policy, national program standards, national fee framework,
      system-of-record intent for club/affiliation/participant master data under
      the target platform, executive acceptance authority.
    does_not_hold: >-
      Provincial/territorial internal governance; club internal operations.
    truth_classification: POLICY_TRUTH
    validation_status: grounded_in_ratified_v0
    source_ref: V0-06
  - id: AUTH-PROVINCIAL
    tier: provincial_territorial
    body: Member Associations / PTSOs
    holds: >-
      Provincial/territorial jurisdiction over member clubs, provincial
      requirements and fees, provincial review of club affiliation, appropriate
      retained jurisdiction under the target platform.
    does_not_hold: >-
      National master-data authority; ability to override national governed
      decisions.
    truth_classification: POLICY_TRUTH
    validation_status: grounded_in_ratified_v0
    source_ref: V0-06
  - id: AUTH-CLUB
    tier: club
    body: Clubs / curling centres
    holds: >-
      Club-level operations, local membership administration, submission of
      affiliation and renewal, local facility and roster reality.
    does_not_hold: >-
      Provincial or national policy authority.
    truth_classification: POLICY_TRUTH
    validation_status: grounded_in_ratified_v0
    source_ref: V0-05
  - id: AUTH-INDIVIDUAL
    tier: individual
    body: Individuals with multiple organizational roles
    holds: >-
      Personal identity and participation; may hold several roles (member,
      volunteer, coach, official, administrator) across clubs/PTSOs concurrently.
    does_not_hold: >-
      Any governed authority beyond assigned roles; role multiplicity must not
      collapse into a single coarse permission bucket.
    truth_classification: OPERATIONAL_TRUTH
    validation_status: pending_stakeholder_validation
    source_ref: V0-04

# V1-17 / V1-18: external systems and manual tools. Authority classifications for
# SYS-001..008 are grounded in ratified Volume 0 REG-005/V0-06 (POLICY_TRUTH).
# SYS-009..012 are not addressed by Volume 0 and are ASSUMPTION/STAKEHOLDER_STATEMENT
# pending validation.
systems:
  - id: SYS-001
    name: Curling I/O
    business_function: League and competition operational data exchange
    users: Clubs, leagues, competition administrators
    data_owned: League and competition operational data (bounded domain)
    authority_classification: synchronization_partner (authority_level 4)
    inbound_flows: League/competition operational data into projections
    outbound_flows: Governed reference data as permitted within bounded domain
    reconciliation: >-
      The House is master-data authority for club, affiliation, and participant
      records; competition/league standing never overrides governed master data.
    contract_dependency: Bidirectional operational exchange; terms not captured here
    known_limitation: >-
      Holds no club or participant master-data authority; bounded to
      league/competition operational data.
    target_disposition_hypothesis: RETAIN as bounded synchronization partner (unproven)
    truth_classification: POLICY_TRUTH
    validation_status: grounded_in_ratified_v0
    source_ref: REG-005-SRC-005
  - id: SYS-002
    name: Current registration provider (incumbent)
    business_function: Incumbent registration and membership records
    users: Clubs, PTSOs, Curling Canada, individuals
    data_owned: Legacy registration and membership data (transition-only authority)
    authority_classification: temporary_transition_platform (authority_level 4)
    inbound_flows: Legacy registration/membership records for migration
    outbound_flows: Migration export to the target platform
    reconciliation: >-
      Authoritative for legacy data only during transition; authority expires on
      an explicit recorded migration-completion (cutover) trigger.
    contract_dependency: >-
      Incumbent agreement; data-export rights and termination/transition
      conditions must be captured and validated.
    known_limitation: >-
      Not authoritative for the future target state; migration off the incumbent
      is a recorded program risk (REG-003).
    target_disposition_hypothesis: RETIRE after governed migration (unproven; risk-bearing)
    truth_classification: POLICY_TRUTH
    validation_status: grounded_in_ratified_v0
    source_ref: REG-005-SRC-006
  - id: SYS-003
    name: Payment processors
    business_function: Payment authorization and capture on instruction
    users: Curling Canada finance, clubs, individuals paying fees
    data_owned: Payment authorization/capture transactions (execution plane)
    authority_classification: execution_plane (authority_level 4)
    inbound_flows: Governed charge instructions from The House
    outbound_flows: Payment confirmations/evidence back to The House
    reconciliation: >-
      Governed decision to charge, fee policy, and resulting record remain in The
      House; explicit reconciliation boundary with accounting (SYS-008).
    contract_dependency: >-
      Processor agreement and fee economics (per-transaction cost) require
      Helene's financial validation.
    known_limitation: Does not own fee policy and is not the accounting truth.
    target_disposition_hypothesis: RETAIN as execution plane (unproven)
    truth_classification: POLICY_TRUTH
    validation_status: grounded_in_ratified_v0
    source_ref: REG-005-SRC-007
  - id: SYS-004
    name: Sideline Learning
    business_function: Learning and certification completion records
    users: Coaches, officials, Curling Canada compliance
    data_owned: Learning/certification completion records (external system of record)
    authority_classification: authoritative_source_external (authority_level 4)
    inbound_flows: Certification-completion status into governed projections
    outbound_flows: None governed; The House holds a projection only
    reconciliation: The House projects status and governs its use, not the underlying record
    contract_dependency: External SoR agreement; API availability to be validated
    known_limitation: The House does not own the underlying learning record
    target_disposition_hypothesis: RETAIN as external system of record (unproven)
    truth_classification: POLICY_TRUTH
    validation_status: grounded_in_ratified_v0
    source_ref: REG-005-SRC-008
  - id: SYS-005
    name: Accreditation platforms
    business_function: Accreditation status and standing
    users: Curling Canada compliance, clubs, individuals
    data_owned: Accreditation status (external system of record)
    authority_classification: authoritative_source_external (authority_level 4)
    inbound_flows: Accreditation status into governed projections
    outbound_flows: None governed; projection only
    reconciliation: The House projects status and governs its use, not the record
    contract_dependency: External SoR agreement; integration availability to be validated
    known_limitation: The House does not own the underlying accreditation record
    target_disposition_hypothesis: RETAIN as external system of record (unproven)
    truth_classification: POLICY_TRUTH
    validation_status: grounded_in_ratified_v0
    source_ref: REG-005-SRC-009
  - id: SYS-006
    name: Document360
    business_function: Documentation and knowledge-base hosting
    users: Curling Canada staff, clubs, PTSOs
    data_owned: Documentation/knowledge-base content (commodity)
    authority_classification: replaceable_provider (authority_level 6)
    inbound_flows: Authored documentation
    outbound_flows: Published documentation
    reconciliation: Substitutable without changing governed truth
    contract_dependency: Commodity hosting subscription
    known_limitation: Holds no governed authority
    target_disposition_hypothesis: RETAIN or EXTERNALIZE; substitutable (unproven)
    truth_classification: POLICY_TRUTH
    validation_status: grounded_in_ratified_v0
    source_ref: REG-005-SRC-010
  - id: SYS-007
    name: Analytics platforms
    business_function: Reporting and business intelligence over projected data
    users: Curling Canada staff, executives
    data_owned: Reporting projections only (no governed state)
    authority_classification: reporting_source (authority_level 6)
    inbound_flows: Projected data from governed systems
    outbound_flows: Reports and dashboards
    reconciliation: Consumes projected data only; MUST NOT become a system of record
    contract_dependency: BI tooling subscription
    known_limitation: Writes no governed state; no authority over underlying records
    target_disposition_hypothesis: RETAIN as downstream reporting only (unproven)
    truth_classification: POLICY_TRUTH
    validation_status: grounded_in_ratified_v0
    source_ref: REG-005-SRC-011
  - id: SYS-008
    name: Accounting systems
    business_function: Financial ledger and accounting system of record
    users: Curling Canada finance
    data_owned: Financial ledger (external system of record)
    authority_classification: authoritative_source_external (authority_level 4)
    inbound_flows: Governed charge/payment records synchronized from The House
    outbound_flows: Ledger truth for reconciliation
    reconciliation: >-
      The House synchronizes and does not overwrite the ledger; explicit boundary
      with payment processors (SYS-003).
    contract_dependency: Accounting platform agreement; requires Helene's validation
    known_limitation: The House is not the accounting truth
    target_disposition_hypothesis: RETAIN as financial system of record (unproven)
    truth_classification: POLICY_TRUTH
    validation_status: grounded_in_ratified_v0
    source_ref: REG-005-SRC-012
  - id: SYS-009
    name: Support systems (Halo / Zendesk where relevant)
    business_function: Support case management and service desk
    users: Curling Canada support staff, clubs, individuals
    data_owned: Support cases and interaction history
    authority_classification: reporting_source / operational_tool (unclassified in V0)
    inbound_flows: Support requests from clubs/individuals
    outbound_flows: Case resolution; no governed state
    reconciliation: Support cases reference but do not own governed records
    contract_dependency: Support-tooling subscription (to be captured)
    known_limitation: Not addressed by ratified Volume 0 authority doctrine
    target_disposition_hypothesis: RETAIN as support tooling (unvalidated)
    truth_classification: ASSUMPTION
    validation_status: pending_stakeholder_validation
    source_ref: null
  - id: SYS-010
    name: Identity and Microsoft 365 services
    business_function: Staff identity, email, collaboration, file storage
    users: Curling Canada staff
    data_owned: Staff identities, mailboxes, shared files
    authority_classification: identity_and_productivity (unclassified in V0)
    inbound_flows: Staff authentication and collaboration
    outbound_flows: Email-mediated processes and shared documents
    reconciliation: >-
      Email/shared-file processes are manual controls, not governed systems of
      record; risk of shadow authority.
    contract_dependency: Microsoft 365 licensing (to be captured)
    known_limitation: Not addressed by ratified Volume 0 authority doctrine
    target_disposition_hypothesis: RETAIN for identity/productivity; do not treat as SoR (unvalidated)
    truth_classification: ASSUMPTION
    validation_status: pending_stakeholder_validation
    source_ref: null
  - id: SYS-011
    name: Manual spreadsheets and shared files
    business_function: Ad hoc tracking of affiliation, fees, rosters, reconciliation
    users: Curling Canada staff, PTSO staff
    data_owned: Working copies and manual reconciliation data
    authority_classification: manual_control (shadow data)
    inbound_flows: Manual entry from multiple systems
    outbound_flows: Manual re-keying into systems; email attachments
    reconciliation: >-
      A recurring reconciliation and data-quality risk; duplicate copies without
      a single authoritative source.
    contract_dependency: None
    known_limitation: >-
      Untracked authority; a current weakness that must not be recreated in the
      target platform.
    target_disposition_hypothesis: RETIRE / automate into governed records (unvalidated)
