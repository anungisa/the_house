    statement: A governed observability signal that would characterise the latency of affiliation decisions once the service operates.
    objective: Define the signal, its context, its owner, and its evidence binding as a documentary obligation.
    affected_service: SERVICE-V11-001
    signal_context: Observed within the affiliation application service under governed operation; interpreted only with organization, season, and jurisdiction context.
    signal_sensitivity: INTERNAL
    signal_owner: OWNER-V11-002
    alert_dependency: An alert on this signal depends on a defined threshold, a responsible owner, and a governed response procedure.
    evidence_binding: Signal observations bind to environment, configuration, version, identity, organization, jurisdiction, and time.
