  # --- Continuity scenario ---
  - id: CONT-V11-001
    kind: CONTINUITY_SCENARIO
    title: Provider Platform Outage Continuity Scenario
    statement: A governed continuity scenario describing preserved work, prohibited actions, degraded mode, fallback, and recovery for a provider platform outage.
    objective: Define continuity obligations for a provider platform outage as a documentary definition.
    affected_service: SERVICE-V11-001
    preserved_work: In-flight affiliation applications and their evidence are preserved and never silently discarded.
    prohibited_action: No destructive action, no silent status mutation, and no bypass of governed transitions during the outage.
    degraded_mode: A controlled degraded mode that accepts intake but defers decisions with participant notification.
    fallback_procedure: A defined fallback that queues governed work for later processing under retained provenance.
    recovery_procedure: A defined recovery that reconciles queued work against governed state before resuming decisions.
    continuity_distinction: Continuity is distinct from backup, from restore, and from recovery.
