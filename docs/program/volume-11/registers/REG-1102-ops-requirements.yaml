  - id: MIG-V11-003
    kind: MIGRATION_STAGE
    title: Cutover Authorization Stage
    statement: A governed cutover-authorization stage defining the conditions under which cutover could later be authorized.
    objective: Define the cutover-authorization stage obligations as a documentary definition.
    migration_stage: CUTOVER_AUTHORIZATION
    source_authority_preservation: Source authority persists until an explicit, evidenced cutover authorization.
    provenance_preservation: Cutover authorization depends on complete provenance evidence.
    uncertainty_preservation: Outstanding uncertainty blocks cutover authorization.
    identity_candidate_treatment: Unresolved identity candidates block cutover authorization.
    quarantine_treatment: Outstanding quarantine blocks cutover authorization.
    rehearsal_boundary: A successful rehearsal is a precondition but is not itself authorization.
    cutover_boundary: Cutover is not acceptance and is not source retirement.
    acceptance_boundary: Business acceptance is a distinct, later obligation.
    rollback_definition: A defined rollback must exist before cutover authorization.
    source_retirement_boundary: Source retirement is a distinct, later authorization.
    traces_to:
      - V11-06
    validation_status: DEFINED
    evidence_label: AUTHOR-VERIFIED
    authorizes_implementation: false
    authorizes_operations: false
