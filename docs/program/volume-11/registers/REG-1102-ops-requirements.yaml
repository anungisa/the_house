  # --- Continuity scenario ---
  - id: CONT-V11-001
    kind: CONTINUITY_SCENARIO
    title: Provider Platform Outage Continuity Scenario
    statement: A governed continuity scenario describing preserved work, prohibited actions, degraded mode, fallback, and recovery for a provider platform outage.
    objective: Define continuity obligations for a provider platform outage as a documentary definition.
    affected_service: SERVICE-V11-001
    preserved_work: In-flight affiliation applications and their evidence are preserved and never silently discarded.
    prohibited_action: No destructive action, no silent status mutation, and no bypass of governed transitions during the outage.
    degraded_mode: A controlled degraded mode that accepts intake but defers decisions with participant notification.
    fallback_procedure: A defined fallback that queues governed work for later processing under retained provenance.
    recovery_procedure: A defined recovery that reconciles queued work against governed state before resuming decisions.
    continuity_distinction: Continuity is distinct from backup, from restore, and from recovery.
    traces_to:
      - V11-05
    validation_status: DEFINED
    evidence_label: AUTHOR-VERIFIED
    authorizes_implementation: false
    authorizes_operations: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    operational_status: NOT_OPERATIONAL_OR_NOT_PROVEN
    execution_status: NOT_EXECUTED
    chapter_ref: V11-05
    future_gate: V12-G1
  # --- Backup requirement ---
  - id: BACKUP-V11-001
    kind: BACKUP_REQUIREMENT
    title: Governed Record Backup Requirement
    statement: A governed backup requirement distinguishing backup completion, backup verification, and backup restorability.
    objective: Define backup obligations as a documentary definition, executing no backup.
    affected_service: SERVICE-V11-002
    backup_completion_definition: A backup is complete when the defined dataset has been captured to the defined target with a recorded manifest.
    backup_verification_definition: A backup is verified only when its integrity and completeness have been independently checked against the manifest.
    restoration_definition: A backup is restorable only when a governed restore has reproduced the dataset in a target environment.
    traces_to:
      - V11-05
    validation_status: DEFINED
    evidence_label: AUTHOR-VERIFIED
    authorizes_implementation: false
    authorizes_operations: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    operational_status: NOT_OPERATIONAL_OR_NOT_PROVEN
    execution_status: NOT_EXECUTED
    chapter_ref: V11-05
    future_gate: V12-G1
