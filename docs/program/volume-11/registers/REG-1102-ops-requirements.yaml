  # --- Migration stages ---
  - id: MIG-V11-001
    kind: MIGRATION_STAGE
    title: Mapping and Validation Stage
    statement: A governed migration stage covering mapping and validation, preserving source authority, provenance, and uncertainty.
    objective: Define the mapping and validation stage obligations as a documentary definition.
    migration_stage: MAPPING
    source_authority_preservation: The source system remains authoritative throughout this stage.
    provenance_preservation: Every mapped record retains its source provenance and lineage.
    uncertainty_preservation: Uncertain mappings are preserved as uncertain and never silently resolved.
    identity_candidate_treatment: Identity candidates are treated as candidates and not asserted as resolved identities.
    quarantine_treatment: Records failing validation are quarantined rather than admitted.
    rehearsal_boundary: This stage is rehearsal-only and authorizes no migration.
    cutover_boundary: This stage authorizes no cutover.
    acceptance_boundary: This stage authorizes no business acceptance.
    rollback_definition: This stage is fully reversible; no source state is mutated.
    source_retirement_boundary: This stage authorizes no source retirement.
    mapping_vs_identity_distinction: Mapping complete is not identity resolved.
    traces_to:
      - V11-06
    validation_status: DEFINED
    evidence_label: AUTHOR-VERIFIED
    authorizes_implementation: false
    authorizes_operations: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    operational_status: NOT_OPERATIONAL_OR_NOT_PROVEN
    execution_status: NOT_EXECUTED
    chapter_ref: V11-06
    future_gate: V12-G1
  - id: MIG-V11-002
    kind: MIGRATION_STAGE
    title: Rehearsal Stage
    statement: A governed migration rehearsal stage that proves the migration approach without authorizing migration.
    objective: Define the rehearsal stage obligations as a documentary definition.
    migration_stage: REHEARSAL
    source_authority_preservation: The source system remains authoritative during rehearsal.
    provenance_preservation: Rehearsal preserves provenance for every record processed.
    uncertainty_preservation: Rehearsal preserves and reports uncertainty rather than resolving it.
    identity_candidate_treatment: Identity candidates remain candidates during rehearsal.
    quarantine_treatment: Quarantine behaviour is exercised without admitting quarantined records.
    rehearsal_boundary: Rehearsal is not migration authorization.
    cutover_boundary: Rehearsal authorizes no cutover.
    acceptance_boundary: Rehearsal authorizes no acceptance.
    rollback_definition: Rehearsal is fully reversible and mutates no source or target of record.
    source_retirement_boundary: Rehearsal authorizes no source retirement.
    traces_to:
      - V11-06
    validation_status: DEFINED
    evidence_label: AUTHOR-VERIFIED
    authorizes_implementation: false
    authorizes_operations: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    operational_status: NOT_OPERATIONAL_OR_NOT_PROVEN
