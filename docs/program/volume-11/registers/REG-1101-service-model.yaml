  # --- Services ---
  - id: SERVICE-V11-001
    kind: SERVICE
    title: Affiliation Application Service
    statement: >-
      The governed affiliation application service through which participants,
      clubs, and organizations submit, progress, and receive decisions on
      affiliation applications, operated on top of the released Volume 0-10
      governance kernel and central registration record.
    operational_definition: >-
      A documentary definition of the operational service boundary, its owner,
      its operating states, and its support and evidence obligations. This is an
      operational definition only and is distinct from an operating service.
    scope: Affiliation application intake, review, decision, and lifecycle operation.
    excluded_scope: Runtime implementation, environment provisioning, and any live operation.
    material_service_capability: true
    operational_owner: OWNER-V11-001
    institutional_authority: CurlingCanada
    authority_domain: House
    operational_domain: SERVICE_OWNERSHIP
    decision_rights: Service owner holds operational decision rights within governed policy; institutional authority remains with the sanctioning body.
    escalation_route: Service owner to operations owner to executive sponsor.
    accountabilities: Availability of governed operational definition, support model, and evidence obligations for the service.
    evidence_control: Operational evidence obligations defined in REG-1102 and Chapter V11-09.
    required_capabilities:
      - CAP-V11-001
    dependencies:
      - central-registration-volume-10-v1.0.0
    affected_capability: CAP-V11-001
    traces_to:
      - V11-01
    sensitivity: PERSONAL_INFORMATION
    accessibility_bilingual_obligation: Bilingual and accessible operation required for all participant-facing interactions.
    validation_status: DEFINED
    evidence_label: AUTHOR-VERIFIED
    authorizes_implementation: false
    authorizes_operations: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    operational_status: NOT_OPERATIONAL_OR_NOT_PROVEN
    execution_status: NOT_EXECUTED
    chapter_ref: V11-01
    future_gate: V12-G1
