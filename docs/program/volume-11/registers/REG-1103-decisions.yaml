  - id: ADR-V11-018
    kind: DECISION_BOUNDARY
    title: Operational Acceptance Requires Executed Environment-Bound Evidence
    statement: >-
      Operational acceptance requires executed, environment-bound evidence; it cannot rest on
      documentary approval alone.
    decision_status: APPROVED_FOR_PLANNING
    context: Volume 11 defines the executed evidence acceptance must bind.
    consequences: Operational-acceptance requirements bind executed evidence in Volume 12.
