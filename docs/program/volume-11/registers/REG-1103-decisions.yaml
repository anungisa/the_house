  - id: ADR-V11-007
    kind: DECISION_BOUNDARY
    title: Backup, Restore, Recovery, and Reconciliation Are Distinct
    statement: >-
      Backup completion does not establish restorability; service restoration does not
      establish reconciliation.
    decision_status: APPROVED_FOR_PLANNING
    context: >-
      Continuity, backup, restore, and recovery procedures must preserve the chain of
      distinctions from backup generation through reconciliation.
    consequences: >-
      Continuity and backup procedures in REG-1102 record separate completion,
      verification, restoration, recovery, and reconciliation definitions.
    decision_authority: OWNER-V11-002
    prohibited_inference: This decision must not be read as claiming any recovery capability.
    traces_to:
