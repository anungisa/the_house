  - id: ADR-V11-019
    kind: DECISION_BOUNDARY
    title: Volume 12 May Assess Evidence But May Not Infer Missing Evidence
    statement: >-
      Volume 12 may assess produced acceptance evidence but may not infer, assume, or substitute for
      missing evidence; absence of evidence is not acceptance.
    decision_status: APPROVED_FOR_PLANNING
    context: The release-evidence binding forbids inferring missing evidence.
    consequences: Volume 12 release-evidence requirements bind concrete evidence and fail closed on absence.
    decision_authority: OWNER-V11-001
    prohibited_inference: This decision must not be read as permitting inferred acceptance.
