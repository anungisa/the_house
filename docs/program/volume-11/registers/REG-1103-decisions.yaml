    title: Integrated Operating Baseline Does Not Authorize Operations
    statement: >-
      Consolidating Packages 1 and 2 into an integrated operating baseline defines the affiliation
      operating model; it does not authorize operation, migration, recovery, training, or provider
      engagement.
    decision_status: APPROVED_FOR_PLANNING
    context: The Volume 11 closure consolidates operational definitions only.
    consequences: The integrated baseline coverage records assert no operation and authorize nothing.
    decision_authority: OWNER-V11-001
    prohibited_inference: This decision must not be read as authorizing operations or release.
