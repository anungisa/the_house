  # --- Evaluation scenarios and governed task protocols (V7-33) ---
  - id: SCEN-V7-001
    kind: EVALUATION_SCENARIO
    title: Club representative end-to-end affiliation scenario
    statement: The governed scenario in which an authorized representative completes the full affiliation vertical.
    scenario_class: club-representative-vertical
    primary_actor: Authorized club representative
    authority_posture: AUTHORIZED_REPRESENTATIVE
    covers_stages:
      - STAGE-V7-001
      - STAGE-V7-002
      - STAGE-V7-003
      - STAGE-V7-004
      - STAGE-V7-005
      - STAGE-V7-006
      - STAGE-V7-007
      - STAGE-V7-008
      - STAGE-V7-009
      - STAGE-V7-010
      - STAGE-V7-011
      - STAGE-V7-012
      - STAGE-V7-013
      - STAGE-V7-014
      - STAGE-V7-015
      - STAGE-V7-016
    states:
      - primary
      - exception
      - denied
      - stale
      - degraded
      - recovery
    protocol_steps:
      - Confirm representative authority and club identity
      - Establish jurisdiction and season and determine applicability
      - Assemble requirements and evidence and confirm completeness
      - Submit and observe review, decision, reconciliation, activation, and standing
    expected_evidence:
      - Observed completion of each governed step within a consented session
    exception_paths:
      - Return for information and correction and resubmission
