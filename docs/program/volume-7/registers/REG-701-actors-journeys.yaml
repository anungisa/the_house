  # --- Journey stages (V7-03) ---
  - id: STAGE-V7-001
    kind: STAGE
    title: Establish or confirm representative authority
    statement: The user establishes or confirms authority to act for the club.
    journey_ref: JOURNEY-V7-001
    stage_order: 1
    house_authority: The House determines whether representative authority exists and its scope.
    button_responsibility: The Button collects identity and delegation input and presents the authority result.
    required_information:
      - Identity of the representative
      - Basis of authority or delegation
    decisions:
      - Whether representative authority is confirmed
    evidence:
      - Delegation or authority basis where required
    states:
      - Authority unconfirmed
      - Authority confirmed
      - Authority denied
    errors:
      - Missing representative authority
    recovery: The user is shown the missing authority basis and a path to obtain or request it.
    accessibility:
      - AUTHENTICATION_AND_RECOVERY
      - KEYBOARD_AND_FOCUS
    bilingual_semantics: ENGLISH_AND_FRENCH_EQUIVALENT
    privacy_constraints: PERSONAL
    future_verification: Usability and authority-comprehension validation deferred to a future gate.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-03
