    statement: An administrator responsible for service configuration within governed limits.
    authority_posture: SERVICE_ADMINISTRATOR
    authority_domain: Staff
    primary_goal: Maintain service configuration without exercising affiliation decision authority.
    permitted_actions:
      - Maintain service-level configuration within governed limits
    prohibited_actions:
