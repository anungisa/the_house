  # --- Service blueprint (V7-04) ---
  - id: BLUEPRINT-V7-001
    kind: BLUEPRINT
    title: Club-affiliation service blueprint and channel-responsibility model
    statement: The channel-responsibility model for the club-affiliation service across frontstage, backstage, staff, finance, support, and providers.
    frontstage:
      - Button interactions that collect input and present status, actions, reasons, consequences, and recovery
    backstage:
      - House application and domain responsibilities that hold authoritative state and governed transitions
    staff_activities:
      - Jurisdiction and national review activities
    finance_activities:
      - Financial confirmation and reconciliation activities distinct from affiliation decision
    support_activities:
      - Assistance that explains status, actions, and recovery without acquiring authority
    provider_interactions:
      - Provider and external-system interactions whose acknowledgement is not institutional truth
    records_responsibility: Evidence and records responsibilities remain governed by House authority and the records function.
    notifications:
      - Required-action and status notifications presented by the Button
    failure_recovery_handoff: Failure and recovery handoffs preserve authority boundaries and route users to the correct authoritative destination.
    separation_invariants:
      - Button interaction is not House authority
      - Support assistance is not decision authority
      - Financial confirmation is not an affiliation decision
      - Provider acknowledgement is not institutional truth
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-04
