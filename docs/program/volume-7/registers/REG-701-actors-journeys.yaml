register_id: REG-701
name: Volume 7 Actors, Needs, Journeys, Blueprints, Surfaces, Views, Flows, and Workbenches
status: RATIFIED
version: 1.0.0
records:
  # --- Actors and access postures (V7-02) ---
  - id: ACTOR-V7-001
    kind: ACTOR
    title: Authorized club representative
    statement: The individual with confirmed authority to act for an affiliating club within a jurisdiction and season.
    authority_posture: AUTHORIZED_REPRESENTATIVE
    authority_domain: External
    primary_goal: Complete and maintain the club's affiliation standing accurately and on time.
    permitted_actions:
      - View the club's affiliation status and required actions
      - Complete and submit affiliation responses
      - Attach and manage affiliation evidence
    prohibited_actions:
      - Decide the outcome of the club's own affiliation
      - Reconcile financial obligations authoritatively
      - Activate affiliation standing
    information_needed:
      - Current affiliation status and its meaning
      - Applicable requirements for the season and jurisdiction
      - Outstanding required actions and their consequences
    sensitivity: MODERATE
    accessibility_needs:
      - KEYBOARD_AND_FOCUS
      - FORM_INSTRUCTIONS
    language_needs: ENGLISH_AND_FRENCH_EQUIVALENT
    failure_and_recovery_needs: Entered work must be preserved on validation error and a recovery path must remain visible.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-02
  - id: ACTOR-V7-002
    kind: ACTOR
    title: Delegated representative
    statement: An individual acting under a delegation from an authorized representative, with scoped and revocable authority.
    authority_posture: DELEGATED_REPRESENTATIVE
    authority_domain: External
    primary_goal: Contribute to affiliation completion within the bounds of an explicit delegation.
    permitted_actions:
      - View permitted portions of the club's affiliation
      - Complete delegated portions of responses and evidence
    prohibited_actions:
      - Act beyond the scope of the delegation
      - Grant delegations to others
      - Decide affiliation outcomes
    information_needed:
      - Scope and limits of the delegation
      - Tasks assigned within that scope
    sensitivity: MODERATE
    accessibility_needs:
      - KEYBOARD_AND_FOCUS
      - FORM_INSTRUCTIONS
    language_needs: ENGLISH_AND_FRENCH_EQUIVALENT
    failure_and_recovery_needs: Delegation limits must be communicated clearly and denials must explain the missing authority.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-02
  - id: ACTOR-V7-003
    kind: ACTOR
    title: New club representative
    statement: A representative of an organization not yet established as an affiliated club.
    authority_posture: PROSPECTIVE_REPRESENTATIVE
    authority_domain: External
    primary_goal: Establish the club and begin its first affiliation.
    permitted_actions:
      - Begin club establishment
      - Provide initial organization information
    prohibited_actions:
      - Assume affiliation exists before it is established
      - Decide or activate affiliation standing
    information_needed:
      - What is required to establish a club
      - How establishment differs from affiliation
    sensitivity: MODERATE
    accessibility_needs:
      - FORM_INSTRUCTIONS
      - ERROR_PREVENTION_AND_RECOVERY
    language_needs: ENGLISH_AND_FRENCH_EQUIVALENT
    failure_and_recovery_needs: Duplicate-organization detection must be explained without disclosing restricted details of an existing club.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-02
  - id: ACTOR-V7-004
    kind: ACTOR
    title: Returning club representative
    statement: A representative of a previously affiliated club renewing or continuing affiliation.
    authority_posture: AUTHORIZED_REPRESENTATIVE
    authority_domain: External
    primary_goal: Renew affiliation efficiently while confirming or correcting carried-forward information.
    permitted_actions:
      - Review carried-forward information
      - Confirm or correct prior responses and evidence
    prohibited_actions:
      - Assume prior standing remains valid without confirmation
      - Decide or activate the renewed affiliation
    information_needed:
      - What information carries forward and what must be reconfirmed
      - Current standing and expiry
    sensitivity: MODERATE
    accessibility_needs:
      - KEYBOARD_AND_FOCUS
      - STATUS_ANNOUNCEMENT
    language_needs: ENGLISH_AND_FRENCH_EQUIVALENT
    failure_and_recovery_needs: Carried-forward information that may be stale must be disclosed as such.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-02
  - id: ACTOR-V7-005
    kind: ACTOR
    title: Jurisdiction reviewer
    statement: A reviewer authorized within a jurisdiction to review affiliation submissions at that level.
    authority_posture: JURISDICTION_REVIEWER
    authority_domain: House
    primary_goal: Review submissions and record jurisdiction-level dispositions faithfully.
    permitted_actions:
      - Review submitted affiliation responses and evidence
      - Return submissions for information within authority
      - Record a jurisdiction-level review outcome
    prohibited_actions:
      - Decide outside the jurisdiction's authority
      - Activate affiliation standing directly
      - Alter the authoritative record outside the governed transition
    information_needed:
      - Submission contents and completeness signals
      - Applicable requirements and prior history
    sensitivity: HIGH
    accessibility_needs:
      - KEYBOARD_AND_FOCUS
      - SEMANTIC_STRUCTURE
    language_needs: ENGLISH_AND_FRENCH_EQUIVALENT
    failure_and_recovery_needs: Review actions must be traceable and reversible only through governed transitions.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-02
  - id: ACTOR-V7-006
    kind: ACTOR
    title: National reviewer
    statement: A reviewer authorized at the national level for dispositions reserved to that level.
    authority_posture: NATIONAL_REVIEWER
    authority_domain: House
    primary_goal: Exercise national-level review authority accurately and traceably.
    permitted_actions:
      - Review submissions escalated or reserved to the national level
      - Record a national-level review outcome
    prohibited_actions:
      - Bypass jurisdiction-level authority where it applies
      - Alter records outside governed transitions
    information_needed:
      - Escalation context and jurisdiction history
      - Applicable national requirements
    sensitivity: HIGH
    accessibility_needs:
      - KEYBOARD_AND_FOCUS
      - SEMANTIC_STRUCTURE
    language_needs: ENGLISH_AND_FRENCH_EQUIVALENT
    failure_and_recovery_needs: National dispositions must be explainable and traceable to authority.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-02
  - id: ACTOR-V7-007
    kind: ACTOR
    title: Finance operator
    statement: An operator responsible for confirming financial or reconciliation dependencies related to affiliation.
    authority_posture: FINANCE_OPERATOR
    authority_domain: Staff
    primary_goal: Confirm financial and reconciliation status without deciding affiliation.
    permitted_actions:
      - Record financial confirmation or reconciliation status
      - Communicate outstanding financial dependencies
    prohibited_actions:
      - Decide affiliation outcomes
      - Activate affiliation standing
      - Disclose financial detail beyond authorized recipients
    information_needed:
      - Outstanding obligations and their state
      - Which affiliation steps depend on financial confirmation
    sensitivity: RESTRICTED
    accessibility_needs:
      - SEMANTIC_STRUCTURE
    language_needs: ENGLISH_AND_FRENCH_EQUIVALENT
    failure_and_recovery_needs: Financial confirmation must be shown as distinct from affiliation decision.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-02
  - id: ACTOR-V7-008
    kind: ACTOR
    title: Support operator
    statement: An operator who assists users through the experience without acquiring institutional authority.
    authority_posture: SUPPORT_OPERATOR
    authority_domain: Staff
    primary_goal: Help users understand status, actions, and recovery paths.
    permitted_actions:
      - Explain status, required actions, and recovery paths
      - Guide users to the correct authoritative destination
    prohibited_actions:
      - Make an affiliation decision on a user's behalf
      - Perform financial reconciliation authoritatively
      - Perform activation of affiliation standing
      - Perform disclosure of restricted information
      - Perform records disposition or retention override
    information_needed:
      - Non-restricted status and required-action information
      - Known recovery paths and escalation routes
    sensitivity: MODERATE
    accessibility_needs:
      - ACCOMMODATION_PATH
    language_needs: ENGLISH_AND_FRENCH_EQUIVALENT
    failure_and_recovery_needs: Support boundaries must be explicit so assistance never appears to confer authority.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-02
  - id: ACTOR-V7-009
    kind: ACTOR
    title: Privacy and records function
    statement: The function responsible for privacy, access, correction, retention, and disposition obligations.
    authority_posture: PRIVACY_OR_RECORDS_FUNCTION
    authority_domain: Staff
    primary_goal: Uphold privacy and records obligations across the experience.
    permitted_actions:
      - Handle access and correction requests through governed processes
      - Apply retention and legal-hold dependencies
    prohibited_actions:
      - Decide affiliation outcomes
      - Treat operational access as disclosure authority
    information_needed:
      - Privacy posture and disclosure constraints
      - Retention and legal-hold state
    sensitivity: RESTRICTED
    accessibility_needs:
      - SEMANTIC_STRUCTURE
    language_needs: ENGLISH_AND_FRENCH_EQUIVALENT
    failure_and_recovery_needs: Access must never imply disclosure or disposition authority.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-02
  - id: ACTOR-V7-010
