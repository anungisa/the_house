  # --- Content requirements (V7-19) ---
  - id: REQ-V7-001
    kind: CONTENT_REQUIREMENT
    title: Consequence-clear content
    statement: Content makes institutional consequences clear at consequential moments.
    message_requirement: Consequential actions state their institutional meaning before confirmation.
    english_semantic_requirement: Convey the institutional consequence plainly.
    french_semantic_requirement: Convey the same institutional consequence with equivalent meaning.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-19
  - id: REQ-V7-002
    kind: CONTENT_REQUIREMENT
    title: Non-misleading status content
    statement: Status content never overstates authority, decision, or activation.
    message_requirement: Distinguish receipt, review, decision, and activation as distinct meanings.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-19
  - id: REQ-V7-003
    kind: CONTENT_REQUIREMENT
    title: Plain-language help content
    statement: Help content is plain-language and does not imply guarantees.
    message_requirement: Provide guidance without asserting outcomes the House has not decided.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-19
  # --- Status messages (V7-15) ---
  - id: SMSG-V7-001
    kind: STATUS_MESSAGE
    title: Submission received message
    statement: A status message confirming a submission was received for review.
    message_requirement: State that submission is received and awaiting review, not approved.
    user_facing_meaning: The submission is recorded and awaiting review.
    prohibited_inference: This is not an approval or an activation.
    authorizes_implementation: false
