  # --- Status, action, and content semantics (V7-06) ---
  - id: STATE-V7-001
    kind: STATE
    title: Current status
    statement: The authoritative present standing of the affiliation.
    canonical_concept: current-status
    user_facing_meaning: This is the club's present affiliation standing.
    institutional_consequence: Determines what actions are currently available and required.
    prohibited_inference: Does not imply any future decision or guaranteed outcome.
    english_semantic_requirement: State the present standing plainly without implying a future outcome.
    french_semantic_requirement: Enoncer clairement la situation actuelle sans laisser entendre un resultat futur.
    source_of_truth: House
    staleness_posture: AUTHORITATIVE_LIVE
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-06
  - id: STATE-V7-002
    kind: STATE
    title: Required action
    statement: An action the user must take to progress.
    canonical_concept: required-action
    user_facing_meaning: You must take this action to progress.
    institutional_consequence: Progress is blocked until the required action is completed.
    prohibited_inference: Does not imply the affiliation is otherwise complete or approved.
    english_semantic_requirement: State the obligation and its consequence clearly.
    french_semantic_requirement: Enoncer clairement l'obligation et sa consequence.
    source_of_truth: House
    staleness_posture: AUTHORITATIVE_LIVE
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-06
  - id: STATE-V7-003
    kind: STATE
    title: Optional action
    statement: An action the user may take but is not required.
    canonical_concept: optional-action
    user_facing_meaning: You may take this action but are not required to.
    institutional_consequence: Not taking the action does not block progress.
    prohibited_inference: Does not imply the action changes the affiliation outcome.
    english_semantic_requirement: Distinguish clearly from a required action.
    french_semantic_requirement: Distinguer clairement d'une action requise.
    source_of_truth: House
    staleness_posture: AUTHORITATIVE_LIVE
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-06
  - id: STATE-V7-004
    kind: STATE
    title: Completed action
    statement: An action that has been completed.
    canonical_concept: completed-action
    user_facing_meaning: This action has been completed.
    institutional_consequence: The related obligation is satisfied for now.
    prohibited_inference: Does not imply the overall affiliation is decided.
    english_semantic_requirement: Confirm completion without implying a broader outcome.
    french_semantic_requirement: Confirmer l'achevement sans laisser entendre un resultat global.
    source_of_truth: House
    staleness_posture: AUTHORITATIVE_LIVE
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-06
  - id: STATE-V7-005
    kind: STATE
    title: Blocked action
    statement: An action that cannot proceed due to an unmet condition.
    canonical_concept: blocked-action
    user_facing_meaning: This action cannot proceed until a condition is met.
    institutional_consequence: Progress is blocked until the condition is resolved.
    prohibited_inference: Does not imply refusal of the affiliation.
    english_semantic_requirement: Name the blocking condition and the path to resolve it.
    french_semantic_requirement: Nommer la condition bloquante et la voie de resolution.
    source_of_truth: House
    staleness_posture: AUTHORITATIVE_LIVE
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-06
  - id: STATE-V7-006
    kind: STATE
    title: Awaiting review
    statement: The submission is awaiting review.
    canonical_concept: awaiting-review
    user_facing_meaning: Your submission is waiting to be reviewed.
    institutional_consequence: No decision has been made yet.
    prohibited_inference: Does not imply the submission is approved or refused.
    english_semantic_requirement: Convey a pending state without implying an outcome.
    french_semantic_requirement: Exprimer un etat en attente sans laisser entendre un resultat.
    source_of_truth: House
    staleness_posture: MAY_BE_STALE_DISCLOSE
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-06
  - id: STATE-V7-007
    kind: STATE
    title: Returned for information
    statement: The submission has been returned for additional information.
    canonical_concept: returned-for-information
    user_facing_meaning: More information is needed before review can continue.
    institutional_consequence: The user must correct and resubmit to proceed.
    prohibited_inference: Does not imply refusal of the affiliation.
    english_semantic_requirement: Name what is needed and the path to resubmit.
    french_semantic_requirement: Nommer ce qui est requis et la voie de resoumission.
    source_of_truth: House
    staleness_posture: AUTHORITATIVE_LIVE
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-06
  - id: STATE-V7-008
    kind: STATE
    title: Resubmitted
    statement: The submission has been corrected and resubmitted.
    canonical_concept: resubmitted
    user_facing_meaning: Your corrected submission has been received.
    institutional_consequence: The submission re-enters review.
    prohibited_inference: Does not imply the submission is now approved.
    english_semantic_requirement: Confirm receipt without implying an outcome.
    french_semantic_requirement: Confirmer la reception sans laisser entendre un resultat.
    source_of_truth: House
    staleness_posture: AUTHORITATIVE_LIVE
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-06
  - id: STATE-V7-009
    kind: STATE
    title: Approved
    statement: The affiliation has been approved.
    canonical_concept: approved
    user_facing_meaning: The affiliation has been approved.
    institutional_consequence: Approval may still depend on activation and financial confirmation.
    prohibited_inference: Does not by itself imply active standing.
    english_semantic_requirement: Distinguish approval from activation.
    french_semantic_requirement: Distinguer l'approbation de l'activation.
    source_of_truth: House
    staleness_posture: AUTHORITATIVE_LIVE
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-06
  - id: STATE-V7-010
    kind: STATE
    title: Reconciliation pending
    statement: A financial or reconciliation dependency remains outstanding.
    canonical_concept: reconciliation-pending
    user_facing_meaning: A financial or reconciliation step is still outstanding.
    institutional_consequence: Activation may depend on resolving this dependency.
    prohibited_inference: Does not imply the affiliation is refused.
    english_semantic_requirement: Show financial dependency as distinct from the affiliation decision.
    french_semantic_requirement: Presenter la dependance financiere comme distincte de la decision d'affiliation.
    source_of_truth: House
    staleness_posture: MAY_BE_STALE_DISCLOSE
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-06
  - id: STATE-V7-011
    kind: STATE
    title: Activation pending
    statement: Activation of affiliation standing is pending.
    canonical_concept: activation-pending
    user_facing_meaning: Your affiliation is approved and awaiting activation.
    institutional_consequence: Standing is not yet active.
    prohibited_inference: Does not imply active standing.
    english_semantic_requirement: Distinguish pending activation from active standing.
    french_semantic_requirement: Distinguer l'activation en attente du statut actif.
    source_of_truth: House
    staleness_posture: AUTHORITATIVE_LIVE
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-06
  - id: STATE-V7-012
    kind: STATE
    title: Active
    statement: The affiliation standing is active.
    canonical_concept: active
    user_facing_meaning: The club's affiliation is active.
    institutional_consequence: Confers active standing subject to expiry and obligations.
    prohibited_inference: Does not imply indefinite standing.
    english_semantic_requirement: State active standing with any expiry clearly.
    french_semantic_requirement: Enoncer le statut actif avec toute expiration clairement.
    source_of_truth: House
    staleness_posture: AUTHORITATIVE_LIVE
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-06
  - id: STATE-V7-013
    kind: STATE
    title: Expired
    statement: The affiliation standing has expired.
    canonical_concept: expired
    user_facing_meaning: The club's affiliation has expired.
    institutional_consequence: Standing is no longer active and renewal is required.
    prohibited_inference: Does not imply refusal or permanent loss.
    english_semantic_requirement: State expiry and the path to renew.
    french_semantic_requirement: Enoncer l'expiration et la voie de renouvellement.
    source_of_truth: House
    staleness_posture: AUTHORITATIVE_LIVE
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-06
  - id: STATE-V7-014
    kind: STATE
    title: Withdrawn
    statement: The submission has been withdrawn.
    canonical_concept: withdrawn
    user_facing_meaning: The submission has been withdrawn.
    institutional_consequence: The submission is no longer in review.
    prohibited_inference: Does not imply refusal by a reviewer.
    english_semantic_requirement: Distinguish withdrawal from refusal.
    french_semantic_requirement: Distinguer le retrait du refus.
    source_of_truth: House
    staleness_posture: AUTHORITATIVE_LIVE
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-06
  - id: STATE-V7-015
    kind: STATE
    title: Refused
    statement: The affiliation has been refused.
    canonical_concept: refused
    user_facing_meaning: The affiliation has been refused.
    institutional_consequence: Standing is not conferred; reconsideration may be available.
    prohibited_inference: Does not imply permanent ineligibility.
    english_semantic_requirement: State refusal, its reason, and any reconsideration path.
    french_semantic_requirement: Enoncer le refus, son motif et toute voie de reexamen.
