  # --- Validation behaviours (V7-14) ---
  - id: VAL-V7-001
    kind: VALIDATION_BEHAVIOUR
    title: Inline required-field validation
    statement: Required fields are validated inline with clear, recoverable guidance.
    validation_behaviour: Validate on blur and before submission; never discard entered work on failure.
    accessibility_requirement: Announce validation errors and associate them with their fields.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-14
  - id: VAL-V7-002
    kind: VALIDATION_BEHAVIOUR
    title: Conditional applicability validation
    statement: Validation reflects derived applicability rather than a fixed field set.
    validation_behaviour: Only require responses to requirements derived as applicable from House facts.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-14
  - id: VAL-V7-003
    kind: VALIDATION_BEHAVIOUR
    title: Evidence acceptance validation
    statement: Evidence attachment validates format and accessibility, not evidentiary sufficiency.
    validation_behaviour: Never imply an uploaded file is automatically valid or sufficient evidence.
    restricted: true
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-14
  - id: VAL-V7-004
    kind: VALIDATION_BEHAVIOUR
    title: Submission eligibility validation
    statement: Submission is enabled only when derived completeness and eligibility are met.
    validation_behaviour: Derive eligibility from House facts; explain each unmet condition.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-15
  - id: VAL-V7-005
    kind: VALIDATION_BEHAVIOUR
    title: Duplicate submission prevention
