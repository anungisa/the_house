  # ===================================================================
  # Package 2 — Command and query intents (V7-11 conventions)
  # A Button action expresses an intent to The House; it never mutates
  # governed truth directly. Every command names its House authority.
  # ===================================================================
  - id: CMD-V7-001
    kind: COMMAND_INTENT
    title: Establish session intent
    statement: Expresses the intent to establish an authenticated session.
    primary_actor: Authorized club representative
    house_authority: House identity and session authority
    expresses_intent_to: House
    required_inputs:
      - Authentication credentials handled by the identity function
    entry_conditions:
      - User is unauthenticated
    exit_conditions:
      - Session established or account-state problem surfaced
    failure_modes:
      - Account-state problem
      - Authentication failure
    recovery_behaviour: Present a support-assisted recovery route without exposing internal detail.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-12
  - id: CMD-V7-002
    kind: COMMAND_INTENT
    title: Select organization intent
    statement: Expresses the intent to select among organizations the account is authorized for.
    primary_actor: Authorized club representative
    house_authority: House organization and membership authority
    expresses_intent_to: House
    required_inputs:
      - Selected organization
    entry_conditions:
      - Session established
    exit_conditions:
      - Organization selected within authorization
    failure_modes:
      - No authorized organization
      - Conflicting organizations
    recovery_behaviour: Fail closed and route to support-assisted resolution.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-12
  - id: CMD-V7-003
    kind: COMMAND_INTENT
    title: Confirm club identity intent
    statement: Expresses the intent to confirm the identity of an existing club.
    primary_actor: Authorized club representative
    house_authority: House club-identity authority
    expresses_intent_to: House
    required_inputs:
      - Club identity confirmation
    entry_conditions:
      - Organization selected
    exit_conditions:
      - Club identity confirmed
    failure_modes:
      - Unrecognized club
      - Duplicate club
    recovery_behaviour: Explain duplicates without disclosing restricted details.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-12
  - id: CMD-V7-004
    kind: COMMAND_INTENT
    title: Establish new club candidate intent
    statement: Expresses the intent to establish a new club candidate distinct from affiliation.
    primary_actor: New club representative
    house_authority: House club-establishment authority
    expresses_intent_to: House
    required_inputs:
      - Initial organization information
    entry_conditions:
      - No existing club recognized
    exit_conditions:
      - Club candidate established
    failure_modes:
      - Duplicate organization detected
    recovery_behaviour: Route to recognition of the existing organization without restricted disclosure.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-12
  - id: CMD-V7-005
    kind: COMMAND_INTENT
    title: Confirm representative authority intent
    statement: Expresses the intent to confirm representative or delegated authority.
    primary_actor: Authorized club representative
    house_authority: House representative-authority function
    expresses_intent_to: House
    required_inputs:
      - Authority or delegation confirmation
    entry_conditions:
      - Club identity confirmed
    exit_conditions:
      - Authority resolved or fail-closed
    failure_modes:
      - No authority
      - Pending, expired, or revoked authority
    recovery_behaviour: Fail closed and explain the missing authority with a recovery route.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-12
  - id: CMD-V7-006
    kind: COMMAND_INTENT
    title: Start or continue affiliation intent
    statement: Expresses the intent to start or continue an affiliation for a season and jurisdiction.
    primary_actor: Authorized club representative
    house_authority: House affiliation-lifecycle authority
    expresses_intent_to: House
    required_inputs:
      - Season and jurisdiction context derived from House facts
    entry_conditions:
      - Representative authority resolved
    exit_conditions:
      - Affiliation case started or continued
    failure_modes:
      - Already active, withdrawn, expired, or duplicate affiliation
    recovery_behaviour: Present the existing case state and a meaningful next action.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-13
  - id: CMD-V7-007
    kind: COMMAND_INTENT
    title: Save draft responses intent
    statement: Expresses the intent to save draft responses and acknowledgements.
    primary_actor: Authorized club representative
    house_authority: House affiliation-case authority
    expresses_intent_to: House
    required_inputs:
      - Draft responses
    entry_conditions:
      - An affiliation case is open
    exit_conditions:
      - Draft saved
    failure_modes:
      - Save failure
    recovery_behaviour: Preserve entered work and offer retry.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-14
  - id: CMD-V7-008
    kind: COMMAND_INTENT
    title: Attach evidence intent
    statement: Expresses the intent to attach evidence bound to a requirement version and provenance.
    primary_actor: Authorized club representative
    house_authority: House evidence authority
    expresses_intent_to: House
    required_inputs:
      - Evidence document and requirement context
    entry_conditions:
      - A requirement needing evidence is in scope
    exit_conditions:
      - Evidence attached with provenance recorded
    failure_modes:
      - Unsupported or inaccessible document
      - Failed upload
    recovery_behaviour: Offer retry; never imply an uploaded file is automatically valid evidence.
    restricted: true
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-14
  - id: CMD-V7-009
    kind: COMMAND_INTENT
    title: Withdraw or replace evidence intent
    statement: Expresses the intent to withdraw or replace evidence while preserving prior history.
    primary_actor: Authorized club representative
    house_authority: House evidence authority
    expresses_intent_to: House
    required_inputs:
      - Target evidence and replacement or withdrawal
    entry_conditions:
      - Evidence exists on the case
    exit_conditions:
      - Evidence replaced or withdrawn with history preserved
    failure_modes:
      - Replacement failure
    recovery_behaviour: Never imply replacement erases prior evidence.
    restricted: true
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-14
  - id: CMD-V7-010
    kind: COMMAND_INTENT
    title: Submit affiliation intent
    statement: Expresses the intent to submit a completed affiliation for review.
    primary_actor: Authorized club representative
    house_authority: House affiliation-lifecycle authority
    expresses_intent_to: House
    required_inputs:
      - Final attestations and submission confirmation
    entry_conditions:
      - Submission eligibility is derived and met
    exit_conditions:
      - Submission accepted for processing
    failure_modes:
      - Duplicate submission
      - Stale-state conflict
      - Submission failure
    recovery_behaviour: Prevent duplicates idempotently and explain stale conflicts.
    confirmation_required: true
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-15
  - id: CMD-V7-011
    kind: COMMAND_INTENT
    title: Resubmit after return intent
    statement: Expresses the intent to resubmit a corrected submission as a new governed submission state.
    primary_actor: Authorized club representative
    house_authority: House affiliation-lifecycle authority
    expresses_intent_to: House
    required_inputs:
      - Corrections to affected requirements or evidence
    entry_conditions:
      - The submission was returned for information
    exit_conditions:
      - A new submission state is recorded
    failure_modes:
      - Stale-state conflict
    recovery_behaviour: Preserve prior submission snapshots.
    confirmation_required: true
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-16
  - id: CMD-V7-012
    kind: COMMAND_INTENT
    title: Withdraw affiliation intent
    statement: Expresses the intent to withdraw an affiliation submission or case.
    primary_actor: Authorized club representative
    house_authority: House affiliation-lifecycle authority
    expresses_intent_to: House
    required_inputs:
      - Withdrawal confirmation
    entry_conditions:
      - A withdrawable case exists
    exit_conditions:
      - Withdrawal recorded
    failure_modes:
      - Withdrawal not permitted in current state
    recovery_behaviour: Explain reconsideration dependencies and consequences.
    confirmation_required: true
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-16
  - id: CMD-V7-013
    kind: COMMAND_INTENT
    title: Record review outcome intent
    statement: Expresses the reviewer intent to record a review outcome within authority.
    primary_actor: Jurisdiction reviewer
    house_authority: House review authority within jurisdictional scope
    expresses_intent_to: House
    required_inputs:
      - Review outcome within authority
    entry_conditions:
      - A submission is assigned within scope
    exit_conditions:
      - Outcome recorded through a governed transition
    failure_modes:
      - Outcome outside authority
    recovery_behaviour: A review recommendation is not itself a governed decision.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-18
  - id: CMD-V7-014
    kind: COMMAND_INTENT
    title: Return for information intent
    statement: Expresses the reviewer intent to return a submission for information.
    primary_actor: Jurisdiction reviewer
    house_authority: House review authority within jurisdictional scope
    expresses_intent_to: House
    required_inputs:
      - Return reason and affected requirements
    entry_conditions:
      - A submission is under review
    exit_conditions:
      - Submission returned for information with history preserved
    failure_modes:
      - Return outside authority
    recovery_behaviour: Return for information is not refusal.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-16
  - id: CMD-V7-015
    kind: COMMAND_INTENT
    title: Record financial confirmation intent
    statement: Expresses the finance intent to record accounting confirmation.
    primary_actor: Finance operator
    house_authority: House finance function
    expresses_intent_to: House
    required_inputs:
      - Accounting confirmation
    entry_conditions:
      - An obligation and provider acknowledgement exist
    exit_conditions:
      - Accounting confirmation recorded
    failure_modes:
      - Reconciliation mismatch
    recovery_behaviour: Payment acknowledgement is not accounting confirmation.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-17
  - id: CMD-V7-016
    kind: COMMAND_INTENT
    title: Resolve reconciliation intent
    statement: Expresses the finance intent to resolve a reconciliation mismatch.
    primary_actor: Finance operator
    house_authority: House finance function
    expresses_intent_to: House
    required_inputs:
      - Reconciliation resolution
    entry_conditions:
      - A reconciliation mismatch exists
    exit_conditions:
      - Reconciliation resolved
    failure_modes:
      - Unresolved mismatch
    recovery_behaviour: Reconciliation resolution does not decide affiliation.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-17
  - id: CMD-V7-017
    kind: COMMAND_INTENT
    title: Authorize activation intent
    statement: Expresses the governed intent to authorize activation of affiliation standing.
    primary_actor: Service administrator
    house_authority: House activation authority
    expresses_intent_to: House
    required_inputs:
      - Satisfied activation dependencies
    entry_conditions:
      - A governed approval and financial dependencies are satisfied
    exit_conditions:
      - Activation authorized through a governed transition
    failure_modes:
      - Unsatisfied dependency
    recovery_behaviour: Approval is not activation authorization, execution, or active standing.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-17
