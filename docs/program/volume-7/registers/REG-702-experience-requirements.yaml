  # --- Content message semantics (V7-06) ---
  - id: CONTENT-V7-001
    kind: CONTENT
    title: Consequential-action confirmation
    statement: The message shown before a consequential action such as submission.
    canonical_concept: consequential-confirmation
    user_facing_meaning: Confirm that you intend to take this consequential action.
    institutional_consequence: The action, once confirmed, produces a traceable governed outcome.
    prohibited_inference: Does not imply the outcome of the action.
    english_semantic_requirement: State what will happen and that the outcome is traceable.
    french_semantic_requirement: Enoncer ce qui se produira et que le resultat est tracable.
    source_of_truth: House
    staleness_posture: NOT_APPLICABLE
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-06
  - id: CONTENT-V7-002
    kind: CONTENT
    title: Staleness disclosure
    statement: The message disclosing that presented information may be stale.
    canonical_concept: staleness-disclosure
    user_facing_meaning: This information may not reflect the latest authoritative state.
    institutional_consequence: The user should refresh to obtain the authoritative state.
    prohibited_inference: Does not imply the shown value is authoritative.
    english_semantic_requirement: Disclose possible staleness and how to refresh.
    french_semantic_requirement: Divulguer la possible obsolescence et comment actualiser.
    source_of_truth: House
    staleness_posture: MAY_BE_STALE_DISCLOSE
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-06
  # --- Actions (V7-06) ---
  - id: ACTION-V7-001
    kind: ACTION
    title: Submit affiliation
    statement: The user action that requests recording of a completed affiliation submission.
    primary_actor: Authorized club representative
    institutional_consequence: Requests a governed transition that records the submission for review.
    status_semantics: Moves the affiliation to a submitted, awaiting-review state.
    command_or_query_intent:
      - CMD-V7-010
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-06
  - id: ACTION-V7-002
    kind: ACTION
    title: Resubmit after return
    statement: The user action that requests recording of a corrected resubmission.
    primary_actor: Authorized club representative
    institutional_consequence: Requests a governed transition that returns the submission to review.
    status_semantics: Moves the affiliation back to a submitted, awaiting-review state.
    command_or_query_intent:
      - CMD-V7-011
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-06
  # --- Accessibility obligations (V7-07) ---
  - id: A11Y-V7-001
    kind: A11Y
    title: Keyboard interaction
    statement: Every governed task must be operable by keyboard.
    accessibility_requirement: All interactive elements in primary, exception, and recovery paths are keyboard operable.
    accessibility_dependency:
      - KEYBOARD_AND_FOCUS
    verification_method: Future keyboard-operability assessment against each governed task.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-07
  - id: A11Y-V7-002
    kind: A11Y
    title: Focus sequence
    statement: Focus order must follow a logical, predictable sequence.
    accessibility_requirement: Focus order matches the logical task sequence and is never trapped.
    accessibility_dependency:
      - KEYBOARD_AND_FOCUS
    verification_method: Future focus-order assessment across governed tasks.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-07
  - id: A11Y-V7-003
    kind: A11Y
    title: Semantic structure
    statement: Content must convey structure and relationships semantically.
    accessibility_requirement: Headings, groups, and relationships are exposed through semantics, not visual styling alone.
    accessibility_dependency:
      - SEMANTIC_STRUCTURE
    verification_method: Future semantic-structure assessment.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-07
  - id: A11Y-V7-004
    kind: A11Y
    title: Forms and instructions
    statement: Forms must provide clear labels and instructions.
    accessibility_requirement: Every input has an associated label and instruction sufficient to complete it.
    accessibility_dependency:
      - FORM_INSTRUCTIONS
    verification_method: Future forms-and-instructions assessment.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-07
  - id: A11Y-V7-005
    kind: A11Y
    title: Error prevention and recovery
    statement: Errors must be preventable and recoverable without loss of entered work.
    accessibility_requirement: Errors are identified, described, and recoverable while preserving entered work.
    accessibility_dependency:
      - ERROR_PREVENTION_AND_RECOVERY
    verification_method: Future error-prevention-and-recovery assessment.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-07
  - id: A11Y-V7-006
    kind: A11Y
    title: Status announcements
    statement: Status changes must be announced to assistive technology.
    accessibility_requirement: Meaningful status changes are announced without requiring a visual cue.
    accessibility_dependency:
      - STATUS_ANNOUNCEMENT
    verification_method: Future status-announcement assessment.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-07
  - id: A11Y-V7-007
    kind: A11Y
    title: Evidence interaction
    statement: Evidence interactions must be accessible.
    accessibility_requirement: Uploading, previewing, and managing evidence is accessible in primary and recovery paths.
    accessibility_dependency:
      - EVIDENCE_INTERACTION
    verification_method: Future evidence-interaction accessibility assessment.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-07
  - id: A11Y-V7-008
    kind: A11Y
    title: Authentication and recovery
    statement: Authentication and recovery flows must be accessible.
