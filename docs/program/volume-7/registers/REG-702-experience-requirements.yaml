  - id: SMSG-V7-002
    kind: STATUS_MESSAGE
    title: Returned for information message
    statement: A status message that a submission was returned for information.
    message_requirement: State that information is requested, not that the submission was refused.
    user_facing_meaning: Additional information is requested.
    prohibited_inference: This is not a refusal or a decision.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
