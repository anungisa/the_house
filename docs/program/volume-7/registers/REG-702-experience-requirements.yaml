  - id: SMSG-V7-003
    kind: STATUS_MESSAGE
    title: Payment acknowledged message
    statement: A status message acknowledging a payment attempt or provider acknowledgement.
    message_requirement: State that payment is acknowledged, not that accounting is confirmed.
    user_facing_meaning: A payment has been acknowledged.
    prohibited_inference: This is not accounting confirmation or affiliation approval.
