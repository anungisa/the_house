  # --- Experience patterns (V7-08) ---
  - id: PATTERN-V7-001
    kind: PATTERN
    title: Preserve entered work on error
    statement: On a recoverable error, entered work is preserved where safely possible.
    control_intent: Errors preserve entered work and present a clear recovery path.
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
