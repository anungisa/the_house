  # --- Privacy interactions (V7-09) ---
  - id: PRIV-V7-001
    kind: PRIV
    title: Collection notice
    statement: A collection notice must accompany personal information collection.
    privacy_posture: PERSONAL
    prohibited_inference: Presenting a notice does not confer authority to use information beyond its stated purpose.
    accessibility_dependency:
      - SEMANTIC_STRUCTURE
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    validation_status: DEFINED
    chapter_ref: V7-09
  - id: PRIV-V7-002
    kind: PRIV
    title: Restricted evidence
    statement: Restricted evidence must be handled within its privacy constraints.
    privacy_posture: RESTRICTED_EVIDENCE
    prohibited_inference: Operational access to evidence does not confer disclosure or disposition authority.
    accessibility_dependency:
      - EVIDENCE_INTERACTION
    authorizes_implementation: false
