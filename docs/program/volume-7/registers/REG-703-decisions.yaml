register_id: REG-703
name: Volume 7 Decisions
status: RATIFIED
version: 1.0.0
records:
  - id: ADR-V7-001
    title: Experience authority model
    decision: Experience documents define experience, service, information-architecture, content, accessibility, bilingual, privacy, and recovery obligations only and never authorize implementation.
    status: ACCEPTED
    context: Volume 7 must establish the club-affiliation experience foundation before interface design or construction, without becoming an implementation authorization.
    consequence: Every Volume 7 record carries authorizes_implementation false and a not-implemented posture; implementation remains ungoverned by these documents.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-00
  - id: ADR-V7-002
    title: House-authoritative, Button-presents doctrine
    decision: Governed truth originates in The House; The Button presents and collects but does not independently decide.
    status: ACCEPTED
    context: The House is the governed system-of-record; The Button is the participant- and club-facing experience.
    consequence: No experience record may treat the Button as a source of truth or as holding decision authority.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-01
    traces_to:
      - CTRL-V7-001
  - id: ADR-V7-003
    title: Club affiliation as first experience vertical
    decision: Club affiliation is the first complete experience vertical defined in Volume 7.
    status: ACCEPTED
    context: The program defines one complete vertical before broadening experience scope.
    consequence: Package 1 scopes actors, journey, blueprint, IA, semantics, accessibility, bilingual, privacy, and recovery to club affiliation.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-03
    traces_to:
      - JOURNEY-V7-001
  - id: ADR-V7-004
    title: Separation of assistance, finance, provider, and authority
    decision: Support assistance, financial confirmation, and provider acknowledgement are each distinct from institutional authority and affiliation decisions.
    status: ACCEPTED
    context: Channel responsibilities must not blur into decision authority.
    consequence: The service blueprint records separation invariants enforced across the experience.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-04
    traces_to:
      - BLUEPRINT-V7-001
  - id: ADR-V7-005
    title: English and French governed-meaning equivalence
    decision: English and French governed meanings must remain equivalent across the experience.
    status: ACCEPTED
    context: The organization operates bilingually and governed meaning must not diverge by language.
    consequence: Status, content, and bilingual records carry English and French semantic requirements; conformance is deferred to a future gate.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-07
    traces_to:
      - BIL-V7-001
  - id: ADR-V7-006
    title: Access does not confer disclosure or disposition authority
    decision: Operational access to information or evidence never confers disclosure or records-disposition authority.
    status: ACCEPTED
    context: Sensitive-information and evidence interactions must preserve privacy and authority boundaries.
    consequence: Privacy records carry prohibited-inference statements enforcing this boundary.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-09
    traces_to:
      - PRIV-V7-002
  - id: ADR-V7-007
    title: Button actions express House command intents
    decision: A Button action expresses a command intent to The House and never mutates governed truth directly.
    status: ACCEPTED
    context: The Button is a presentation and collection surface; The House owns governed lifecycle truth.
    consequence: Every action maps to a command intent, query intent, or local interaction, and every command names its House authority.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-11
    traces_to:
      - CMD-V7-010
  - id: ADR-V7-008
    title: Documentary screen states do not authorize implementation
    decision: Screen states and wireflows are documentary and low-fidelity, and do not authorize implementation or final visual design.
    status: ACCEPTED
    context: Package 2 specifies interaction behaviour without producing final design or code.
    consequence: All screen-state and wireflow records carry non-authorization and low-fidelity markers.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-11
    traces_to:
      - SCREEN-V7-001
  - id: ADR-V7-009
    title: Organization and representative authority are distinct
    decision: Organization identity and representative authority are modelled as distinct resolutions.
    status: ACCEPTED
    context: A representative may act for an organization only through a distinct, verifiable authority.
    consequence: Separate command intents resolve organization selection and representative authority.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-12
    traces_to:
      - CMD-V7-005
  - id: ADR-V7-010
    title: Applicability is derived from House facts
    decision: Jurisdiction, season, pathway, and applicability are derived from House facts, not entered by the user.
    status: ACCEPTED
    context: Applicable requirements must reflect authoritative House data.
    consequence: Applicability queries read derived House facts and requirements reflect that derivation.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-13
    traces_to:
      - QRY-V7-003
  - id: ADR-V7-011
    title: Completeness is derived, not asserted
    decision: Submission completeness and eligibility are derived signals, not user-asserted claims.
    status: ACCEPTED
    context: Submission eligibility must reflect derived requirements and evidence state.
    consequence: Submission is enabled only when derived completeness is met, with each unmet condition explained.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-15
    traces_to:
      - VAL-V7-004
  - id: ADR-V7-012
    title: Evidence replacement preserves history
    decision: Replacing or withdrawing evidence preserves prior evidence history.
    status: ACCEPTED
    context: Evidence provenance and history are institutionally significant.
    consequence: Evidence commands preserve prior versions and never imply replacement erases history.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-14
    traces_to:
      - CMD-V7-009
  - id: ADR-V7-013
    title: Submission receipt is not approval
    decision: A submission receipt confirms recording for review and is not an approval.
    status: ACCEPTED
    context: Users must not infer approval from a submission receipt.
    consequence: Submission status messages distinguish receipt from approval.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-15
    traces_to:
      - SMSG-V7-001
  - id: ADR-V7-014
    title: Return for information is not refusal
    decision: Returning a submission for information requests information and is not a refusal.
    status: ACCEPTED
    context: A return preserves the submission and requests additional information.
    consequence: Return status messages state that information is requested, not refused.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-16
    traces_to:
      - SMSG-V7-002
  - id: ADR-V7-015
    title: Review recommendation is not a governed decision
    decision: A reviewer recommendation is not itself a governed decision.
    status: ACCEPTED
    context: Governed decisions are recorded through kernel-governed transitions.
    consequence: Reviewer command intents record recommendations or outcomes within authority, not final decisions.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-18
    traces_to:
      - CMD-V7-013
  - id: ADR-V7-016
    title: Payment acknowledgement is not accounting confirmation
    decision: A payment acknowledgement is not an accounting confirmation.
    status: ACCEPTED
    context: Provider payment acknowledgement precedes finance accounting confirmation.
    consequence: Payment status messages distinguish acknowledgement from accounting confirmation.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-17
    traces_to:
      - SMSG-V7-003
  - id: ADR-V7-017
    title: Approval is not activation
    decision: Approval does not by itself constitute activation or active standing.
    status: ACCEPTED
    context: Activation depends on approval and additional dependencies being satisfied.
    consequence: Activation status messages distinguish approval from active standing.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-17
    traces_to:
      - SMSG-V7-004
  - id: ADR-V7-018
    title: Support acquires no governed authority
    decision: Support-assisted interactions never transfer governed authority to support.
    status: ACCEPTED
    context: Support helps users navigate without deciding, disclosing, or disposing.
    consequence: The support workbench prohibits decision, reconciliation, activation, and restricted disclosure.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-18
    traces_to:
      - BENCH-V7-003
  - id: ADR-V7-019
    title: Wireflows are low-fidelity and non-final
    decision: Package 2 wireflows are low-fidelity and non-final, communicating structure and sequence only.
    status: ACCEPTED
    context: Package 2 must not produce final visual design.
    consequence: Wireflow records carry a low-fidelity, non-final marker.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-11
    traces_to:
      - WIRE-V7-001
  - id: ADR-V7-020
    title: Accessibility applies to every state and recovery
    decision: Accessibility requirements apply to every interaction state and recovery path.
    status: ACCEPTED
    context: Accessibility must not be limited to primary success paths.
    consequence: Accessibility behaviours cover loading, error, stale-disclosed, and recovery states.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-19
    traces_to:
      - A11YB-V7-002
  - id: ADR-V7-021
    title: Bilingual meaning is semantic, not literal
    decision: Bilingual content preserves equivalent institutional meaning rather than literal translation.
    status: ACCEPTED
    context: Governed meaning must remain equivalent across English and French.
    consequence: Bilingual semantic records specify equivalent meaning requirements for both languages.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-19
    traces_to:
      - BSEM-V7-001
  - id: ADR-V7-022
    title: Visual form expresses governed meaning and carries no production tokens
    decision: The visual language is documentary and is described by role and intent, never as production tokens, stylesheet, or framework configuration.
    status: ACCEPTED
    context: A visual system could drift into implementation and prematurely fix production values.
    consequence: Visual specifications are recorded as documentary role and intent and authorize no implementation.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-22
    traces_to:
      - VIS-V7-002
  - id: ADR-V7-023
    title: Every visual state retains a governed semantic source
    decision: Each component and status state names the governed semantic source that determines its meaning.
    status: ACCEPTED
    context: Visual states could otherwise drift away from institutional meaning.
    consequence: Component and status records name a governed semantic source and cannot present unrecorded outcomes.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-25
    traces_to:
      - DSPEC-V7-003
  - id: ADR-V7-024
    title: Workbench design preserves authority separation
    decision: Reviewer, finance, support, privacy, and administrative-correction workbench designs remain distinct and never merge authorities.
    status: ACCEPTED
    context: Merging staff authorities in design would undermine the governed separation model.
    consequence: Each workbench design names its authority posture, constraints, and prohibited actions.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-26
    traces_to:
      - COMP-V7-017
  - id: ADR-V7-025
    title: Reference prototypes are candidates, not approvals
    decision: Reference prototypes are recorded as reference candidates that are not approved, usability-validated, production-final, or implemented.
    status: ACCEPTED
    context: High-fidelity design candidates could be mistaken for approved production design.
    consequence: Every reference prototype carries a reference-candidate status and a pending validation posture.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-30
    traces_to:
      - PROTO-V7-001
  - id: ADR-V7-026
    title: English and French content terms trace to one canonical governed concept
    decision: Each content term in English and in French traces to a single canonical governed concept, and validated translations remain pending.
    status: ACCEPTED
    context: Divergent bilingual terminology would fracture governed meaning.
    consequence: Content-term records name a canonical concept and equivalent English and French semantic requirements.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-28
    traces_to:
      - TERM-V7-001
  # --- Package 4 decisions (V7-32 through V7-42) ---
  - id: ADR-V7-027
    title: No validation family substitutes for another
    decision: Each validation family relies only on its own permitted evidence, and evidence from one family is never proof for another.
    status: ACCEPTED
    context: Conflating families would let design completeness or an automated scan masquerade as usability or conformance.
    consequence: Each validation family records its own objective, permitted evidence, and prohibited inference, and fails closed where its evidence is absent.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-32
    traces_to:
      - VALF-V7-001
  - id: ADR-V7-028
    title: No issue closes on a design-file change alone
    decision: An issue closes only when its remediation is retested under the family that raised it and the retest produces the qualifying evidence.
    status: ACCEPTED
    context: Closing issues by edit would leave the underlying experience unproven.
    consequence: Every remediation names a retest rule and every issue traces to what raised it.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-41
    traces_to:
      - VALF-V7-004
  - id: ADR-V7-029
    title: Aggregation is not anonymization
    decision: An aggregate is treated as potentially identifying until a named protection is demonstrated.
    status: ACCEPTED
    context: Small-population aggregates can re-identify individuals.
    consequence: Every measurement definition names an aggregation rule with thresholds and protections, and a metric is never treated as proof.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-38
    traces_to:
      - MEAS-V7-001
  - id: ADR-V7-030
    title: A specification is not an implementation
    decision: A handed-off specification is not built, rendered, or accepted by being handed off, and completed development is not acceptance.
    status: ACCEPTED
    context: Treating a specification as an implementation would skip conformance evaluation and acceptance.
    consequence: Each handoff artifact names conformance dimensions, implementation and design-review evidence, and a future acceptance authority.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-39
    traces_to:
      - HAND-V7-001
  - id: ADR-V7-031
    title: Machine translation is insufficient for bilingual equivalence
    decision: Bilingual equivalence requires qualified human judgement of institutional meaning, not machine or literal matching.
    status: ACCEPTED
    context: Fluent or literal translations can silently alter governed meaning.
    consequence: The bilingual validation family requires qualified human judgement and fails closed on machine or literal evidence alone.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V7-36
    traces_to:
      - VALF-V7-006
