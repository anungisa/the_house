    gate_disposition: AFFILIATION_INTERACTION_AND_SCREEN_STATE_MODEL_READY
    conditions:
      - Package 1 experience foundation is inherited and frozen
      - No unresolved backlog item points to a completed gate
      - No record authorizes implementation or final visual design
      - Every controlled record carries a non-implementation status
      - Every user action maps to a command intent, query intent, or local interaction
      - Every command intent names a House authority
      - Every experience surface belongs to a defined authority domain
      - Every actor journey is covered by at least one task flow
      - Every affiliation stage traces to at least one surface or view
      - Every view defines its required screen states
      - Screen states cover loading, empty, success, error, denied, and recovery
      - Representative authority and organization identity are modelled distinctly
      - Applicability and completeness are derived from House facts and not asserted
      - Evidence interactions preserve provenance and history
      - Submission distinguishes receipt from approval
      - Return for information is distinguished from refusal
      - Review recommendation is distinguished from a governed decision
      - Payment acknowledgement is distinguished from accounting confirmation
      - Approval is distinguished from activation
      - Staff workbenches declare authority constraints and prohibited actions
      - Support acquires no governed authority
      - Accessibility applies to every state and recovery path
      - Bilingual meaning is specified as equivalent and not literal
      - Package 2 receives line-level review and a separate freeze commit
