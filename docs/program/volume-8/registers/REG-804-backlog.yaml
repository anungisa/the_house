    kind: ASM
    title: A transactional outbox and a message transport will exist at integration time
    statement: >-
      Assumption that a later, separately governed package will provide a
      transactional outbox and a message transport capable of at-least-once
      delivery, without which the event and delivery contracts cannot be realized.
    owner: Aubert Nungisa (Accountable Program Authority)
    required_evidence: A named outbox and transport proven to support at-least-once delivery
    validation_status: PENDING_VALIDATION
