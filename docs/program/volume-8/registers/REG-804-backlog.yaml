  - id: RISK-V8-004
    kind: RISK
    title: Provider callbacks may deliver unverifiable outcomes at integration time
    statement: >-
      Risk that an external provider delivers an unauthenticated, tampered, or
      unverifiable outcome that cannot be reconciled, leaving affiliation finance
      or verification state unresolved.
    owner: Aubert Nungisa (Accountable Program Authority)
    required_evidence: A reconciliation path that resolves every admitted provider outcome against House state
    validation_status: PENDING_VALIDATION
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
