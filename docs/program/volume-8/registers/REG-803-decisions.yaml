register_id: REG-803
name: Volume 8 Decisions
status: RATIFIED
version: 1.0.0
records:
  - id: ADR-V8-001
    title: Every contract resolves to a single institutional authority and authoritative source
    decision: >-
      No contract surface, interaction, or exchange may be defined without naming a
      single owning institutional authority and a single authoritative source of
      truth. Contracts whose authority cannot be named fail closed.
    status: ACCEPTED
    context: >-
      Ambiguous ownership of API and event contracts causes drift, duplicated
      authority, and unauthorized inference. The platform requires a single named
      authority per contract before definition proceeds.
    consequence: >-
      Later packages must record authority and source for every contract; undefined
      authority blocks definition. No runtime effect is authorized by this decision.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-01
  - id: ADR-V8-002
    title: Governed events are at-least-once through the transactional outbox
    decision: >-
      Governed integration events are emitted through the transactional outbox and
      delivered at least once. No contract may claim exactly-once delivery; consumers
      deduplicate.
    status: ACCEPTED
    context: >-
      Exactly-once delivery is not achievable across a broker boundary; the platform
      already governs a transactional outbox and requires consumers to absorb
      duplicates idempotently.
    consequence: >-
      Every event and consumer contract names a delivery posture and deduplication
      obligation. Broker sessions are not enabled. No implementation is authorized.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-05
    traces_to:
      - V8-06
  - id: ADR-V8-003
    title: Errors carry language-neutral canonical codes and least-disclosure messages
    decision: >-
      Every error is identified by a stable, language-neutral canonical code. Human
      messages are a presentation of the code and never the contract, and they carry
      only what the caller is authorized to know.
    status: ACCEPTED
    context: >-
      Bilingual operation and privacy obligations require a machine-stable error
      identity independent of language, and prohibit leaking restricted information
      into messages or logs.
    consequence: >-
      Later packages define error contracts around canonical codes with named privacy
      and logging constraints. No implementation is authorized.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-07
    traces_to:
      - V8-08
  - id: ADR-V8-004
    title: Breaking contract changes require consumer evidence and a deprecation path
    decision: >-
      A breaking change to any contract may proceed only with consumer evidence and an
      evidenced deprecation path that includes notice, coexistence, migration, and a
      satisfied sunset condition.
    status: ACCEPTED
    context: >-
      Uncoordinated breaking changes strand consumers. Change discipline must be
      governed before any contract is published.
    consequence: >-
      Later packages must record compatibility state and consumer evidence for every
      change. No implementation or contract withdrawal is authorized.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-10
  - id: ADR-V8-005
    title: The House is the sole institutional authority for the affiliation domain
    decision: >-
      Every affiliation resource, command, query, and event resolves to The House as
      institutional authority and to House affiliation lifecycle state as authoritative
      source. No experience layer, staff role, or provider holds affiliation authority.
    status: ACCEPTED
    context: >-
      The affiliation domain is the first governed domain defined over the Package 1
      foundation. Its authority must be named unambiguously before any affiliation
      contract is defined, consistent with ADR-V8-001.
    consequence: >-
      Every affiliation contract record names House authority and House lifecycle state.
      An affiliation contract whose authority cannot be named fails closed. No
      implementation is authorized.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-11
    traces_to:
      - V8-01
  - id: ADR-V8-006
    title: Affiliation resources are logical definitions, not wire schemas
    decision: >-
      Affiliation resources are modelled as logical resource contracts that name an
      owning authority, an authoritative source, and a purpose. They define no
      serialization, storage, field list, or transport.
    status: ACCEPTED
    context: >-
      Package 2 defines logical contracts only. Modelling resources as wire schemas
      would leak implementation and exceed the package scope and freeze discipline.
    consequence: >-
      The contract-surface register carries a logical-resource kind; affiliation
      resources are validated for authority, source, and purpose. No schema, storage,
      or transport is authorized.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-13
    traces_to:
      - V8-11
  - id: ADR-V8-007
    title: Affiliation decisions and high-risk transitions are evidence-bearing at the kernel
    decision: >-
      Affiliation return, decision, and activation are high-risk governed transitions
      that create evidence metadata within the same transaction that records the
      transition, consistent with the Governance Kernel evidence obligations.
    status: ACCEPTED
    context: >-
      Affiliation outcomes carry accountability and privacy weight. Evidence must be
      created atomically with the transition, never as a later side effect.
    consequence: >-
      High-risk affiliation command contracts name their evidence obligation and their
      guards. Low-risk transitions require completeness only. No implementation is
      authorized.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-15
    traces_to:
      - V8-19
  - id: ADR-V8-008
    title: Affiliation finance is reconciled as a governed fact and never moves money
    decision: >-
      The affiliation fee obligation is registered as a governed fact and reconciled
      against recorded settlement. The activation fees-paid guard resolves against the
      reconciled finance record, not against an external processor.
    status: ACCEPTED
    context: >-
      Affiliation activation depends on settlement, but Package 2 authorizes no payment
      processor, ledger, or provider integration. Finance must be modelled as a
      reconciled governed fact only.
    consequence: >-
      The finance-and-reconciliation resource and the reconcile command define settlement
      as accept, reject, or quarantine semantics. No payment mechanism or money movement
      is authorized.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-19
    traces_to:
      - V8-09
  - id: ADR-V8-009
    title: Events are governed facts, not commands
    decision: >-
      An affiliation event records a fact that has already committed; a command
      requests a change and may be rejected. An event is emitted only after its
      transition commits and never acts as an instruction.
    status: ACCEPTED
    context: >-
      Conflating events with commands would let a report of a fact re-drive a
      transition and would break the governance kernel's sole authority over
      state.
    consequence: >-
      The event taxonomy defines events as post-commit reports; no event
      authorizes, replays, or re-drives a transition.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-21
    traces_to:
      - V8-04
  - id: ADR-V8-010
    title: Domain, integration, notification, audit, webhook, and callback events are distinct
    decision: >-
      The affiliation event plane recognizes distinct event types, each with a
      distinct purpose and audience; none is a synonym for another.
    status: ACCEPTED
    context: >-
      Treating all events as one type would blur audience entitlement, trust
      boundaries, and disclosure authority.
    consequence: >-
      Each event type is separately defined with its own authority, audience, and
      boundary; producers and consumers are scoped to types.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-21
    traces_to:
      - V8-05
  - id: ADR-V8-011
    title: State and outbox share one atomicity requirement
    decision: >-
      The authoritative affiliation state change and the outbox record of its
      event are written in one committed transaction, or neither is.
    status: ACCEPTED
    context: >-
      Writing an event without its committed state change, or committing state
      without its owed event, would break the transactional-outbox guarantee.
    consequence: >-
      The outbox atomicity requirement binds state and outbox record to a single
      transaction; persistence is distinct from publication.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-24
    traces_to:
      - V8-05
  - id: ADR-V8-012
    title: At-least-once transport is distinct from exactly-once business effect
    decision: >-
      Affiliation delivery is at-least-once at the transport boundary; exactly-once
      effect is a business invariant enforced by governed state and idempotent
      consumers, never a transport promise.
    status: ACCEPTED
    context: >-
      Presuming exactly-once transport would place a business invariant on an
      unreliable guarantee and would produce duplicate effects.
    consequence: >-
      Delivery semantics require duplicate-tolerant, idempotent consumers; no
      exactly-once transport is presumed.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-24
    traces_to:
      - V8-06
  - id: ADR-V8-013
    title: Global ordering is not presumed
    decision: >-
      Global ordering of affiliation events is never presumed; ordering is scoped
      explicitly, such as per affiliation aggregate.
    status: ACCEPTED
    context: >-
      Depending on global order would create a hidden coupling that no transport
      can guarantee without broker sessions, which are not enabled in v1.
    consequence: >-
      Ordering requirements are scoped; a consumer that would depend on global
      order fails closed.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-26
    traces_to:
      - V8-06
  - id: ADR-V8-014
    title: Replay requires authority, provenance, and evidence
    decision: >-
      A governed replay is an authoritative re-emission under authority and
      evidence, not an arbitrary re-send, and never produces a duplicate business
      effect.
    status: ACCEPTED
    context: >-
      Unauthenticated or unevidenced replay could fabricate or duplicate governed
      outcomes.
    consequence: >-
      The replay requirement names replay authority and replay evidence; replayed
      events carry the same identity and a replay marker.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-26
    traces_to:
      - V8-06
  - id: ADR-V8-015
    title: Webhook acknowledgement is not reconciliation
    decision: >-
      An acknowledgement of an inbound signal confirms receipt only; a provider's
      asserted outcome becomes authoritative only after reconciliation against the
      House governed state.
    status: ACCEPTED
    context: >-
      Treating acknowledgement as reconciliation would let a provider signal set
      authoritative state without House resolution.
    consequence: >-
      Webhook and callback contracts separate acknowledgement from reconciliation
      and name a reconciliation dependency.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-25
    traces_to:
      - V8-05
  - id: ADR-V8-016
    title: Unknown provider outcomes fail closed until reconciliation
    decision: >-
      An unknown, ambiguous, or unverifiable provider outcome remains unresolved
      and fails closed until reconciliation resolves it.
    status: ACCEPTED
    context: >-
      Optimistically treating an unknown outcome as success, or silently as
      failure, would corrupt governed affiliation state.
    consequence: >-
      Callback contracts carry an unknown-outcome posture and a reconciliation
      dependency; no unresolved outcome leaks into governed state.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-25
    traces_to:
      - V8-05
  - id: ADR-V8-017
    title: Failure preserves history; correction is forward compensation
    decision: >-
      No failure path discards the authoritative record or the audit trail;
      correction of a committed outcome uses forward compensation, never a silent
      rewrite of history.
    status: ACCEPTED
    context: >-
      Erasing or overwriting history on failure would break append-only audit and
      immutable evidence guarantees.
    consequence: >-
      Failed and quarantined items retain identity, provenance, and history;
      compensation cannot un-commit a fact or delete an audit event.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-28
    traces_to:
      - V8-05
  - id: ADR-V8-018
    title: Notification generation is distinct from delivery
    decision: >-
      Generating a correct, minimum-necessary, bilingual notification is governed
      separately from delivering it across a channel; a notification is not
      delivered because it was generated.
    status: ACCEPTED
    context: >-
      Conflating generation with delivery would let generation imply a delivery
      guarantee the transport cannot provide.
    consequence: >-
      Notification contracts govern generation; delivery is an at-least-once
      outbox concern with separate delivery evidence.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-27
    traces_to:
      - V8-05
  - id: ADR-V8-019
    title: Restricted evidence is excluded from routine event and notification content
    decision: >-
      Affiliation events and notifications reference governed evidence by identity
      and never embed restricted evidence; entitled access is separately governed.
    status: ACCEPTED
    context: >-
      Embedding restricted evidence in routine content would disclose it across
      trust boundaries beyond audience entitlement.
    consequence: >-
      Events and notifications carry minimum-necessary content; an event or
      notification that would carry restricted evidence fails closed.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-29
    traces_to:
      - V8-08
  - id: ADR-V8-020
    title: Event compatibility is evaluated against known consumers
    decision: >-
      Event compatibility is evaluated against known producers and consumers with
      consumer evidence; a breaking change requires a new event contract version
      and an evidenced deprecation path.
    status: ACCEPTED
    context: >-
      Presuming universal compatibility, or changing a contract without consumer
      evidence, would silently break known consumers.
    consequence: >-
      Compatibility rules state a compatibility state and name consumer evidence;
      breaking changes proceed only through an evidenced deprecation path.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-30
    traces_to:
      - V8-07
  - id: ADR-V8-021
    title: Provider custody is not institutional authority
    decision: >-
      Provider custody of governed data is a handling relationship and confers no
      authority to determine governed facts or bind Curling Canada.
    status: ACCEPTED
    context: >-
      Treating a provider's custody or assertion as authority would let external
      parties determine governed facts and erode institutional authority.
    consequence: >-
      A provider assertion is an input to institutional determination; authority
      over governed facts is retained internally across every exchange.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-31
    traces_to:
      - V8-32
  - id: ADR-V8-022
    title: File receipt is not file acceptance and imported records are not authoritative on receipt
    decision: >-
      File received, file accepted, records imported, and imported records
      authoritative are distinct governed boundaries that are never collapsed.
    status: ACCEPTED
    context: >-
      Collapsing receipt into acceptance would let unevaluated content acquire
      governed effect.
    consequence: >-
      Received content is evaluated before acceptance; acceptance is evaluated
      before any record becomes authoritative.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-34
    traces_to:
      - V8-31
  - id: ADR-V8-023
    title: Structural validity is not semantic or institutional validity
    decision: >-
      A complete manifest and a verified integrity check establish structure only
      and are distinct from semantic and institutional validity.
    status: ACCEPTED
    context: >-
      Treating a well-formed, intact file as valid content would admit
      structurally correct but institutionally invalid records.
    consequence: >-
      Files pass structural, then semantic, then institutional evaluation; each is
      distinct and none implies the next.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-33
    traces_to:
      - V8-31
  - id: ADR-V8-024
    title: Partial success is explicit and rejected or quarantined records are non-authoritative
    decision: >-
      Partial success enumerates each record's disposition, and rejected or
      quarantined records remain non-authoritative.
    status: ACCEPTED
    context: >-
      A silent partial success or a silent discard would hide which records took
      governed effect.
    consequence: >-
      Every import outcome names accepted, rejected, and quarantined records
      explicitly and preserves the original exchange record.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-34
    traces_to:
      - V8-31
  - id: ADR-V8-025
    title: Imports cannot silently create governed authority
    decision: >-
      Importing a record that asserts a role or standing does not confer that role
      or standing; authority is granted only through the governed lifecycle.
    status: ACCEPTED
    context: >-
      Allowing file intake to grant authority would bypass governed
      authorization.
    consequence: >-
      Every import declares its authoritative-state consequence, defaulting to no
      governed effect for unauthorized content.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-34
    traces_to:
      - V8-31
  - id: ADR-V8-026
    title: Export authority is distinct from read access
    decision: >-
      Authority to export governed information outside the institution is a
      separate, explicit grant and is never inferred from internal read access.
    status: ACCEPTED
    context: >-
      Inferring export authority from read access would let any reader disclose
      governed information externally.
    consequence: >-
      Every export names an explicit export authority, recipient authority, and
      disclosure basis under minimum-necessary content.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-35
    traces_to:
      - V8-31
  - id: ADR-V8-027
    title: Export generation, delivery, receipt, processing, and reconciliation are distinct
    decision: >-
      Generating, delivering, receiving, processing, and reconciling an export are
      distinct outcomes and none is presumed from another.
    status: ACCEPTED
    context: >-
      Presuming delivery or processing from generation would overstate what an
      export achieved.
    consequence: >-
      Each export declares delivery, receipt, processing, and reconciliation
      evidence; unknown outcomes are held until reconciled.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-35
    traces_to:
      - V8-31
  - id: ADR-V8-028
    title: Migration mapping is not identity resolution or authority confirmation
    decision: >-
      Migration mapping proposes translations, identity resolution determines
      correspondence, and authority confirmation determines standing; the three
      are distinct.
    status: ACCEPTED
    context: >-
      Treating a mapping as resolved identity or confirmed authority would
      fabricate governed standing.
    consequence: >-
      Mappings declare an identity-resolution dependency; unresolved and ambiguous
      records are quarantined, not presumed resolved.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-36
    traces_to:
      - V8-31
  - id: ADR-V8-029
    title: Migration completion is not business acceptance or source retirement
    decision: >-
      Completing a migration does not by itself accept its content as
      authoritative or retire the source system.
    status: ACCEPTED
    context: >-
      Equating migration completion with acceptance or source retirement would
      make unevaluated migrated data authoritative.
    consequence: >-
      Coexistence and cutover are governed; the source ceases to be authoritative
      only when cutover conditions are met.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-36
    traces_to:
      - V8-31
  - id: ADR-V8-030
    title: Provider termination is not data return, deletion, or exit completion
    decision: >-
      Provider termination, data return, deletion evidence, and exit completion
      are distinct, separately evidenced obligations.
    status: ACCEPTED
    context: >-
      Treating termination as return or deletion would leave governed data
      unaccounted for at the end of a provider relationship.
    consequence: >-
      Exit completes only on evidenced data return, evidenced deletion with
      residual copies addressed, and reconciliation.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-37
    traces_to:
      - V8-31
  - id: ADR-V8-031
    title: Provider certification is not Curling Canada confirmation
    decision: >-
      A provider's certification of an outcome, including deletion, is an input and
      is not Curling Canada confirmation.
    status: ACCEPTED
    context: >-
      Accepting provider certification as confirmation would delegate institutional
      assurance to the provider.
    consequence: >-
      Provider certifications are reconciled and confirmed internally before they
      carry governed effect.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-37
    traces_to:
      - V8-31
  - id: ADR-V8-032
    title: Batch replay creates no new governed authority
    decision: >-
      Replaying a batch re-runs a prior exchange under recorded authority and
      produces evidence, but creates no new governed authority.
    status: ACCEPTED
    context: >-
      Allowing replay to create authority would let re-runs manufacture governed
      effects the original did not carry.
    consequence: >-
      Replay proceeds only under recorded replay authority; idempotency prevents
      duplicate governed effect.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-38
    traces_to:
      - V8-31
  - id: ADR-V8-033
    title: Manual and transitional exchanges are governed to the same standard
    decision: >-
      Manual, document-based, and transitional exchanges are governed, recorded,
      evidenced, and where applicable bilingual and accessible.
    status: ACCEPTED
    context: >-
      Treating manual exchanges as ungoverned would create an unaudited path
      around governance.
    consequence: >-
      Every manual exchange produces a governed record and evidence and meets its
      bilingual and accessibility obligations.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V8-39
    traces_to:
      - V8-31

