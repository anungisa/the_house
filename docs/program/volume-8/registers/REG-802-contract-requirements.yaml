  - id: CONTRACT-V8-111
    kind: COMPATIBILITY_RULE
    title: Affiliation additive-change compatibility rule
    statement: >-
      An additive, optional change to an affiliation contract is backward-compatible
      only when consumer evidence confirms no consumer requires the added element.
    compatibility_state: BACKWARD_COMPATIBLE
    consumer_evidence: >-
      Evidence that no existing affiliation consumer treats the added element as
      required before the change is made.
    deprecation_rule: Not applicable for additive change
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    future_blocking_gate: V9-G1
    chapter_ref: V8-20
  - id: CONTRACT-V8-112
    kind: COMPATIBILITY_RULE
    title: Affiliation breaking-change deprecation rule
    statement: >-
      A breaking change to an affiliation command class, event envelope, or resource
      authority may proceed only through an evidenced deprecation path.
    compatibility_state: BREAKING_CHANGE
    consumer_evidence: >-
      Evidence of every affiliation consumer that depends on the contract and
      confirmation of their migration before sunset.
    deprecation_rule: >-
      Notice, a coexistence period in which both contracts remain valid, a migration
      path, and a sunset condition that is satisfied before withdrawal.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    future_blocking_gate: V9-G1
    chapter_ref: V8-20
