  - id: ERROR-V8-011
    kind: ERROR_SEMANTIC
    title: Affiliation-incomplete rejection
    statement: >-
      A validated refusal to submit or resubmit because required fields or
      documents were incomplete. A rejection, not a failure.
    canonical_code: AFFILIATION_INCOMPLETE
    retryable: NON_RETRYABLE
    user_safe_semantic: >-
      The affiliation could not be submitted because required information was
      incomplete.
    logging_constraint: >-
      Log the canonical code and correlation id; do not log restricted evidence
      details in caller-visible messages.
    correlation_requirement: Carries the request correlation id
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    future_blocking_gate: V9-G1
    chapter_ref: V8-20
  - id: ERROR-V8-012
    kind: ERROR_SEMANTIC
    title: Reconciliation-mismatch failure
    statement: >-
      An inability to treat an affiliation as settled because recorded settlement
      did not reconcile against the registered obligation. Resolves to quarantine.
    canonical_code: RECONCILIATION_MISMATCH
    retryable: CONDITIONAL
    user_safe_semantic: >-
      The affiliation settlement could not be confirmed and is held for review.
    privacy_constraint: >-
      Must not disclose settlement amounts or finance details to a caller not
      authorized to know them.
    correlation_requirement: Carries the request correlation id
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    future_blocking_gate: V9-G1
