records:
  - id: COMMAND-V8-001
    kind: COMMAND_CLASS
    title: Submit affiliation application command
    statement: >-
      Requests the governed transition of an affiliation application from draft to
      submitted. Honoured only when its preconditions are satisfied.
    interaction_type: SYNCHRONOUS_COMMAND
    institutional_authority: House
    preconditions:
      - Application exists in draft state under the caller's tenant
      - Required fields are complete per governed policy
    result_semantics: >-
      Acceptance means the submission was validated and admitted; completion means
      the governed transition committed. Acceptance is never presented as
      completion.
    error_semantics: >-
      Rejection for unmet preconditions is distinguished from failure to complete;
      neither is presented as success.
    idempotency_requirement: REQUIRED_PER_KEY
    idempotency_scope: Per application and submission idempotency key
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    future_blocking_gate: V9-G1
    chapter_ref: V8-04
  - id: COMMAND-V8-002
    kind: COMMAND_CLASS
    title: Approve affiliation application command
    statement: >-
      Requests the governed transition of an affiliation application from under
      review to approved. High-risk; evidence-bearing at the kernel.
    interaction_type: SYNCHRONOUS_COMMAND
    institutional_authority: House
    preconditions:
      - Application is under review under the caller's tenant
      - Caller holds the reviewer grant in the authorization context
    result_semantics: >-
      Acceptance admits the approval request; completion means the approval
      transition committed and evidence metadata was recorded.
    error_semantics: >-
      Rejection for missing reviewer grant is distinguished from failure to
      complete the transition.
    idempotency_requirement: REQUIRED_PER_KEY
    idempotency_scope: Per application and approval idempotency key
    concurrency_precondition: >-
      Concurrent approvals of the same application are serialized; the losing
      attempt receives an explicit conflict outcome.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    future_blocking_gate: V9-G1
    chapter_ref: V8-04
  - id: COMMAND-V8-003
    kind: COMMAND_CLASS
    title: Revoke affiliation command
    statement: >-
      Requests the governed transition of an active or suspended affiliation to
      revoked. High-risk; evidence-bearing at the kernel.
    interaction_type: SYNCHRONOUS_COMMAND
    institutional_authority: House
    preconditions:
      - Affiliation is active or suspended under the caller's tenant
      - Caller holds the revocation grant in the authorization context
    result_semantics: >-
      Acceptance admits the revocation request; completion means the revocation
      transition committed.
    error_semantics: >-
      Rejection for insufficient authority is distinguished from failure to
      complete.
    idempotency_requirement: REQUIRED_PER_KEY
    idempotency_scope: Per affiliation and revocation idempotency key
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    future_blocking_gate: V9-G1
    chapter_ref: V8-04
  - id: QUERY-V8-001
    kind: QUERY_CLASS
    title: Read affiliation status query
    statement: >-
      Returns the authoritative current affiliation status for a resource within
      the caller's tenant scope.
    interaction_type: SYNCHRONOUS_QUERY
    institutional_authority: House
    authoritative_source: House affiliation lifecycle state
    staleness_posture: AUTHORITATIVE_CURRENT
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    future_blocking_gate: V9-G1
