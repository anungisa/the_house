  - id: QUERY-V8-002
    kind: QUERY_CLASS
    title: List affiliations projection query
    statement: >-
      Returns a bounded-staleness projection of affiliations for reporting and
      experience use; explicitly non-authoritative.
    interaction_type: SYNCHRONOUS_QUERY
    institutional_authority: House
    authoritative_source: House read-model projection
    staleness_posture: BOUNDED_STALENESS_PROJECTION
    source_posture: Non-authoritative projection; consumers must not treat as authoritative
    validation_status: DEFINED
