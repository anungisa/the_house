  - id: PROVSURF-V8-001
    kind: PROVIDER_CONTRACT_SURFACE
    title: Identity-provider contract surface
    statement: >-
      The governed contract surface for an external identity provider that holds
      custody of authentication material. Custody confers no institutional
      authority over governed identity facts, which remain determined by the
      House.
    institutional_authority: House
    authoritative_source: House affiliation lifecycle state
    trust_boundary: >-
      The boundary between the House domain and the external identity provider;
      provider assertions are inputs, not determinations.
    incident_notification_dependency: >-
      The provider is required to notify the House of incidents affecting
      governed identity data within the governed relationship.
    continuity_dependency: >-
      A degraded or unavailable identity provider is handled without silent loss
      of governed meaning.
    exit_dependency: >-
      Provider exit requires evidenced data return and deletion before the
      relationship is treated as closed.
    classification: INTERNAL_OPERATIONAL
    sensitivity: HIGH
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    future_blocking_gate: V9-G1
