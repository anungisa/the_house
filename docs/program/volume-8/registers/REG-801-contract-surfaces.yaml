  - id: WHCTX-V8-001
    kind: WEBHOOK_CONTEXT
    title: Provider payment-callback webhook context
    statement: >-
      The governed context for an inbound webhook from a trusted payment
      provider reporting a settlement outcome. Untrusted by default; admitted
      only after authentication and integrity verification.
    institutional_authority: House
    authoritative_source: House affiliation lifecycle state
    interaction_type: WEBHOOK
    authentication_requirement: >-
      The inbound signal must authenticate as a specific trusted payment
      provider before it is admitted.
    integrity_requirement: >-
      The inbound signal must pass integrity verification confirming it was not
      altered in transit.
    replay_protection_dependency: >-
      The inbound signal is protected against replay so a re-delivered signal
      produces no duplicate governed effect.
    unknown_outcome_posture: >-
      An unknown or unverifiable provider outcome remains unresolved and fails
      closed until reconciliation resolves it.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    future_blocking_gate: V9-G1
    chapter_ref: V8-25
  - id: WHCTX-V8-002
    kind: WEBHOOK_CONTEXT
    title: Provider verification-callback webhook context
    statement: >-
      The governed context for an inbound callback from a trusted verification
      provider reporting an asynchronous verification outcome. Acknowledgement
      of receipt is never authoritative reconciliation.
    institutional_authority: House
    authoritative_source: House affiliation lifecycle state
    interaction_type: PROVIDER_CALLBACK
    authentication_requirement: >-
      The inbound callback must authenticate as a specific trusted verification
      provider before it is admitted.
    integrity_requirement: >-
      The inbound callback must pass integrity verification confirming it was
      not altered in transit.
    replay_protection_dependency: >-
      The inbound callback is protected against replay so a re-delivered
      callback produces no duplicate governed effect.
    unknown_outcome_posture: >-
      An unknown verification outcome remains unresolved and fails closed until
      reconciliation resolves it.
    acknowledgement_semantics: >-
      An acknowledgement confirms receipt only and never makes the provider's
      asserted outcome authoritative.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    future_blocking_gate: V9-G1
    chapter_ref: V8-25
  - id: NOTIFCTX-V8-001
    kind: NOTIFICATION_CONTEXT
    title: Applicant affiliation-outcome notification context
    statement: >-
      The governed context for notifying an applicant of a committed affiliation
      outcome. Carries only the minimum necessary content in equivalent English
      and French.
    institutional_authority: House
    authoritative_source: House affiliation lifecycle state
    interaction_type: NOTIFICATION_EVENT
    audience: Applicant acting for a member organization
    disclosure_authority: >-
      House authority to disclose the affiliation outcome to the applicant who
      submitted it.
    minimum_necessary_content: >-
      The governed outcome and the applicant's next step only; no internal
      detail or restricted evidence.
    english_semantic: The affiliation outcome and next step stated in English.
    french_semantic: The affiliation outcome and next step stated in equivalent French.
    accessibility_requirement: >-
      The notification is perceivable by its audience under the platform
      accessibility obligation.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    future_blocking_gate: V9-G1
    chapter_ref: V8-27
  - id: NOTIFCTX-V8-002
    kind: NOTIFICATION_CONTEXT
    title: Reviewer affiliation-assignment notification context
    statement: >-
      The governed context for notifying a reviewer that an affiliation is
      assigned for review. Carries only the minimum necessary content in
      equivalent English and French.
    institutional_authority: House
    authoritative_source: House affiliation lifecycle state
    interaction_type: NOTIFICATION_EVENT
    audience: Reviewer under delegated House authority
    disclosure_authority: >-
      House authority to disclose the review assignment to the entitled
      reviewer.
    minimum_necessary_content: >-
      The assignment and the affiliation subject reference only; no restricted
      evidence.
    english_semantic: The review assignment stated in English.
    french_semantic: The review assignment stated in equivalent French.
    accessibility_requirement: >-
      The notification is perceivable by its audience under the platform
      accessibility obligation.
    validation_status: DEFINED
    authorizes_implementation: false
