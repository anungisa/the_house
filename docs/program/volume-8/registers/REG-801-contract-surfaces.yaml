  - id: TRUST-V8-001
    kind: TRUST_BOUNDARY
    title: Experience-to-House trust boundary
    statement: >-
      The boundary between the Button experience layer and The House. Requests
      crossing it are denied unless authenticated and authorized.
    fail_closed_posture: >-
      A request crossing the boundary is denied by default and admitted only when
      it satisfies the boundary authentication and authorization requirements.
    trusted_callers:
      - Button experience layer (authenticated)
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    future_blocking_gate: V9-G1
    chapter_ref: V8-03
  - id: TRUST-V8-002
    kind: TRUST_BOUNDARY
    title: House-to-provider trust boundary
    statement: >-
      The boundary between The House and external providers. Provider callbacks
      and calls are denied unless authenticated, integrity-verified, and
      authorized.
    fail_closed_posture: >-
      A provider interaction crossing the boundary is denied by default and
      admitted only when it satisfies sender authentication, payload integrity,
      and callback authorization.
    trusted_callers:
      - External providers under contract (authenticated)
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    future_blocking_gate: V9-G1
    chapter_ref: V8-03
  - id: AUTHCTX-V8-001
    kind: AUTHORIZATION_CONTEXT
    title: Affiliation authorization context
    statement: >-
      The context required to authorize an affiliation command or query. Presence
      within the context is never, by itself, permission to act.
    context_elements:
      - Authenticated identity
      - Tenant or organization scope
      - Role or grant
      - Target resource
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    future_blocking_gate: V9-G1
    chapter_ref: V8-03
  - id: PROVIDER-V8-001
    kind: PROVIDER_CONTEXT
    title: External integration-provider context
    statement: >-
      The governed context for an external provider that performs asynchronous
      operations on behalf of the platform. The provider acquires no governed
      authority.
    institutional_authority: Provider
    incident_notification_dependency: >-
      Provider must notify the platform of security and availability incidents
      within a named period.
    continuity_dependency: >-
      Provider must sustain agreed service continuity and recovery objectives.
    exit_dependency: >-
      Provider must permit an orderly, non-punitive exit on termination.
    data_return_dependency: >-
      Provider must return all platform-owned data on exit in a usable form.
    deletion_evidence_dependency: >-
      Provider must provide evidence of deletion of platform-owned data after
      return.
    validation_status: PENDING_VALIDATION
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    future_blocking_gate: V9-G1
    chapter_ref: V8-09
  - id: RESOURCE-V8-001
    kind: LOGICAL_RESOURCE
    title: Affiliation application logical resource
    statement: >-
      The governed definition of an affiliation application: the requested
      affiliation and its declared fields for a member organization. A logical
      definition only; no serialization, storage, or transport is defined.
    institutional_authority: House
    authoritative_source: House affiliation lifecycle state
    purpose: Hold the requested affiliation and its declared fields
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
