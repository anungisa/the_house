  - id: AUTHCTX-V8-002
    kind: AUTHORIZATION_CONTEXT
    title: Applicant authorization context
    statement: >-
      The context required to authorize an applicant draft or submission action.
      Presence within the context is never, by itself, permission to act.
    context_elements:
      - Applicant identity acting for a member organization
      - Tenant or organization scope
      - Affiliation subject owned by the applicant
      - Idempotency key on commands
    validation_status: DEFINED
