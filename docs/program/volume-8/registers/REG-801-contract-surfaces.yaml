  - id: AUTHCTX-V8-003
    kind: AUTHORIZATION_CONTEXT
    title: Reviewer authorization context
    statement: >-
      The context required to authorize a reviewer review, return, decision, or
      activation action under delegated House authority. Reviewer scope is a
      required context element on every decision command.
    context_elements:
      - Reviewer identity under delegated House authority
      - Delegated reviewer scope for tenant and season
      - Affiliation subject under review
      - Idempotency key on commands
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    future_blocking_gate: V9-G1
    chapter_ref: V8-12
  - id: AUTHCTX-V8-004
    kind: AUTHORIZATION_CONTEXT
    title: Staff operational authorization context
    statement: >-
      The context required to authorize House staff operational action, bounded
      away from applicant self-service and reviewer decision authority. Staff
      hold no authority to author or override an affiliation decision.
    context_elements:
      - Staff identity under operational authority
      - Scoped affiliation subject
      - Operational action bounded away from decision authorship
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    future_blocking_gate: V9-G1
    chapter_ref: V8-20
  - id: TRUST-V8-003
    kind: TRUST_BOUNDARY
    title: Applicant-to-House trust boundary
    statement: >-
      The boundary an applicant crosses to reach the House affiliation domain.
      Requests crossing it are denied unless attributable to a known applicant
      context, tenant, and affiliation subject.
    fail_closed_posture: >-
      An applicant request is refused before any affiliation contract is
      evaluated unless it resolves to a known applicant context, tenant, and
      affiliation subject.
    trusted_callers:
      - Applicant acting for a member organization (authenticated)
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    future_blocking_gate: V9-G1
    chapter_ref: V8-12
