  - id: DTRUST-V8-002
    kind: DELIVERY_TRUST_BOUNDARY
    title: Provider-to-House inbound delivery trust boundary
    statement: >-
      The boundary an external provider crosses to reach the House affiliation
      domain. Inbound signals are untrusted until authenticated, integrity-
      verified, scoped, and reconciled.
    fail_closed_posture: >-
      An inbound provider signal is refused before any governed effect unless it
      authenticates as a trusted provider, passes integrity verification, and
      resolves to a known scope.
