  - id: CONTRACT-V8-001
    kind: CONTRACT_SURFACE
    title: Affiliation command surface
    statement: >-
      The governed surface through which affiliation-lifecycle commands are
      requested. Owned by The House as the system-of-record authority; carries
      synchronous commands that request governed state changes.
    interaction_type: SYNCHRONOUS_COMMAND
    institutional_authority: House
    authoritative_source: House affiliation lifecycle state
    purpose: Request governed affiliation-lifecycle transitions
    classification: INTERNAL_OPERATIONAL
    sensitivity: MODERATE
    authentication_dependency: Caller identity established at the House trust boundary
    authorization_dependency: Reviewer or applicant grant evaluated per authorization context
    delivery_posture: SYNCHRONOUS_REQUEST_RESPONSE
    idempotency_requirement: REQUIRED_PER_KEY
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    future_blocking_gate: V9-G1
    chapter_ref: V8-02
    traces_to:
      - V8-01
      - V8-04
