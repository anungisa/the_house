  - id: DTRUST-V8-001
    kind: DELIVERY_TRUST_BOUNDARY
    title: House-to-provider outbound delivery trust boundary
    statement: >-
      The boundary the House crosses to deliver events to an external provider.
      Only content the provider is entitled to receive crosses it.
    fail_closed_posture: >-
      An outbound delivery to a provider is refused unless it resolves to a
      trusted provider and carries only content that provider is entitled to
      receive.
