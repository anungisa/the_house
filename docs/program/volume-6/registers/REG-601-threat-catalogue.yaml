    kind: THREAT
    title: Inaccessible documents and communications
    purpose: A document, notice, or communication a user must read or submit cannot be perceived and has no accessible alternative.
    trust_boundary: BOUNDARY-V6-003
    affected_asset: ASSET-V6-015
    threat_actor: Inaccessible document or provider-produced artifact
