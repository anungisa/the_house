  - id: THREAT-V6-012
    kind: THREAT
    title: Accommodation privacy exposure and prohibited inference
    purpose: Information about a user's barrier or accommodation is used beyond providing the accommodation or supports a prohibited inference about the user.
    trust_boundary: BOUNDARY-V6-001
    affected_right: RIGHT-V6-007
    threat_actor: Over-collection or misuse of accommodation information
    precondition: Accommodation information is not held to minimum-necessary and prohibited inferences are not constrained.
    misuse_path: Accommodation information is reused or correlated to infer restricted facts about a user.
    potential_consequence: Privacy harm and discrimination through misuse of accommodation information.
    preventive_objective: Hold accommodation information to minimum-necessary and prohibit inference beyond providing the accommodation.
    detective_objective: Review accommodation-information use for purpose limitation and prohibited inference.
    corrective_objective: Restrict, notify, and remediate accommodation-information misuse with preserved evidence.
    owner: Privacy Steward
    future_blocking_gate: V9-G1
    evidence: PENDING (accommodation-privacy verification)
