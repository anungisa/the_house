  # ==== Package 3 threats (V6-23, V6-24, V6-25, V6-26, V6-27, V6-28) ====
  - id: THREAT-V6-009
    kind: THREAT
    title: Exclusion through inaccessible workflows
    purpose: A user with a disability or relying on assistive technology cannot complete a governed workflow and is excluded from the service.
    trust_boundary: BOUNDARY-V6-001
    affected_right: RIGHT-V6-006
    threat_actor: Inaccessible governed workflow
    precondition: Workflow accessibility is unverified and no accessible path exists.
    misuse_path: A governed workflow cannot be perceived, operated, or completed by a user with a relevant need.
    potential_consequence: Exclusion of users from governed service and denial of equivalent outcome.
    preventive_objective: Require workflow accessibility tied to user needs with an accessible completable path.
    detective_objective: Verify workflow accessibility and detect uncompletable paths through independent testing.
    corrective_objective: Remediate the workflow and retest before the barrier is considered closed.
    owner: Accessibility Steward
    future_blocking_gate: V11-G1
    evidence: PENDING (accessibility conformance verification)
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-25
    traces_to:
      - RIGHT-V6-006
      - BOUNDARY-V6-001
  - id: THREAT-V6-010
    kind: THREAT
    title: Bilingual semantic divergence
    purpose: Governed meaning diverges across official languages so that one language conveys a different governed outcome than the other.
    trust_boundary: BOUNDARY-V6-001
    affected_asset: ASSET-V6-016
    threat_actor: Non-equivalent language expression
    precondition: Bilingual equivalence is unverified or content is translated literally without preserving meaning.
    misuse_path: An official-language expression conveys a different governed meaning than its counterpart.
    potential_consequence: Users receive materially different governed meaning depending on language.
    preventive_objective: Require semantic equivalence anchored to language-neutral identifiers, not literal translation.
    detective_objective: Independently review official-language pairs for semantic equivalence.
    corrective_objective: Remediate divergent expressions and retest equivalence before reliance.
    owner: Bilingual-Service Steward
    future_blocking_gate: V11-G1
    evidence: PENDING (bilingual-equivalence verification)
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-27
    traces_to:
      - ASSET-V6-016
      - BOUNDARY-V6-001
