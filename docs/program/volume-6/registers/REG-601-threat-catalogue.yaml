  # ==== Rights (V6-03) ====
  - id: RIGHT-V6-001
    kind: RIGHT
    title: Right to notice and transparency
    purpose: The right of data subjects to be informed of how their personal data is collected, used, and disclosed.
    right_holder: Data subject (person or representative)
    protected_outcome: Individuals understand the processing of their personal data.
    control_implication: Requires a notice and transparency control objective and validated legal basis.
    rights_dependency: Depends on the privacy purpose register and records authority.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
