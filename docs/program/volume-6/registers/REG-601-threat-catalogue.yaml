  # ==== Abuse cases (V6-03) ====
  - id: ABUSE-V6-001
    kind: ABUSE_CASE
    title: Reviewer over-access beyond assignment
    purpose: An authorized reviewer accesses governed cases outside their assignment scope.
    trust_boundary: BOUNDARY-V6-001
    affected_asset: ASSET-V6-001
    threat_actor: Authorized reviewer
    precondition: Authorization does not constrain access to assigned cases.
    misuse_path: A reviewer browses or acts on cases outside their assignment.
    potential_consequence: Unauthorized access to governed cases by an otherwise-authorized actor.
    preventive_objective: Constrain reviewer access to assignment scope with fail-closed authorization.
