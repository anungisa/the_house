  # ==== Threats (V6-03) ====
  - id: THREAT-V6-001
    kind: THREAT
    title: Cross-tenant governed-data access
    purpose: An actor obtains governed affiliation data belonging to a tenant or jurisdiction outside their authorized scope.
    trust_boundary: BOUNDARY-V6-005
    affected_asset: ASSET-V6-001
    threat_actor: Authenticated actor exceeding scope
    precondition: Authorization does not fail closed on tenant or jurisdiction context.
    misuse_path: A scoped request is served governed data from another tenant or jurisdiction.
    potential_consequence: Unauthorized disclosure of governed affiliation data across tenants.
    preventive_objective: Enforce fail-closed tenant and jurisdiction scoping on every governed-data access.
    detective_objective: Log and alert on access that crosses tenant or jurisdiction scope.
    corrective_objective: Contain, notify, and remediate cross-tenant exposure with preserved evidence.
    owner: Identity and Authorization Steward
    future_blocking_gate: V7-G1
    evidence: PENDING (authorization control implementation and validation)
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-03
    traces_to:
      - ASSET-V6-001
      - BOUNDARY-V6-005
  - id: THREAT-V6-002
    kind: THREAT
    title: Credential compromise and impersonation
    purpose: An adversary obtains authentication or secret material and impersonates a governed actor.
    trust_boundary: BOUNDARY-V6-001
    affected_asset: ASSET-V6-003
    threat_actor: External adversary or insider
    precondition: Authentication or secret material is exposed, weak, or unrotated.
    misuse_path: Stolen credentials are used to authenticate as a governed actor and act within their scope.
    potential_consequence: Impersonation, unauthorized action, and downstream data compromise.
    preventive_objective: Protect, rotate, and strongly verify authentication and secret material.
    detective_objective: Detect anomalous authentication and credential-use patterns.
    corrective_objective: Revoke, rotate, and contain compromised credentials with preserved evidence.
    owner: Identity and Authorization Steward
    future_blocking_gate: V7-G1
    evidence: PENDING (authentication and secrets control implementation and validation)
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-03
    traces_to:
      - ASSET-V6-003
      - BOUNDARY-V6-001
  - id: THREAT-V6-003
    kind: THREAT
    title: Evidence or audit tampering
    purpose: An actor alters or destroys evidence artifacts or audit records to conceal or fabricate governed truth.
    trust_boundary: BOUNDARY-V6-002
    affected_asset: ASSET-V6-004
    threat_actor: Insider or compromised process
    precondition: Evidence and audit stores are mutable or lack integrity verification.
    misuse_path: Evidence or audit records are altered or deleted after the fact.
    potential_consequence: Loss of evidentiary integrity and accountability.
    preventive_objective: Enforce append-only, integrity-protected evidence and audit storage.
    detective_objective: Detect integrity violations against evidence and audit records.
    corrective_objective: Restore, investigate, and preserve evidence of tampering.
    owner: Data Governance Steward
    future_blocking_gate: V9-G1
    evidence: PENDING (integrity control implementation and validation)
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-03
    traces_to:
      - ASSET-V6-004
      - ASSET-V6-005
      - BOUNDARY-V6-002
  - id: THREAT-V6-004
    kind: THREAT
    title: Privileged-access misuse
    purpose: A privileged staff actor uses elevated capability to bypass governed controls or make unauthorized changes.
    trust_boundary: BOUNDARY-V6-004
    affected_asset: ASSET-V6-007
    threat_actor: Privileged insider
    precondition: Privileged capability lacks least-privilege scoping, approval, and audit.
    misuse_path: Elevated capability is used outside an approved, audited purpose.
    potential_consequence: Uncontrolled mutation of governed data and control bypass.
    preventive_objective: Constrain privileged capability to least privilege with approval and just-in-time scope.
    detective_objective: Audit and alert on all privileged actions.
    corrective_objective: Revoke, review, and remediate privileged misuse with preserved evidence.
    owner: Security and Trust Steward
    future_blocking_gate: V7-G1
    evidence: PENDING (privileged access control implementation and validation)
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-03
    traces_to:
      - ASSET-V6-007
      - BOUNDARY-V6-004
  - id: THREAT-V6-005
    kind: THREAT
    title: Provider data exposure
    purpose: An external provider exposes or mishandles governed personal data outside contractual and privacy obligations.
    trust_boundary: BOUNDARY-V6-003
    affected_asset: ASSET-V6-002
    threat_actor: External processor or its subprocessor
    precondition: Provider assurance, data-transfer, and contractual controls are unverified.
    misuse_path: Governed personal data is disclosed, retained, or reused by a provider outside obligation.
    potential_consequence: Privacy harm and breach of data-processing obligations.
    preventive_objective: Require verified provider assurance and contractual data-protection obligations before reliance.
    detective_objective: Monitor provider processing and obtain incident notification.
    corrective_objective: Contain, notify, and remediate provider exposure with preserved evidence.
    owner: Privacy Steward
    future_blocking_gate: V9-G1
