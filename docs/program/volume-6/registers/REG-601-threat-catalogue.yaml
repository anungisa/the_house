  - id: THREAT-V6-013
    kind: THREAT
    title: Informal workaround outside the governed model
    purpose: A user or operator completes a governed workflow through an informal workaround that bypasses governed outcome, evidence, or authority.
    trust_boundary: BOUNDARY-V6-004
    affected_asset: ASSET-V6-013
    threat_actor: Operator or user relying on an ungoverned workaround
    precondition: No governed exception path exists, so informal workarounds are used instead.
    misuse_path: A workflow is completed outside the governed model without equivalent outcome, evidence, or authority.
    potential_consequence: Loss of governed outcome, evidence, and authority through ungoverned exception handling.
    preventive_objective: Require governed exception paths carrying the same outcome, evidence, and authority as the default path.
    detective_objective: Detect completion outside the governed model and absent exception-path evidence.
    corrective_objective: Bring exception handling into the governed model and preserve evidence.
