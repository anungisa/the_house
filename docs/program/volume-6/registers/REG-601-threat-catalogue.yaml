      - BOUNDARY-V6-007
  - id: THREAT-V6-008
    kind: THREAT
    title: Configuration tampering and leakage
    purpose: Configuration or policy-definition data is altered or leaked, bypassing controls or exposing secrets and restricted content.
    trust_boundary: BOUNDARY-V6-002
    affected_asset: ASSET-V6-010
    threat_actor: Insider or compromised process
    precondition: Configuration integrity and environment separation are unverified.
    misuse_path: Configuration is altered to weaken controls, or secrets and restricted content are copied into configuration or logs.
