  # ==== Package 2 threats (V6-12, V6-15, V6-19) ====
  - id: THREAT-V6-006
    kind: THREAT
    title: Service identity abuse
    purpose: A service or workload identity is over-scoped or compromised and used to act beyond its intended, explicitly granted permissions.
    trust_boundary: BOUNDARY-V6-006
    affected_asset: ASSET-V6-009
    threat_actor: Compromised or over-scoped service identity
    precondition: Internal services receive implicit trust or unbounded scope.
    misuse_path: A service identity performs actions outside its explicit, scoped permissions.
    potential_consequence: Lateral movement and authorization bypass through service-to-service trust.
    preventive_objective: Grant service identities only explicit, scoped permissions with no implicit trust.
    detective_objective: Log and review service-to-service actions outside expected scope.
    corrective_objective: Revoke, re-scope, and contain abused service identities with preserved evidence.
    owner: Security and Trust Steward
    future_blocking_gate: V9-G1
    evidence: PENDING (service-trust control implementation and validation)
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-19
    traces_to:
      - ASSET-V6-009
      - BOUNDARY-V6-006
  - id: THREAT-V6-007
    kind: THREAT
    title: Identity-provider federation compromise
    purpose: An external identity-provider relationship is compromised or misconfigured and used to assert false authenticated identities.
    trust_boundary: BOUNDARY-V6-007
    affected_asset: ASSET-V6-003
    threat_actor: Compromised identity provider or federation attacker
    precondition: Federation trust and authentication assurance are unverified or fail open.
    misuse_path: A false or elevated identity assertion is accepted from the federation boundary.
    potential_consequence: Impersonation and unauthorized authenticated access.
    preventive_objective: Require verified federation trust and fail-closed authentication assurance.
    detective_objective: Detect anomalous federation assertions and provider-outage conditions.
    corrective_objective: Suspend, re-establish, and contain compromised federation with preserved evidence.
    owner: Identity and Authorization Steward
    future_blocking_gate: V9-G1
    evidence: PENDING (federation and authentication-assurance implementation and validation)
