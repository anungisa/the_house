register_id: REG-603
name: Volume 6 Decision Register
status: RATIFIED
version: 1.0.0
records:
  - id: ADR-V6-001
    title: Volume 6 defines protection obligations only and authorizes no implementation
    decision: Volume 6 Package 1 defines security, privacy, compliance, accessibility, and trust obligations as governed doctrine; it authorizes no control implementation, executable policy, infrastructure, procurement, delivery sequencing, staffing, or cost.
    status: ACCEPTED
    context: The House must define what protection and trust obligations govern its data before controls can be designed, so obligations are separated from implementation.
    consequence: All protection controls are recorded as future-gated objectives with pending evidence; construction is authorized only downstream through the governed gate sequence.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-00
    traces_to:
      - V5-00
  - id: ADR-V6-002
    title: Authorization is resource-aware and fails closed
    decision: Authorization control objectives must evaluate resource, organization, jurisdiction, assignment, action, lifecycle state, and sensitivity, not actor role alone, and must fail closed.
    status: ACCEPTED
    context: Role-only authorization cannot enforce tenant isolation or least privilege for governed data.
    consequence: The authorization control objective records a full set of resource-aware inputs as a future obligation.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-04
    traces_to:
      - CTRL-V6-002
      - THREAT-V6-001
  - id: ADR-V6-003
    title: No retention period or destruction schedule is set in Volume 6
    decision: Volume 6 records records-and-retention as a pending obligation dependent on a validated records authority; it sets no retention period or destruction schedule.
    status: ACCEPTED
    context: Retention periods require records and legal authority not established in this package.
    consequence: The records-and-retention obligation is future-gated pending records authority.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-06
    traces_to:
      - COMP-V6-002
  - id: ADR-V6-004
    title: No compliance, security, privacy, or accessibility conformance is claimed
    decision: Volume 6 claims no legal, security, privacy, or accessibility conformance, operational proof, or independent assurance; all such states are recorded as pending validation.
    status: ACCEPTED
    context: Conformance claims require evidence and independent assurance that do not exist at this stage.
    consequence: Every assurance requirement is recorded with a pending validation status and a future assurance gate.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-09
    traces_to:
      - ASSR-V6-001

  # ==== Package 2 decisions ====
  - id: ADR-V6-005
    title: Identity is separated from authority
    decision: A person, an authenticated account, organization membership, representative authority, reviewer assignment, and a service identity are distinct; an account is not authority and authority is not assignment.
    status: ACCEPTED
    context: Collapsing these identity classes would grant access on the basis of identity alone rather than governed authority.
    consequence: Identity, authentication, authorization, and assignment control objectives are recorded separately.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-12
    traces_to:
      - CTRL-V6-012
  - id: ADR-V6-006
    title: Authentication is separated from authorization
    decision: Authentication verifies who an account holder is; it does not by itself grant access to any governed resource.
    status: ACCEPTED
    context: Treating authentication as authorization would bypass resource-aware, fail-closed access control.
    consequence: Authentication-assurance and policy-decision control objectives are recorded separately.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-13
    traces_to:
      - CTRL-V6-013
      - CTRL-V6-016
  - id: ADR-V6-007
    title: The target resource is loaded before the authorization decision
    decision: Organization, jurisdiction, and sensitivity must be resolved from the loaded resource rather than assumed, and missing context fails closed.
    status: ACCEPTED
    context: Deciding before loading the resource allows cross-tenant and cross-jurisdiction exposure.
    consequence: The resource-isolation control objective requires resource loading before decision.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-13
    traces_to:
      - CTRL-V6-017
  - id: ADR-V6-008
    title: Reviewer access is enforced to assignment scope
    decision: Reviewer eligibility and assignment must be enforced so access does not exceed assignment scope, and missing assignment fails closed when assignment is required.
    status: ACCEPTED
    context: Reviewer over-access beyond assignment is an identified abuse case.
    consequence: The assignment-enforcement control objective is recorded with reviewer-eligibility inputs.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-13
    traces_to:
      - CTRL-V6-018
      - ABUSE-V6-001
  - id: ADR-V6-009
    title: Delegated authority is always time-bound
    decision: Delegated authority must carry an effective period, expiry, revocation, and post-use review; delegated authority is not permanent authority.
    status: ACCEPTED
    context: Permanent delegation accumulates standing privilege and defeats least privilege.
    consequence: The delegation control objective requires expiry and review.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-14
    traces_to:
      - CTRL-V6-020
  - id: ADR-V6-010
    title: Privileged and emergency access require post-use review
    decision: Privileged and emergency access must be approved, time-bound, monitored, and reviewed after use.
    status: ACCEPTED
    context: Unreviewed privileged and emergency access enables undetected control bypass.
    consequence: The privileged-access control objective and privileged-operation obligation require post-use review.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-14
    traces_to:
      - CTRL-V6-021
      - OBL-V6-004
  - id: ADR-V6-011
    title: Emergency access is not permanent authority
    decision: Emergency (break-glass) access is temporary, is reviewed after use, and never becomes standing authority.
    status: ACCEPTED
    context: Emergency access that persists becomes an unaudited standing privilege.
    consequence: Segregation and privileged-access control objectives separate emergency use from permanent authority.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-14
    traces_to:
      - CTRL-V6-022
  - id: ADR-V6-012
    title: Restricted evidence receives heightened protection
    decision: Restricted evidence and its metadata receive access heightened above ordinary authorization, requiring need-to-know, purpose-bound, time-limited, decision-linked, and fully logged access.
    status: ACCEPTED
    context: Restricted evidence is not ordinary data and carries elevated disclosure harm.
    consequence: The restricted-evidence control objective and obligation impose heightened access and recording.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-16
    traces_to:
      - CTRL-V6-027
      - OBL-V6-003
  - id: ADR-V6-013
    title: Cryptographic requirements are defined without premature technology selection
    decision: A cryptographic requirement is defined; algorithm, provider, parameter, key, certificate, and rotation-period selection are pending and are not made in Volume 6.
    status: ACCEPTED
    context: Selecting cryptographic technology before design and assurance would be premature and unproven.
    consequence: The cryptographic control objective records the requirement with selection pending.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-15
    traces_to:
      - CTRL-V6-024
  - id: ADR-V6-014
    title: Processing is bound to purpose and minimized
    decision: Every processing of personal information must be bound to an authorized purpose and limited to what the purpose requires; unbound processing fails closed.
    status: ACCEPTED
    context: Purpose-unbound or excess processing creates privacy harm and re-identification risk.
    consequence: Privacy-purpose and minimization control objectives are recorded with fail-closed posture.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-17
    traces_to:
      - CTRL-V6-029
      - CTRL-V6-030
  - id: ADR-V6-015
    title: Security logging must remain privacy-safe
    decision: Security logging must not copy personal or restricted content beyond the bound purpose, and log integrity must be protected.
    status: ACCEPTED
    context: Logging that leaks personal or restricted content converts an accountability control into a privacy risk.
    consequence: The privacy-safe logging control objective binds logging to the privacy purpose model.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-18
    traces_to:
      - CTRL-V6-032
  - id: ADR-V6-016
    title: Service identities receive only explicit scoped permissions
    decision: Service and non-human identities receive no implicit trust; every service-to-service call is explicitly authorized and cannot bypass authorization through direct data access.
    status: ACCEPTED
    context: Implicit service trust enables lateral movement and authorization bypass.
    consequence: Service-identity and service-trust control objectives require explicit scoping.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-13
    traces_to:
      - CTRL-V6-015
      - CTRL-V6-019
  - id: ADR-V6-017
    title: Provider authority is separated from governed decision authority
    decision: An external provider processes data under contract but holds no governed decision authority.
    status: ACCEPTED
    context: Allowing a provider to make governed decisions would move authority outside The House.
    consequence: Service-trust and provider-assurance control objectives separate provider authority from decision authority.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-19
    traces_to:
      - CTRL-V6-034
  - id: ADR-V6-018
    title: Provider assurance is not system assurance
    decision: A provider attestation, certification, or contractual commitment is evidence about the provider, not evidence that The House control model is implemented, tested, or independently assured.
    status: ACCEPTED
    context: Conflating provider assurance with system assurance would overstate The House's proven posture.
    consequence: The provider-assurance control objective records provider evidence as distinct from system assurance.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-19
    traces_to:
      - CTRL-V6-035
  - id: ADR-V6-019
    title: Control evidence precedes any implementation claim
    decision: A written control objective is evidence only that the control is defined; no implemented, compliant, conformant, operationally proven, or independently assured state may be claimed on the strength of a control objective.
    status: ACCEPTED
    context: The evidence-class model keeps definition, implementation, operation, and independent assurance distinct.
    consequence: Every Package 2 control objective carries an implementation-evidence class and remains not implemented or proven.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-11
    traces_to:
      - CTRL-V6-016

  # ==== Package 3 decisions (V6-21 through V6-29) ====
  - id: ADR-V6-020
    title: Applicability requires evidence
    decision: A compliance obligation is neither in force nor discharged by its presence in the register; applicability, satisfaction, and exception each require validated evidence owned by the accountable authority.
    status: ACCEPTED
    context: Recording an obligation must never be mistaken for a legal conclusion, compliance, or exemption.
    consequence: Every compliance obligation carries an applicability status and remains pending until validated by the accountable authority.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-21
    traces_to:
      - CTRL-V6-036
  - id: ADR-V6-021
    title: Policy is not control operation
    decision: A control objective is a statement of required control intent and is not an executable policy, configuration, permission, rule, or running control.
    status: ACCEPTED
    context: Conflating a control objective with an operating control would overstate the proven posture.
    consequence: The mapping from obligation to control objective to executable policy to operational proof is preserved at every layer.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-22
    traces_to:
      - CTRL-V6-036
  - id: ADR-V6-022
    title: Retention requires a records authority
    decision: Retention, archival, and disposition of governed records are permitted only under schedules owned by a validated records authority; no retention period is set in Volume 6.
    status: ACCEPTED
    context: Setting a retention period without a validated records authority would exceed this volume's scope.
    consequence: Records controls record a pending records authority and set no retention period, archival timing, or disposition schedule.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-23
    traces_to:
      - CTRL-V6-037
  - id: ADR-V6-023
    title: Legal hold supersedes disposition
    decision: A legal hold placed by the accountable authority supersedes any disposition schedule for records within its scope while the hold is in force.
    status: ACCEPTED
    context: Disposition during a legal hold would destroy records that must be preserved.
    consequence: The legal-hold control records precedence over disposition; this volume places and releases no hold.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-23
    traces_to:
      - CTRL-V6-039
  - id: ADR-V6-024
    title: Financial and affiliation authority are separated
    decision: The authority to make or confirm a financial determination is separated from the authority to make an affiliation lifecycle decision, and no single actor may originate and approve the same outcome.
    status: ACCEPTED
    context: Self-approval of financially relevant affiliation outcomes would defeat financial control.
    consequence: Financial-control and segregation-of-duties objectives record permitted and prohibited actors and a required independent approval.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-24
    traces_to:
      - CTRL-V6-041
  - id: ADR-V6-025
    title: Accessibility is defined by user need and task flow
    decision: Accessibility is determined by whether a user with a given need can complete a governed task, not by the presence of individual interface features.
    status: ACCEPTED
    context: Treating feature presence as conformance would overstate accessibility.
    consequence: Accessibility obligations attach to user needs and workflows and require independent verification evidence.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-25
    traces_to:
      - A11Y-V6-003
  - id: ADR-V6-026
    title: Exception paths are part of the service
    decision: An exception path is a governed part of the service carrying the same outcome, evidence, and authority as the default path; informal workarounds outside the governed model are prohibited.
    status: ACCEPTED
    context: Informal workarounds bypass governed outcome, evidence, and authority.
    consequence: Inclusive-service controls require governed exception paths rather than ungoverned workarounds.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-28
    traces_to:
      - CTRL-V6-042
  - id: ADR-V6-027
    title: Bilingual equivalence is semantic, not literal
    decision: Bilingual equivalence requires that the governed meaning conveyed in each official language be the same, not that the text be a literal word-for-word translation.
    status: ACCEPTED
    context: A literal rendering that changes governed meaning is not equivalent.
    consequence: Bilingual obligations record semantic equivalence and require independent equivalence verification.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-27
    traces_to:
      - BIL-V6-003
  - id: ADR-V6-028
    title: Governed meaning uses language-neutral identifiers
    decision: Governed identity, state, and decision concepts must be represented by language-neutral identifiers so that no official language is privileged as the system of record for meaning.
    status: ACCEPTED
    context: Privileging one language as the system of record for meaning would undermine equivalence.
    consequence: Controlled terminology anchors official-language expressions to a canonical, language-neutral concept identifier.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-27
    traces_to:
      - BIL-V6-003
  - id: ADR-V6-029
    title: Accommodation preserves equivalent outcomes
    decision: An accommodation for a user facing a barrier changes the path, not the governed outcome, and never lowers the outcome or bypasses a governed control.
    status: ACCEPTED
    context: An accommodation that lowers the governed outcome would be inequitable and ungoverned.
    consequence: Accommodation controls record an equivalent-outcome requirement and protect accommodation privacy.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-28
    traces_to:
      - CTRL-V6-042
  - id: ADR-V6-030
    title: Remediation requires retest
    decision: A defect is resolved only when a retest performed to the same verification standard passes and its evidence is recorded; no defect is closed on assertion.
    status: ACCEPTED
    context: Accepting remediation without retest would leave defects unproven.
    consequence: The verification-and-remediation control records a retest requirement for every defect.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-29
    traces_to:
      - CTRL-V6-044
  - id: ADR-V6-031
    title: Conformance claims require evidence
    decision: A compliance, accessibility, or bilingual conformance claim requires validated verification evidence produced by a qualified reviewer and is never made on design intent or on the presence of a control.
    status: ACCEPTED
    context: Claiming conformance without evidence would misrepresent the proven posture.
    consequence: Controls remain pending until verification evidence exists, and no conformance is claimed in Volume 6.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-29
    traces_to:
      - CTRL-V6-044

  # ==== Package 4 decisions (V6-31..V6-39) ====
  - id: ADR-V6-032
    title: Events, alerts, and incidents are distinct
    decision: A security event is not an alert, an alert is not a confirmed incident, and an incident is not a breach; each is a distinct governed concept with its own obligations.
    status: ACCEPTED
    context: Conflating observation with confirmed condition or response would distort detection and incident governance.
    consequence: Detection, incident, and breach models are separated in V6-32, V6-33, and V6-34.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-32
    traces_to:
      - CTRL-V6-046
  - id: ADR-V6-033
    title: Incident authority is distinct from business authority
    decision: Authority to direct the technical response to an incident is distinct from authority to accept the business consequences of that incident.
    status: ACCEPTED
    context: Merging technical and business authority would let a responder accept business risk without accountability.
    consequence: Incident command and business-acceptance authority are separated across V6-33 and V6-37.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-33
    traces_to:
      - CTRL-V6-048
  - id: ADR-V6-034
    title: Breach applicability requires validation
    decision: Whether an incident constitutes a breach requiring notification is a governed determination pending legal and factual validation, never assumed by incident label.
    status: ACCEPTED
    context: Treating any incident as a breach, or none, without validation would misstate notification duties.
    consequence: Notification obligations begin pending legal and contractual validation and interpret no law in Volume 6.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-34
    traces_to:
      - CTRL-V6-050
  - id: ADR-V6-035
    title: Incident communications are minimum-necessary, accessible, and bilingual
    decision: A communication arising from an incident discloses only the minimum necessary, under a named authority, in an accessible and semantically equivalent form, and is recorded as evidence.
    status: ACCEPTED
    context: Over-disclosure or inaccessible communications would cause privacy or equity harm.
    consequence: Incident communications inherit Package 3 accessibility and bilingual obligations under V6-34.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-34
    traces_to:
      - CTRL-V6-051
  - id: ADR-V6-036
    title: Vulnerability closure requires validated retest
    decision: A vulnerability is closed only when a retest confirms resolution with evidence; closure on an attempted fix is prohibited.
    status: ACCEPTED
    context: Closing vulnerabilities without retest would leave weaknesses unproven.
    consequence: Vulnerability management records a retest requirement for every remediation.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-35
    traces_to:
      - CTRL-V6-052
  - id: ADR-V6-037
    title: Security exceptions expire
    decision: A security exception is granted only under a named authority with a compensating control and a mandatory expiry, and reverts to an open condition on expiry.
    status: ACCEPTED
    context: An exception without an owner, compensating control, or expiry would leave a weakness open indefinitely.
    consequence: The security-exception control records authority, compensating control, and expiry with revert-on-expiry.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-35
    traces_to:
      - CTRL-V6-054
  - id: ADR-V6-038
    title: Degraded operation fails closed on unresolved authorization
    decision: Where a degraded mode cannot resolve governed authorization, tenant, or consent context, the affected operation fails closed rather than proceeding on assumption.
    status: ACCEPTED
    context: Failing open during degradation would bypass authorization or isolation.
    consequence: Degraded-mode controls record a fail-closed posture on unresolved context.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-36
    traces_to:
      - CTRL-V6-055
  - id: ADR-V6-039
    title: Technical recovery is not business acceptance
    decision: Reconstructing technical state does not resume governed operation; resumption requires a business-acceptance decision by a named authority.
    status: ACCEPTED
    context: Resuming on technical recovery alone could operate on inconsistent or unaccepted state.
    consequence: Recovery controls record a business-acceptance authority and reconciliation requirement.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-37
    traces_to:
      - CTRL-V6-057
  - id: ADR-V6-040
    title: A backup is not a verified restore
    decision: The existence of a backup is not recovery; a backup provides no proven recovery capability until restore-tested with integrity verification.
    status: ACCEPTED
    context: Relying on an untested backup could result in permanent loss or corruption.
    consequence: Recovery controls record a restore dependency and integrity-verification requirement.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-37
    traces_to:
      - CTRL-V6-056
  - id: ADR-V6-041
    title: Provider certification is not service assurance
    decision: A provider certification or attestation is evidence about the provider, not proof that the governed service is assured; reliance requires independent assurance evidence.
    status: ACCEPTED
    context: Accepting certification as service assurance would overstate the proven posture.
    consequence: Provider controls record a contract-validation status and independent-assurance dependency.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-38
    traces_to:
      - CTRL-V6-058
  - id: ADR-V6-042
    title: Provider exit requires return, deletion, and reconciliation evidence
    decision: Reliance on a provider must be exitable, with governed data returned in usable form, residual copies deleted under evidence, and the exit reconciled.
    status: ACCEPTED
    context: A provider relationship without a defined exit and data return would strand or retain governed data.
    consequence: Provider controls record an exit trigger, data-return requirement, and deletion evidence including residual copies.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-38
    traces_to:
      - CTRL-V6-058
  - id: ADR-V6-043
    title: Metrics and exercises have interpretation limits
    decision: A control metric indicates operation but does not prove effectiveness, and defects found in an exercise are findings requiring remediation, not proof of readiness.
    status: ACCEPTED
    context: Treating a metric or exercise as proof of effectiveness would create false confidence.
    consequence: Assurance controls record an operational-proof limitation and defect-treatment rule.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-39
    traces_to:
      - CTRL-V6-059
  - id: ADR-V6-044
    title: Independent assurance is distinct from self-attestation
    decision: Self-attestation by the party operating a control is not independent assurance; reliance on effectiveness requires independent validation, time-bounded and renewed.
    status: ACCEPTED
    context: Accepting self-attestation as independent assurance would misrepresent validation.
    consequence: Assurance controls distinguish self-attested from independently validated evidence; Volume 6 claims no independent assurance.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-39
    traces_to:
      - CTRL-V6-060
  - id: ADR-V6-045
    title: The integrated trust baseline is consolidation only
    decision: The Package 5 integrated trust, protection, and assurance baseline consolidates only capabilities already defined and frozen in Packages 1 through 4; it introduces no new protection capability, control, or obligation and must not be authored to make the corpus appear more complete than the frozen packages establish.
    status: ACCEPTED
    context: A closure package can be tempted to add unsupported controls to appear complete; that would misrepresent the corpus.
    consequence: The final-closure tooling projects only existing catalogue records, and no synthetic control is added to REG-601 or REG-602.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-41
    traces_to:
      - V6-41
  - id: ADR-V6-046
    title: Institutional authority is distinct from technical custody
    decision: Institutional authority over governed records is distinct from technical custody of the systems that hold them; a custodian acquires no governed decision authority.
    status: ACCEPTED
    context: Conflating custody with authority would let operators make governed decisions.
    consequence: The cross-catalogue records custody status separately from authority owner for every asset.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-42
    traces_to:
      - V6-42
  - id: ADR-V6-047
    title: Support and monitoring access is not decision or content authority
    decision: A support or assistance role is not a decision authority, and monitoring and detection authority is not content authority; neither acquires governed decision or unrestricted-content authority.
    status: ACCEPTED
    context: Support and monitoring roles must not silently gain governed authority.
    consequence: The catalogue separates support and monitoring authority from decision and content authority.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-42
    traces_to:
      - V6-42
  - id: ADR-V6-048
    title: Finance authority and incident authority are bounded
    decision: Financial authority is distinct from affiliation authority, and incident authority is distinct from business-decision authority; neither crosses into the other.
    status: ACCEPTED
    context: Financial and incident authorities must not override affiliation or business decisions.
    consequence: The catalogue records these separations, and no actor exercises both sides of a separated authority.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-42
    traces_to:
      - V6-42
  - id: ADR-V6-049
    title: Authentication, role, and emergency access are bounded
    decision: Authentication is not authorization, a role is not resource authority, and emergency access is not permanent authority.
    status: ACCEPTED
    context: Confusing identity, role, or emergency access with governed authority would break fail-closed authorization.
    consequence: The identity synthesis preserves these distinctions and defines fail-closed denial on missing context.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-43
    traces_to:
      - V6-43
  - id: ADR-V6-050
    title: Missing governed context fails closed across the integrated model
    decision: Where any governed access-decision input is missing, unresolved, or unknown, the defined decision is to deny across the whole integrated model.
    status: ACCEPTED
    context: A permissive default on missing context would be an authorization defect.
    consequence: Every access-decision record defines a fail-closed posture and a future test class for its verification.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-43
    traces_to:
      - V6-43
  - id: ADR-V6-051
    title: Backup, restore, recovery, and business acceptance are distinct
    decision: A backup is not a proven restore, a restore is not service recovery, and technical recovery is not business-acceptance of recovery.
    status: ACCEPTED
    context: Treating a backup or technical recovery as proven service recovery would create false confidence.
    consequence: The resilience synthesis records integrity-verification, reconciliation, and business-acceptance authority separately.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-47
    traces_to:
      - V6-47
  - id: ADR-V6-052
    title: Provider certification is not end-to-end service assurance
    decision: A provider certification is not end-to-end service assurance, and an external provider acquires no Curling Canada or House authority.
    status: ACCEPTED
    context: Relying on a provider certification as service assurance would misrepresent validation.
    consequence: The provider synthesis separates certification from service assurance and requires data return, deletion evidence, and reconciliation on exit.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-47
    traces_to:
      - V6-47
  - id: ADR-V6-053
    title: Metric, exercise, and self-attestation are not proof or independent assurance
    decision: A metric is not proof of control effectiveness, an exercise is not operational proof, and self-attestation is not independent assurance.
    status: ACCEPTED
    context: Accepting metrics, exercises, or self-attestation as proof or independent assurance would overstate assurance.
    consequence: The assurance synthesis records operational-proof and independent-assurance dependencies separately from metrics and exercises.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-47
    traces_to:
      - V6-47
  - id: ADR-V6-054
    title: House P0 findings are protection definitions, not remediation
    decision: The House P0 protection findings are protection definitions with a required future control and future evidence class; coverage of a finding by the matrix is never implementation or remediation of the finding.
    status: ACCEPTED
    context: Representing the P0 matrix as remediation would misstate the implementation status.
    consequence: Every P0 finding is recorded with definition status DEFINED and implementation status not-implemented or not-proven.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-48
    traces_to:
      - V6-48
  - id: ADR-V6-055
    title: The readiness-disposition taxonomy governs unresolved items
    decision: Every unresolved assumption, risk, exception, and validation item is classified into exactly one readiness disposition and carries an owner, required evidence, and a future destination.
    status: ACCEPTED
    context: Unresolved items without owners, evidence, or destinations would be untraceable.
    consequence: The unresolved-readiness register projects owner, evidence, disposition, and future destination for every item.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-49
    traces_to:
      - V6-49
  - id: ADR-V6-056
    title: Downstream handoff and executive brief introduce no new authority
    decision: The downstream-volume handoff and executive trust brief transfer constraints only; they introduce no new authority, control, or obligation and authorize no procurement, provider selection, or material commitment.
    status: ACCEPTED
    context: A handoff or executive brief could be misread as authorizing new work.
    consequence: The handoff records constraints per volume and reserves material commitment to Volume 12 and the executive material-commitment gate.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-50
    traces_to:
      - V6-50
  - id: ADR-V6-057
    title: Gate V6-G5 disposition, whole-volume freeze, and release-tag doctrine
    decision: Gate V6-G5 is dispositioned security, privacy, compliance, accessibility, and trust definition complete; Package 5 and the whole of Volume 6 are frozen at version 1.0.0; Volume 7 is authorized for definition work only; and the Volume 6 release tag is published on the provenance-amendment merge commit after mainline merge.
    status: ACCEPTED
    context: Volume 6 closure requires a clear disposition, a whole-volume freeze, a bounded downstream authorization, and a deterministic release-tag doctrine.
    consequence: The closure record (V6-I) records the disposition and freezes; the release tag is published only after the provenance amendment merges.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-51
    traces_to:
      - V6-51
  - id: ADR-V6-058
    title: Canonical Volume 7 to Volume 12 downstream-routing map and additive supersession
    decision: Downstream routing of Volume 6 readiness, House P0 evidence, and handoff records must follow the canonical program map (Volume 7 experience and service design; Volume 8 APIs, events, integrations, and external contracts; Volume 9 quality and master test definition; Volume 10 delivery and release planning; Volume 11 operations, migration, adoption, and operational assurance; Volume 12 gate, release, and acceptance evidence); incorrect destinations are corrected additively by preserving the frozen original as superseded history and recording the corrected destination alongside, never by overwriting a frozen record.
    status: ACCEPTED
    context: Several released readiness and handoff records routed work to a volume whose canonical responsibility did not match; those routes cannot become inherited authority for later volumes without correction, and the whole-volume freeze forbids silent overwrite.
    consequence: A deterministic routing-integrity control validates effective routing against the canonical map, and seven REG-604 records carry additive corrected-destination fields while retaining their frozen originals.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-K
    traces_to:
      - V6-K
  - id: ADR-V6-059
    title: Inherited-volume release validation and continuous-integration governance coverage
    decision: The governed release path runs the inherited Volume 1 through Volume 5 governance checks together with the Volume 6 check and lint, and the continuous-integration governance workflow is extended to execute the currently supported Volume 0 through Volume 6 checks; this is a release-assurance discipline and governance tooling only and asserts no operational, conformance, or assurance outcome.
    status: ACCEPTED
    context: The recorded release pass evidenced Volume 6 validation and lint but not the inherited Volume 1 through Volume 5 validation, and the continuous-integration governance workflow exercised only the earliest volumes.
    consequence: The release-assurance control enumerates the Volume 0 through Volume 6 governed release-path checks, and the governance workflow runs them; runtime application code is not modified.
    validation_status: DEFINED
    authorizes_implementation: false
    implementation_status: NOT_IMPLEMENTED_OR_NOT_PROVEN
    chapter_ref: V6-K
    traces_to:
      - V6-K
