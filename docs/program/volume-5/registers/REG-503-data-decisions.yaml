register_id: REG-503
name: Volume 5 Data Decisions
status: RATIFIED
version: 1.4.0
records:
  - id: ADR-V5-001
    title: Data governance is defined before logical or physical design
    decision: Volume 5 Package 1 defines conceptual data governance and semantics before any logical or physical data design begins.
    status: ACCEPTED
    context: Volume 4 architecture is complete; data authority must precede design.
    consequence: Logical and physical design are deferred to later volumes and gates.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-00
    evidence_refs:
      - V4-I
      - V5-00
  - id: ADR-V5-002
    title: Single explicit authoritative owner per information domain
    decision: Each information domain has exactly one explicit authoritative business owner and one system-of-record authority.
    status: ACCEPTED
    context: Ambiguous ownership undermines governed truth.
    consequence: Domains without owners fail the authority-ownership control.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-02
    evidence_refs:
      - RULE-V5-002
  - id: ADR-V5-003
    title: Person, account, membership, and representative authority are distinct
    decision: Person, authenticated identity, organization membership, and representative authority are modelled as distinct conceptual facts.
    status: ACCEPTED
    context: Conflating identity concepts creates authorization and privacy risk.
    consequence: Downstream design must preserve these distinctions.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-03
    evidence_refs:
      - REL-V5-003
      - REL-V5-004
  - id: ADR-V5-004
    title: Projections are non-authoritative and rebuildable
    decision: All projections, reports, analytics, and exports are non-authoritative and rebuildable from authoritative sources.
    status: ACCEPTED
    context: Derived data must never become a competing source of truth.
    consequence: Derived products must name authoritative sources.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-09
    evidence_refs:
      - RULE-V5-005
  - id: ADR-V5-005
    title: Corrections preserve governed history via supersession
    decision: Corrections are applied through governed supersession that preserves prior history.
    status: ACCEPTED
    context: Governed decisions and audit require preserved history.
    consequence: Correction rules require named authority and preserved lineage.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-08
    evidence_refs:
      - RULE-V5-008
      - LINEAGE-V5-008
  - id: ADR-V5-006
    title: Retention and deletion depend on external records-policy authority
    decision: Retention schedules and deletion rules are deferred to an approved records-policy authority and are not set in Package 1.
    status: ACCEPTED
    context: This package must not set unsupported retention or deletion rules.
    consequence: Retention-policy status is recorded as pending across domains and classifications.
    authorizes_implementation: false
    validation_status: PENDING_VALIDATION
    chapter_ref: V5-07
    evidence_refs:
      - RULE-V5-011
  # ==== Package 2: validation-gate correctness ====
  - id: ADR-V5-007
    title: Validation obligations are reassigned away from the passed Gate V5-G1
    decision: Every Package 1 assumption, risk, exception, and validation-backlog obligation that named the already-passed Gate V5-G1 as its future blocking gate is additively reassigned to the correct future gate (a later Volume 5 gate, a downstream volume gate, or the executive material-commitment gate); the prior V5-G1 assignment is preserved on each record as superseded_future_blocking_gate.
    status: ACCEPTED
    context: Gate V5-G1 passed at Package 1 closure, so no unresolved obligation may retain V5-G1 as a future blocking gate. The frozen Package 1 chapters record the historical assignment; the operative registers must reflect the corrected gate.
    consequence: REG-504 obligations point only to future (uncompleted) gates; a validation-gate-correctness control fails closed if any obligation names a completed gate. Gate V5-G1 and the PACKAGE-5-1 freeze are preserved; no frozen chapter is rewritten.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-20
    evidence_refs:
      - APP-V5-013
      - V5-10
      - V5-20
  # ==== Package 2: logical-model decisions ====
  - id: ADR-V5-008
    title: The logical model uses governed identifiers only, never physical keys
    decision: Logical entities are identified by governed identity concepts; no physical key, column, index, or storage identifier is introduced.
    status: ACCEPTED
    context: Package 2 is logical definition only; physical identity is deferred to later volumes.
    consequence: Logical records name identity concepts, not physical keys.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-11
    evidence_refs:
      - VOBJ-V5-001
  - id: ADR-V5-009
    title: Every logical entity has exactly one owning domain
    decision: Each logical entity, value object, reference set, state, snapshot, provenance, and correction record names exactly one owning information domain.
    status: ACCEPTED
    context: Ownership must be unambiguous for governed authority.
    consequence: Logical entities without an owning domain fail closed.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-11
    evidence_refs:
      - CTRL-V5-008
  - id: ADR-V5-010
    title: State is modelled as governed state records, not mutable status fields
    decision: Lifecycle state is represented as governed state records changed only through governed transitions, never as a directly mutable status field.
    status: ACCEPTED
    context: Domain modules must not directly mutate governed status.
    consequence: State changes are recorded as history through the governance kernel.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-17
    evidence_refs:
      - STATE-V5-001
      - INTEG-V5-012
  - id: ADR-V5-011
    title: Submissions are captured as immutable snapshots
    decision: A submission is captured as an immutable snapshot; resubmission creates a new snapshot.
    status: ACCEPTED
    context: Submission truth must be preserved as known at submission time.
    consequence: Snapshots are never edited after capture.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-17
    evidence_refs:
      - SNAP-V5-001
      - INTEG-V5-006
  - id: ADR-V5-012
    title: Payment acknowledgement and accounting confirmation are distinct
    decision: Payment acknowledgement and accounting confirmation are distinct financial facts and reconciliation requires both.
    status: ACCEPTED
    context: External finance systems are systems of record; settlement must not be inferred from acknowledgement.
    consequence: Reconciliation is incomplete without both facts.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-16
    evidence_refs:
      - INTEG-V5-008
      - INTEG-V5-009
  - id: ADR-V5-013
    title: Approval and activation are distinct lifecycle facts
    decision: An approval decision and an activation are modelled as distinct governed facts; activation follows decision and reconciliation.
    status: ACCEPTED
    context: Conflating approval and activation grants status prematurely.
    consequence: Activation is a separate governed record.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-16
    evidence_refs:
      - INTEG-V5-010
      - LENT-V5-023
  - id: ADR-V5-014
    title: Derived data products are non-authoritative logical projections
    decision: Every derived data product is non-authoritative, rebuildable, names an authoritative source, and preserves lineage.
    status: ACCEPTED
    context: Derived data must never become a competing source of truth.
    consequence: Derived products name sources and carry staleness representation.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-19
    evidence_refs:
      - INTEG-V5-014
  - id: ADR-V5-015
    title: Value objects carry no independent identity
    decision: Value objects and reference/code sets carry governed values without independent entity identity.
    status: ACCEPTED
    context: Values identify or describe owning entities and must not be treated as entities.
    consequence: Value objects have no lifecycle of their own.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-11
    evidence_refs:
      - VOBJ-V5-001
      - VOBJ-V5-003
  - id: ADR-V5-016
    title: Cross-scope access fails closed in the logical model
    decision: Logical scope by jurisdiction and season is fail-closed; cross-scope access is denied absent explicit governed authority.
    status: ACCEPTED
    context: Improper scope could allow cross-jurisdiction leakage.
    consequence: Scope boundaries are explicit on logical entities and relationships.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-13
    evidence_refs:
      - RISK-V5-002
      - LENT-V5-009

  # ==== Package 3: data lifecycle, stewardship, reference-data, quality decisions ====
  - id: ADR-V5-017
    title: Data is classified as master, reference, transactional, evidentiary, or derived
    decision: Every governed data set is classified by data class (master, reference, transactional, lifecycle-history, evidentiary, audit, derived, analytical, external-authority, or transitional), and its class governs authority, custody, and lifecycle expectations.
    status: ACCEPTED
    context: Different data classes carry different authority and lifecycle obligations that must be explicit before design.
    consequence: Logical and physical design in later volumes must respect the class-based authority and lifecycle model.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-21
    evidence_refs:
      - MDS-V5-001
      - RDS-V5-001
  - id: ADR-V5-018
    title: Reference data and controlled vocabularies are versioned and bilingual
    decision: Reference data sets, code sets, and controlled terms are versioned, carry English and French labels where user-facing, and deprecate values with a documented replacement rather than deleting or reusing them.
    status: ACCEPTED
    context: Unversioned or monolingual reference data corrupts historical interpretation and bilingual obligations.
    consequence: Historical cases remain interpretable against the reference-data version that applied at their time.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-22
    evidence_refs:
      - CODE-V5-003
      - CTERM-V5-001
  - id: ADR-V5-019
    title: External reference data retains external authority
    decision: Reference data sourced from an external authority is held as an aligned governed copy; the House never becomes the independent authority for external facts such as jurisdiction identity.
    status: ACCEPTED
    context: Overwriting external authority would misrepresent governed truth.
    consequence: External reference data is reconciled and aligned, never re-authored.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-22
    evidence_refs:
      - RDS-V5-001
      - EXCH-V5-003
  - id: ADR-V5-020
    title: Stewardship is not decision authority
    decision: Data ownership, stewardship, technical custody, and governed decision rights are separate; a steward manages data quality but does not thereby hold governed decision authority.
    status: ACCEPTED
    context: Conflating stewardship with decision authority would create an unauthorized decision path.
    consequence: Decision rights remain with named governed authorities distinct from stewardship roles.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-23
    evidence_refs:
      - MDS-V5-001
      - DISS-V5-003
  - id: ADR-V5-021
    title: Data-quality rules have a governed lifecycle with authority-bound exceptions
    decision: Data-quality rules are defined, measured, and remediated through a governed lifecycle; exceptions are time-bounded and require a named exception authority and expiry.
    status: ACCEPTED
    context: Quality rules without a governed exception path either block operations or are silently bypassed.
    consequence: Quality exceptions are explicit, authorized, and expiring, never permanent silent waivers.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-24
    evidence_refs:
      - QUALITY-V5-004
      - DISS-V5-003
  - id: ADR-V5-022
    title: Retention is dependency-bound and legal hold supersedes disposition
    decision: Data lifecycle, records, retention, archival, and disposition are dependency-bound; no retention period or deletion schedule is approved in Package 3, and a legal hold supersedes any archival or disposition eligibility.
    status: ACCEPTED
    context: Retention periods and disposition require a records-policy authority not yet appointed; legal obligations must never be overridden by elapsed time.
    consequence: Disposition remains blocked until a records-policy authority sets governed schedules, and legal hold always prevails.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-25
    evidence_refs:
      - DLC-V5-001
      - RETD-V5-002
  - id: ADR-V5-023
    title: Identity resolution is evidence-based and similarity is not identity
    decision: Duplicate management, merge, split, and survivorship are evidence-based and steward-authorized; automated similarity is advisory only and never auto-merges records.
    status: ACCEPTED
    context: Automated matching on similarity risks incorrect merges that destroy governed identity and history.
    consequence: Merges and splits preserve history and require named authority and evidence.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-26
    evidence_refs:
      - DISS-V5-001
      - RCON-V5-003
  - id: ADR-V5-024
    title: Reconciliation preserves authority boundaries
    decision: Cross-system reconciliation compares records without inventing a new authority; each context names a conflict authority, and payment acknowledgement, accounting confirmation, and reconciliation remain distinct facts.
    status: ACCEPTED
    context: A reconciliation that overrides source authority would corrupt governed truth.
    consequence: Conflicts resolve to the named authoritative source, never to the reconciliation record itself.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-27
    evidence_refs:
      - RCON-V5-001
      - CTERM-V5-004
  - id: ADR-V5-025
    title: Data exchange preserves source authority and lineage
    decision: Import, export, and transformation preserve source authority and lineage; external-authority intake is normalized without inferring new authority, and derived exports are minimized and non-authoritative.
    status: ACCEPTED
    context: Exchange that loses lineage or re-authors external data breaks traceability and authority.
    consequence: Every exchange record names a source authority and a transformation or lineage.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-28
    evidence_refs:
      - EXCH-V5-001
      - EXCH-V5-004
  - id: ADR-V5-026
    title: Purpose, minimization, and disclosure govern data use
    decision: Data use is bound by permitted purpose, minimum-necessary data, and named disclosure authority; derived and analytical data hold no independent authority and analytics use is aggregate and minimized.
    status: ACCEPTED
    context: Unbounded use or disclosure violates minimization and privacy obligations.
    consequence: Each governed use names its purpose, audiences, and disclosure authority.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-29
    evidence_refs:
      - DUSE-V5-001
      - DUSE-V5-004
  - id: ADR-V5-027
    title: Stewardship measures are concepts requiring future operational proof
    decision: Stewardship measures are governed measurement concepts with accountable owners; no measure asserts an implemented metric, approved baseline, target, or operational assurance in Package 3.
    status: ACCEPTED
    context: Claiming operational measurement without evidence would fabricate assurance.
    consequence: Measures name a future operational-proof requirement and claim no current assurance.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-30
    evidence_refs:
      - SMEA-V5-001
      - SMEA-V5-004
  - id: ADR-V5-028
    title: Validation obligations are reassigned away from the passed Gate V5-G3
    decision: Every rule, assumption, and validation-backlog obligation that named the now-passed Gate V5-G3 as its future blocking gate is additively reassigned to the next Volume 5 gate V5-G4 (or the appropriate downstream gate); the prior V5-G3 assignment is preserved on each record as superseded_future_blocking_gate, alongside any earlier superseded gate.
    status: ACCEPTED
    context: Gate V5-G3 passes at Package 3 closure, so no unresolved obligation may retain V5-G3 as a future blocking gate; the frozen Package 2 chapters record the historical assignment while the operative registers reflect the corrected gate.
    consequence: The next Volume 5 gate carries the reassigned logical-model and governance validation obligations; the reassignment is additive and preserves history.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-31
    evidence_refs:
      - INTEG-V5-013
      - ASM-V5-001

  # ==== Package 4: physical data model decisions (V5-32 .. V5-42) ====
  - id: ADR-V5-029
    title: The Volume 5 physical model is a documentary PostgreSQL data model that authorizes no implementation
    decision: Package 4 defines a documentary physical data model expressed for PostgreSQL as the target platform, describing relations, attributes, keys, constraints, indexes, and partitioning requirements in prose; it contains no executable schema, migration, ORM mapping, pipeline, API, or event and authorizes no implementation.
    status: ACCEPTED
    context: The governed logical model requires a faithful physical expression, but the program governs design intent, not code; conflating the two would fabricate implementation authority.
    consequence: Downstream implementation volumes inherit a precise physical design contract without any executable artifact being sanctioned here.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-32
    evidence_refs:
      - PREL-V5-001
      - CTRL-V5-016
  - id: ADR-V5-030
    title: Physical relations are owned by information domains and trace to logical sources
    decision: Every physical relation is owned by exactly one information domain and traces to a resolvable governed logical source, so that no relation exists without domain ownership and logical provenance.
    status: ACCEPTED
    context: Untraceable or unowned physical structures break governed provenance and stewardship.
    consequence: The catalogue trace graph resolves every physical relation to a logical source and owning domain.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-32
    evidence_refs:
      - PREL-V5-006
      - INTEG-V5-019
  - id: ADR-V5-031
    title: Organization scope is enforced by explicit composite scope keys
    decision: Jurisdiction and organization scope is represented physically by explicit composite scope keys, and a child organization's scope is a subset of its parent's; scope is never implied.
    status: ACCEPTED
    context: Implicit or ambiguous scope enables cross-tenant leakage and corrupts tenancy.
    consequence: Scope integrity is verifiable from explicit references rather than inferred from context.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-33
    evidence_refs:
      - CSK-V5-001
      - INTEG-V5-021
  - id: ADR-V5-032
    title: Identity, account, membership, and authority are separate relations
    decision: Person, authenticated identity, organization membership, representative authority, and reviewer assignment are physically distinct relations bound by explicit references, never conflated into a single structure.
    status: ACCEPTED
    context: Structural conflation of identity and authority destroys authorization and privacy boundaries.
    consequence: Authorization and privacy boundaries are structurally enforced by relation separation.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-34
    evidence_refs:
      - PREL-V5-007
      - INTEG-V5-022
  - id: ADR-V5-033
    title: Evidence metadata is relational and evidence binary content is external
    decision: Evidence metadata is held in a governed relation that binds case, requirement version, submitting actor, and provenance, while evidence binary content is referenced externally and never stored inside an authoritative relational record.
    status: ACCEPTED
    context: Internalizing binary evidence or leaving metadata unbound breaks the custody and integrity boundary.
    consequence: Evidence custody is preserved as metadata-plus-reference rather than inline content.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-35
    evidence_refs:
      - PREL-V5-016
      - INTEG-V5-023
  - id: ADR-V5-034
    title: Submission snapshots are physically immutable
    decision: A submission snapshot is immutable after capture; resubmission creates a new snapshot rather than mutating an existing one.
    status: ACCEPTED
    context: Mutable submission records destroy the evidentiary truth of what was submitted and when.
    consequence: Submission history is append-only and each snapshot is a fixed record.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-35
    evidence_refs:
      - CHK-V5-001
      - INTEG-V5-024
  - id: ADR-V5-035
    title: Corrections are append-preserving and reference the corrected record
    decision: Corrections are recorded as new rows that reference the corrected record; prior values are preserved and never overwritten in place.
    status: ACCEPTED
    context: Destructive correction erases governed history and provenance.
    consequence: Correction lineage is fully recoverable from append-preserving references.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-37
    evidence_refs:
      - PREL-V5-026
      - FK-V5-008
  - id: ADR-V5-036
    title: Financial facts are separated by authority
    decision: Payment acknowledgement, accounting confirmation, reconciliation, decision, and activation are physically distinct facts recorded under separated authorities.
    status: ACCEPTED
    context: Conflating financial facts misstates settlement and risks granting status before authoritative confirmation.
    consequence: Financial settlement and status are provable from distinct, authority-separated facts.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-36
    evidence_refs:
      - PREL-V5-020
      - INTEG-V5-025
  - id: ADR-V5-037
    title: Authoritative activation is unique per case and season
    decision: Exactly one authoritative activation effect exists per affiliation case and season, enforced by a uniqueness constraint, with superseded activations preserved.
    status: ACCEPTED
    context: Multiple concurrent active activations corrupt affiliation status.
    consequence: Activation status is unambiguous and historically complete.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-36
    evidence_refs:
      - UNQ-V5-005
      - INTEG-V5-026
  - id: ADR-V5-038
    title: State, audit, and outbox share one transaction with a transactional outbox
    decision: A governed transition writes state, audit, and outbox rows in a single transaction, and external effects are published only after commit through a transactional outbox; a publish failure never erases the committed transition.
    status: ACCEPTED
    context: Split writes or pre-commit side effects break governed truth and message reliability.
    consequence: Governed truth and downstream messaging are atomic and reliable by construction.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-37
    evidence_refs:
      - OBX-V5-001
      - INTEG-V5-027
  - id: ADR-V5-039
    title: Code identifiers are language-neutral with bilingual labels held separately
    decision: Reference and code values use stable language-neutral identifiers, and bilingual human labels are held as separate governed attributes rather than as the code key itself.
    status: ACCEPTED
    context: Using human-language labels as keys breaks bilingual governance and stable referencing.
    consequence: Referencing is stable and language-neutral while bilingual labels remain governed and separable.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-38
    evidence_refs:
      - CODE-V5-001
      - RDS-V5-001
  - id: ADR-V5-040
    title: Projections are non-authoritative and rebuildable
    decision: Views, materialized projections, search, analytics, and export structures are non-authoritative, read-only, and always rebuildable from authoritative sources; governed writes never target them.
    status: ACCEPTED
    context: Treating a projection as authoritative or writable corrupts governed truth.
    consequence: Reporting and analytics remain derivable views that can be reconstructed at any time.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-39
    evidence_refs:
      - MPROJ-V5-001
      - CTRL-V5-013
  - id: ADR-V5-041
    title: Migration staging and quarantine preserve provenance and confer no authority
    decision: Migration staging and quarantine relations preserve source values and provenance, confer no governed authority, and never auto-merge uncertain matches; governed load is a separate authority-recorded step and similarity is advisory only.
    status: ACCEPTED
    context: Auto-merging or authority-bearing staging would silently corrupt governed truth during migration.
    consequence: Migration is provenance-preserving and every governed load is a deliberate, recorded decision.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-40
    evidence_refs:
      - STG-V5-001
      - CTRL-V5-014
  - id: ADR-V5-042
    title: No executable DDL, migration, or ORM mapping is inferred from the physical model
    decision: The physical model expresses integrity, indexing, and partitioning requirements as design obligations only; no executable data-definition, migration, or object-relational mapping is inferred or authorized from these records.
    status: ACCEPTED
    context: Inferring executable artifacts from documentary design would fabricate implementation authority and bypass gated authorization.
    consequence: Implementation remains a separately authorized activity in a downstream volume.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-42
    evidence_refs:
      - CTRL-V5-016
      - IDX-V5-001
  - id: ADR-V5-043
    title: Validation obligations are reassigned away from the passed Gate V5-G4
    decision: Every rule, assumption, and validation-backlog obligation that named the now-passing Gate V5-G4 as its future blocking gate is additively reassigned to the next Volume 5 gate V5-G5 (or the appropriate downstream gate); the prior V5-G4 assignment is preserved on each record as a superseded future blocking gate alongside any earlier superseded gate.
    status: ACCEPTED
    context: Gate V5-G4 passes at Package 4 closure, so no unresolved obligation may retain V5-G4 as a future blocking gate; frozen chapters record the historical assignment while operative registers reflect the corrected gate.
    consequence: The next Volume 5 gate carries the reassigned obligations; the reassignment is additive and preserves history.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-42
    evidence_refs:
      - INTEG-V5-013
      - ASM-V5-001
  # ==== Package 5: integrated governed-data baseline and Volume 5 closure ====
  - id: ADR-V5-044
    title: Final gate reassignment away from the passing Gate V5-G5
    decision: Every rule, assumption, and validation-backlog obligation that named the now-passing Gate V5-G5 as its future blocking gate is dispositioned as CLOSED_WITH_EVIDENCE or additively reassigned to its proper downstream gate; the prior V5-G5 assignment is preserved on each record as a superseded future blocking gate alongside any earlier superseded gate.
    status: ACCEPTED
    context: Volume 5 closes at Gate V5-G5, so no unresolved obligation may retain V5-G5 (or any earlier completed Volume 5 gate) as a future blocking gate; documentary Volume 5 cannot produce the real-data, security, contract, or verification evidence these obligations require.
    consequence: The eight logical-integrity obligations move to Volume 9 verification; jurisdiction, season, policy, and classification validations move to Volume 9; bilingual completeness moves to Volume 6; ownership sign-off moves to the executive material-commitment gate; the confirmed baseline assumption is closed with evidence. Superseded gate history is preserved on every record.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-51
    evidence_refs:
      - INTEG-V5-002
      - ASM-V5-001
      - TEST-V5-001
  - id: ADR-V5-045
    title: Gate V5-G4 ratified the documentary physical model but established no implementation effective date
    decision: The literal "Effective Date TBD (Gate V5-G4)" wording in the frozen Package 4 artifacts records only that Gate V5-G4 ratified the documentary physical model; it establishes no production or implementation effective date. Any genuine implementation-effective-date decision is reassigned to Volume 10, Volume 11, or the executive material-commitment gate.
    status: ACCEPTED
    context: Gate V5-G4 has passed; the effective-date wording in the frozen Package 4 chapters must not be read as a scheduled production date, and the frozen artifacts are not modified.
    consequence: A narrow clarification is recorded in Package 5 rather than editing frozen Package 4 artifacts; implementation effective dates remain a downstream material-commitment concern. This does not reopen Gate V5-G4.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-51
    evidence_refs:
      - ADR-V5-043
      - V5-42
  - id: ADR-V5-046
    title: The integrated governed-data baseline is the authoritative Volume 5 consolidation
    decision: The Volume 5 integrated governed-data baseline consolidates the conceptual, logical, and physical definitions of Packages 1 through 4 into a single authoritative, implementation-neutral reference; it adds no unsupported data decision merely to manufacture completeness.
    status: ACCEPTED
    context: Downstream volumes require one consolidated, traceable data definition rather than four separately framed package corpora.
    consequence: The baseline governs security, privacy, experience, contracts, testing, delivery, migration, and operations definition in later volumes without authorizing implementation.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-43
    evidence_refs:
      - DOMAIN-V5-001
      - LENT-V5-001
  - id: ADR-V5-047
    title: Stewardship, custody, and authority are distinct in the accountability matrix
    decision: The authoritative information catalogue records business authority, data ownership, stewardship, system-of-record authority, and technical custody as distinct responsibilities; stewardship does not imply business decision authority, custody does not imply ownership, finance authority does not imply affiliation authority, and privacy authority does not imply records-disposition authority.
    status: ACCEPTED
    context: Conflating these responsibilities is the principal accountability risk in a governed data baseline.
    consequence: Every information domain names each responsibility separately; external-system custody never silently transfers institutional authority.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-44
    evidence_refs:
      - DOMAIN-V5-006
      - DOMAIN-V5-021
  - id: ADR-V5-048
    title: The Button remains a governed consumer, not an independent source of affiliation truth
    decision: The Button and any other experience layer are governed consumers of the affiliation data baseline; they hold no independent system-of-record authority over affiliation, membership, evidence, decision, financial, or activation truth.
    status: ACCEPTED
    context: Experience layers may request governed actions but must not become competing sources of institutional truth.
    consequence: All authoritative affiliation truth remains in the governed House system-of-record; projections consumed by experience layers are non-authoritative.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-44
    evidence_refs:
      - DOMAIN-V5-006
  - id: ADR-V5-049
    title: Deterministic closure projections are non-authoritative
    decision: The deterministic Volume 5 closure projections generated under the closure directory are non-authoritative analyses of the source-controlled corpus; the corpus and its recorded approvals remain the source of truth.
    status: ACCEPTED
    context: Generated traceability and coverage projections support review but must never be treated as ratified artifacts or a basis for authorization.
    consequence: Regenerating the projections changes no governed decision; approvals remain the authoritative record.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-53
    evidence_refs:
      - ADR-V5-040
  - id: ADR-V5-050
    title: House P0 findings are data-defined but not implemented or proven
    decision: Every House P0 finding with a material data implication receives a data definition, logical record, physical structure, integrity control, and future test class; each carries data-definition status DEFINED and implementation status NOT_IMPLEMENTED_OR_NOT_PROVEN. Physical-model coverage is never represented as implemented remediation.
    status: ACCEPTED
    context: The documentary baseline defines what must exist to remediate P0 findings; it does not implement or prove any remediation.
    consequence: Implementation evidence for each finding is required in a downstream verification volume; no finding is closed by documentary coverage.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-50
    evidence_refs:
      - INTEG-V5-011
      - OBX-V5-001
  - id: ADR-V5-051
    title: Volume 5 closes at Gate V5-G5; downstream volumes inherit constraints without new authority
    decision: Gate V5-G5 closes Volume 5 as the authoritative governed-data baseline; the downstream-volume handoffs and the executive brief transfer data constraints to Volumes 6 through 11 and introduce no new authority, approval, or implementation authorization.
    status: ACCEPTED
    context: Closure must transfer obligations without silently expanding scope or authority.
    consequence: Volume 6 is authorized to define security, privacy, compliance, accessibility, and trust against the baseline; no implementation, procurement, or master development plan is authorized.
    authorizes_implementation: false
    validation_status: DEFINED
    chapter_ref: V5-52
    evidence_refs:
      - ASM-V5-002

