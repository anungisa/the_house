  - id: APP-V5-057
    artifact_id: GATE-V5-G4
    approver_role: Executive Acceptance Authority (Nolan)
    approval_state: ratified
    evidence_label: SELF-ATTESTED / AUTHOR-VERIFIED
    authorizes_implementation: false
    gate_disposition: PHYSICAL_DATA_MODEL_AND_PERSISTENCE_DESIGN_READY
    closure_record: V5-G
    conditions:
      - Package 1, Package 2, and Package 3 provenance and freezes are preserved.
      - Package 3 unresolved validations no longer name the completed Gate V5-G4.
      - The physical data model is documentary, targets PostgreSQL, and authorizes no implementation.
      - Every physical relation traces to a governed logical source and an owning information domain.
      - Organization, jurisdiction, season, and affiliation scope is represented by explicit references and composite scope keys, with a child organization's scope a subset of its parent's.
      - Affiliation applicability is unique per case and season.
      - Person, authenticated identity, membership, representative authority, and reviewer assignment are physically distinct relations and never conflated.
      - Evidence is held as metadata bound to case, requirement version, actor, and provenance, and evidence binary content is externalized, never held in an authoritative relation.
      - Submission snapshots are immutable after capture; resubmission creates a new snapshot.
      - Corrections are append-preserving and reference the corrected record.
      - Payment acknowledgement, accounting confirmation, reconciliation, decision, and activation are physically distinct facts under separated authorities.
      - Exactly one authoritative activation exists per affiliation case and season, with superseded activations preserved.
      - Governed transitions write state, audit, and outbox rows in one transaction; external effects publish only after commit through a transactional outbox; and command idempotency is enforced by a unique key.
      - Reference and code values use stable language-neutral identifiers with separable bilingual labels and are versioned and deprecated rather than deleted or silently reused.
      - Views, materialized projections, search, analytics, and export structures are non-authoritative, read-only, and rebuildable, and never accept governed writes.
      - Migration staging and quarantine relations preserve source provenance, confer no governed authority, and never auto-merge uncertain identity matches.
      - Integrity, indexing, and partitioning requirements are expressed as design obligations; no retention period, archival schedule, or deletion is approved; and legal hold supersedes disposition.
      - No executable schema, table, column, index, key, data-definition, object-relational mapping, migration, pipeline, interface, event, or file contract is created, and no inference of these is authorized.
      - Package 4 receives line-level review with a separate freeze commit.
    approved_at: null
