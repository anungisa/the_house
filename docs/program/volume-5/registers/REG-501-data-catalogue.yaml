  # ==== Conceptual entities (V5-03) ====
  - id: ENTITY-V5-001
    kind: CONCEPTUAL_ENTITY
    title: Organization
    purpose: A recognized organization that can be a party to affiliation.
    owning_domain: DOMAIN-V5-001
    meaning: An institutional party with governed identity, distinct from any affiliation it holds.
    natural_identity: Legal or recognized organization name and jurisdiction
    governed_identity: Governed organization identifier (assigned, non-physical)
    lifecycle: Recognized, active, suspended, closed
    authority: House
    cardinality: One organization to many affiliation cases across seasons
    temporal_posture: Continuity preserved across seasons
    correction_posture: Governed correction preserves prior identity history
    merge_split_posture: Merge or split is a governed operation, never silent
    audit_expectation: All identity changes audited
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-03
  - id: ENTITY-V5-002
    kind: CONCEPTUAL_ENTITY
    title: Club
    purpose: A club as a specific kind of recognized organization.
    owning_domain: DOMAIN-V5-001
    meaning: A member-facing organization within a jurisdiction.
    natural_identity: Club name within a PTSO jurisdiction
    governed_identity: Governed organization identifier
    lifecycle: Recognized, active, suspended, closed
    authority: House
    cardinality: Many clubs to one PTSO
    temporal_posture: Continuity preserved across seasons
    correction_posture: Governed correction preserves history
    merge_split_posture: Governed operation only
    audit_expectation: Recognition and continuity audited
    validation_status: DEFINED
    authorizes_implementation: false
