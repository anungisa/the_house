  # ==== Package 3: governance rules (V5-22 / V5-25 / V5-29) ====
  - id: RULE-V5-013
    kind: RULE
    title: External-authority data is never re-authored
    statement: Data sourced from an external authority is held as an aligned governed copy and is never given independent House authority.
    affected_domains:
      - DOMAIN-V5-002
      - DOMAIN-V5-009
    authority_owner: External
    stewardship_implication: Stewards align the House copy but never override external authority.
    control_implication: Exchange records must name an external source authority.
    downstream_constraint: No downstream volume may treat the House copy as the source of truth for external facts.
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-22
    traces_to:
      - ADR-V5-019
  - id: RULE-V5-014
    kind: RULE
    title: Derived data holds no independent authority
    statement: Derived and analytical data are non-authoritative projections that never become a competing source of truth.
    affected_domains:
      - DOMAIN-V5-025
    authority_owner: House
    stewardship_implication: Projection stewards maintain derived data as rebuildable, non-authoritative outputs.
    control_implication: Data-use records mark derived and analytical data as aggregate and non-authoritative.
    downstream_constraint: No downstream volume may promote derived data to authoritative status.
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-29
    traces_to:
      - ADR-V5-026
  - id: RULE-V5-015
    kind: RULE
    title: Legal hold supersedes disposition
    statement: A legal hold supersedes any archival or disposition eligibility regardless of elapsed time.
    affected_domains:
      - DOMAIN-V5-016
    authority_owner: House
    stewardship_implication: Stewards cannot dispose data under legal hold.
    control_implication: Retention-dependency controls block disposition while a hold is active.
    downstream_constraint: No downstream volume may implement disposition that overrides legal hold.
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-25
    traces_to:
      - ADR-V5-022

