register_id: REG-502
name: Volume 5 Data Rules and Controls
status: RATIFIED
version: 1.0.0
records:
  # ==== Data doctrine rules (V5-01) ====
  - id: RULE-V5-001
    kind: RULE
    title: Institutional authority precedes storage location
    statement: Authority over information is determined by institutional governance, not by where data is stored.
    affected_domains:
      - DOMAIN-V5-001
      - DOMAIN-V5-006
    authority_owner: House
    stewardship_implication: Stewards act under institutional authority, not custody.
    control_implication: Authority ownership control enforces named authorities.
    downstream_constraint: Volume 8 logical design must not infer authority from storage.
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-01
  - id: RULE-V5-002
    kind: RULE
    title: Authoritative ownership is singular and explicit
    statement: Each information domain has one explicit authoritative owner.
    affected_domains:
      - DOMAIN-V5-006
      - DOMAIN-V5-014
    authority_owner: House
    stewardship_implication: Stewardship never implies co-ownership.
    control_implication: Domains without owners are rejected.
    downstream_constraint: No downstream volume may create ambiguous ownership.
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-01
  - id: RULE-V5-003
    kind: RULE
    title: Stewardship does not automatically confer decision authority
    statement: A data steward manages data quality but does not by that role hold governed decision authority.
    affected_domains:
      - DOMAIN-V5-003
      - DOMAIN-V5-013
    authority_owner: House
    stewardship_implication: Stewardship and decision authority are separate facts.
    control_implication: Authority and stewardship are recorded distinctly.
    downstream_constraint: Downstream roles must separate stewardship from decisions.
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-01
  - id: RULE-V5-004
    kind: RULE
    title: Technical custody does not confer business ownership
    statement: Holding or hosting data does not grant business ownership of it.
    affected_domains:
      - DOMAIN-V5-011
      - DOMAIN-V5-016
    authority_owner: House
    stewardship_implication: Custodians act on behalf of business authority.
    control_implication: System-of-record authority recorded separately from custody.
    downstream_constraint: External custody must retain business authority with The House.
    validation_status: CONSTRAINED
    authorizes_implementation: false
    chapter_ref: V5-01
  - id: RULE-V5-005
    kind: RULE
    title: Projections remain non-authoritative
    statement: Read models, reports, and analytics are never sources of governed truth.
    affected_domains:
      - DOMAIN-V5-024
      - DOMAIN-V5-025
    authority_owner: House
    stewardship_implication: Projection stewards rebuild, never originate, truth.
    control_implication: Derived products must name authoritative sources.
    downstream_constraint: Downstream consumers must not treat projections as authoritative.
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-01
  - id: RULE-V5-006
    kind: RULE
    title: Externally sourced information retains provenance
    statement: Imported information retains its source and transformation provenance.
    affected_domains:
      - DOMAIN-V5-016
      - DOMAIN-V5-017
    authority_owner: House
    stewardship_implication: Stewards preserve provenance on import.
    control_implication: Lineage rules must name sources.
    downstream_constraint: Downstream imports must preserve lineage.
    validation_status: CONSTRAINED
    authorizes_implementation: false
    chapter_ref: V5-01
  - id: RULE-V5-007
    kind: RULE
    title: Uncertainty is represented rather than erased
    statement: Unknown or ambiguous data is represented explicitly, not silently resolved.
    affected_domains:
      - DOMAIN-V5-003
      - DOMAIN-V5-010
    authority_owner: House
    stewardship_implication: Stewards flag uncertainty for governed resolution.
    control_implication: Quality rules detect ambiguity.
    downstream_constraint: Downstream design must model uncertainty.
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-01
  - id: RULE-V5-008
    kind: RULE
    title: Corrections preserve governed history
    statement: Corrections never erase prior governed history.
    affected_domains:
      - DOMAIN-V5-022
      - DOMAIN-V5-014
    authority_owner: House
    stewardship_implication: Stewards apply corrections through governed supersession.
    control_implication: Correction rules require named authority.
    downstream_constraint: Downstream design must be append-preserving.
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-01
  - id: RULE-V5-009
    kind: RULE
    title: Data minimization applies at all boundaries
    statement: Minimization applies at collection, query, export, logging, and analytics boundaries.
    affected_domains:
      - DOMAIN-V5-003
      - DOMAIN-V5-025
    authority_owner: House
    stewardship_implication: Stewards enforce minimum necessary.
    control_implication: Classification records name minimum necessary fields.
    downstream_constraint: Downstream boundaries must minimize.
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-01
  - id: RULE-V5-010
    kind: RULE
    title: Bilingual and accessibility obligations apply to governed data
    statement: Bilingual equivalence and accessibility apply to governed data definitions and supporting content.
    affected_domains:
      - DOMAIN-V5-008
      - DOMAIN-V5-020
    authority_owner: House
    stewardship_implication: Stewards maintain bilingual governed terminology.
    control_implication: Terminology validation is tracked in the backlog.
    downstream_constraint: Downstream content must preserve bilingual equivalence.
    validation_status: PENDING_VALIDATION
    authorizes_implementation: false
    chapter_ref: V5-01
  - id: RULE-V5-011
    kind: RULE
    title: Retention and destruction depend on approved policy
    statement: Retention and destruction rules depend on approved records policy authority, not on this package.
    affected_domains:
      - DOMAIN-V5-010
      - DOMAIN-V5-023
    authority_owner: House
    stewardship_implication: Stewards apply retention only under approved policy.
    control_implication: Retention-policy status is recorded as pending.
    downstream_constraint: Downstream retention requires records-policy authority.
    validation_status: PENDING_VALIDATION
    authorizes_implementation: false
    chapter_ref: V5-01
  - id: RULE-V5-012
    kind: RULE
    title: Evidence of implementation precedes operational claims
    statement: Controls are not described as operational until implementation evidence exists.
    affected_domains:
      - DOMAIN-V5-023
      - DOMAIN-V5-024
    authority_owner: House
    stewardship_implication: Stewards do not claim unproven controls.
    control_implication: All Volume 5 records assert authorizes_implementation false.
    downstream_constraint: Downstream claims require evidence.
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-01
