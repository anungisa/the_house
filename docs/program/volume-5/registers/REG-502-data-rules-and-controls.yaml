      - ADR-V5-025
  - id: LINEAGE-V5-010
    kind: LINEAGE
    title: Reconciliation lineage preserved
    statement: A reconciliation preserves lineage to both compared records and to the conflict authority that resolves it.
    authoritative_fact: Named conflict authority resolution
    source: House record and external record
    transformation_lineage: Compared records to reconciliation outcome
    retention_dependency: Lineage retained per records-policy authority (PENDING)
    audit_expectation: Reconciliation resolution is auditable to its authority
    future_blocking_gate: V9-G1
