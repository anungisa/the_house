  # ==== Package 3: lineage rules (V5-27 / V5-28) ====
  - id: LINEAGE-V5-009
    kind: LINEAGE
    title: Exchange intake lineage preserved
    statement: Imported data preserves lineage from its external source reference to its governed representation.
    authoritative_fact: External source acknowledgement or confirmation identity
    source: External source authority
    transformation_lineage: External source reference to governed metadata
    retention_dependency: Lineage retained per records-policy authority (PENDING)
    audit_expectation: Intake lineage is auditable end to end
