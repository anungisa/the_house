  # ==== Package 3: controls (V5-25 / V5-29 / V5-30) ====
  - id: CTRL-V5-009
    kind: CTRL
    title: Purpose and minimization control
    statement: Governed data use is checked against a permitted purpose and minimum-necessary data before use.
    affected_domains:
      - DOMAIN-V5-025
    authority_owner: House
    control_implication: Data-use records without a permitted purpose are rejected.
    downstream_constraint: No downstream volume may use governed data beyond its permitted purpose.
    future_blocking_gate: V6-G1
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-29
    traces_to:
      - ADR-V5-026
  - id: CTRL-V5-010
    kind: CTRL
    title: Disclosure authority control
    statement: Disclosure of governed data requires a named disclosure authority appropriate to the audience.
    affected_domains:
      - DOMAIN-V5-025
    authority_owner: House
    control_implication: Disclosure without a named authority is denied.
    downstream_constraint: External disclosure remains subject to privacy validation.
    future_blocking_gate: V6-G1
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-29
    traces_to:
      - ADR-V5-026
  - id: CTRL-V5-011
    kind: CTRL
    title: Retention dependency control
    statement: No archival or disposition proceeds without a records-policy authority and while a legal hold is active.
    affected_domains:
      - DOMAIN-V5-016
    authority_owner: House
    control_implication: Disposition is blocked until governed retention is set and holds are cleared.
    downstream_constraint: No downstream volume may implement deletion absent governed retention.
    future_blocking_gate: V6-G1
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-25
    traces_to:
      - ADR-V5-022
  - id: CTRL-V5-012
    kind: CTRL
    title: Stewardship-measure proof control
    statement: A stewardship measure asserts no operational assurance until future operational evidence is provided.
    affected_domains:
      - DOMAIN-V5-025
    authority_owner: House
    control_implication: Measures name a future operational-proof requirement and claim no current assurance.
    downstream_constraint: No downstream volume may treat a measure concept as implemented assurance.
    future_blocking_gate: V10-G1
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-30
    traces_to:
      - ADR-V5-027

  # ==== Package 3: integrity rules (V5-21 .. V5-28) ====
  - id: INTEG-V5-015
    kind: INTEGRITY
    title: Master-data singular authority
    statement: Every master data set names exactly one authority owner and one steward.
    affected_entities:
      - MDS-V5-001
      - MDS-V5-003
    logical_condition: One authority owner per master data set; stewardship is distinct from authority.
    failure_meaning: Ambiguous master-data authority corrupts governed truth.
    correction_authority: Membership and Affiliation Steward
    future_verification_class: Logical model validation
    future_blocking_gate: V8-G1
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-21
    traces_to:
      - ADR-V5-017
  - id: INTEG-V5-016
    kind: INTEGRITY
    title: Reference-data versioning integrity
    statement: Reference and code values are versioned and deprecated with a documented replacement, never deleted or silently reused.
    affected_entities:
      - RDS-V5-002
      - CODE-V5-003
    logical_condition: Every reference value change is versioned; historical use remains interpretable.
    failure_meaning: Silent reference-data changes corrupt historical interpretation.
    correction_authority: Governance Policy Steward
    future_verification_class: Logical model validation
    future_blocking_gate: V8-G1
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-22
    traces_to:
      - ADR-V5-018
  - id: INTEG-V5-017
    kind: INTEGRITY
    title: Reconciliation authority preservation
    statement: A reconciliation preserves each source's authority and resolves conflicts only to the named conflict authority.
    affected_entities:
      - RCON-V5-001
      - LENT-V5-022
    logical_condition: Reconciliation never invents a new authority.
    failure_meaning: A reconciliation that overrides source authority corrupts governed truth.
    correction_authority: Finance Data Steward
    future_verification_class: Financial reconciliation validation
    future_blocking_gate: V8-G1
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-27
    traces_to:
      - ADR-V5-024
  - id: INTEG-V5-018
    kind: INTEGRITY
    title: Exchange lineage completeness
    statement: Every exchange record names a source authority and preserves a transformation or lineage to its governed representation.
    affected_entities:
      - EXCH-V5-001
      - EXCH-V5-002
    logical_condition: No governed intake or export without source authority and lineage.
    failure_meaning: Lineage-less exchange breaks traceability and authority.
    correction_authority: Records governance authority
    future_verification_class: Projection and analytics validation
