  # ==== Governance controls (V5-00) ====
  - id: CTRL-V5-001
    kind: CTRL
    title: Authority ownership control
    statement: Every information domain must name business authority, system-of-record authority, and a data steward.
    control_implication: Domains without owners are rejected.
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-00
  - id: CTRL-V5-002
    kind: CTRL
    title: Entity and relationship reference control
    statement: Conceptual entities name owning domains and relationships name resolvable endpoints.
    control_implication: Unresolved entity or relationship references are rejected.
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-00
  - id: CTRL-V5-003
    kind: CTRL
    title: Correction authority control
    statement: Every quality or correction rule must name a correction authority.
    control_implication: Correction rules without authority are rejected.
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-00
  - id: CTRL-V5-004
    kind: CTRL
    title: Derived-source and lineage control
    statement: Every derived product names an authoritative source and every lineage rule names a source.
    control_implication: Derived products or lineage without sources are rejected.
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-00
  - id: CTRL-V5-005
    kind: CTRL
    title: Implementation-authorization control
    statement: No Volume 5 record may authorize implementation.
    control_implication: Any record authorizing implementation fails closed.
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-00
  - id: CTRL-V5-006
    kind: CTRL
    title: Physical-leakage control
    statement: No chapter or register may contain physical schema, DDL, or migration artifacts.
    control_implication: Physical or migration leakage fails closed.
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-00
