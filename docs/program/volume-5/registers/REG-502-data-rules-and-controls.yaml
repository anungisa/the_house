  # ==== Governance controls (V5-00) ====
  - id: CTRL-V5-001
    kind: CTRL
    title: Authority ownership control
    statement: Every information domain must name business authority, system-of-record authority, and a data steward.
    control_implication: Domains without owners are rejected.
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-00
  - id: CTRL-V5-002
    kind: CTRL
    title: Entity and relationship reference control
    statement: Conceptual entities name owning domains and relationships name resolvable endpoints.
    control_implication: Unresolved entity or relationship references are rejected.
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-00
  - id: CTRL-V5-003
    kind: CTRL
    title: Correction authority control
    statement: Every quality or correction rule must name a correction authority.
    control_implication: Correction rules without authority are rejected.
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-00
  - id: CTRL-V5-004
    kind: CTRL
    title: Derived-source and lineage control
    statement: Every derived product names an authoritative source and every lineage rule names a source.
    control_implication: Derived products or lineage without sources are rejected.
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-00
  - id: CTRL-V5-005
    kind: CTRL
    title: Implementation-authorization control
    statement: No Volume 5 record may authorize implementation.
    control_implication: Any record authorizing implementation fails closed.
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-00
  - id: CTRL-V5-006
    kind: CTRL
    title: Physical-leakage control
    statement: No chapter or register may contain physical schema, DDL, or migration artifacts.
    control_implication: Physical or migration leakage fails closed.
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-00
  - id: CTRL-V5-007
    kind: CTRL
    title: Validation-gate correctness control
    statement: No unresolved obligation or rule may name a governance gate that has already been dispositioned.
    control_implication: Any future_blocking_gate pointing at a completed gate fails closed.
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-20
  - id: CTRL-V5-008
    kind: CTRL
    title: Logical-model integrity control
    statement: Every logical entity names an owning domain, identity concept, and lifecycle; every logical relationship names two endpoints and an invariant; every integrity rule names affected entities and a logical condition.
    control_implication: Logical entities, relationships, or integrity rules that are incomplete fail closed.
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-11
  # ==== Package 2: logical integrity rules (V5-18) ====
  - id: INTEG-V5-001
    kind: INTEGRITY
    title: Identity separation
    statement: Person, authenticated identity, organization membership, representative authority, reviewer assignment, and finance authority are distinct facts and are never conflated.
    affected_entities:
      - LENT-V5-004
      - LENT-V5-005
      - LENT-V5-006
      - LENT-V5-007
      - LENT-V5-008
    logical_condition: A person is not an account; membership is not authority; a role is not an assignment.
    failure_meaning: Conflation creates authorization and privacy defects.
    correction_authority: Identity governance authority
    future_verification_class: Identity and trust validation
    future_blocking_gate: V6-G1
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-18
    traces_to:
      - ADR-V5-003
  - id: INTEG-V5-002
    kind: INTEGRITY
    title: Affiliation case cardinality
    statement: An organization has at most one affiliation case per season.
    affected_entities:
      - LENT-V5-013
      - LENT-V5-001
      - LENT-V5-010
    logical_condition: One case per organization per season.
    failure_meaning: Duplicate cases undermine governed affiliation truth.
    correction_authority: Affiliation administration
    future_verification_class: Logical model validation
    future_blocking_gate: V5-G4
    superseded_future_blocking_gate: V5-G3
    gate_reassignment_ref: ADR-V5-028
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-18
