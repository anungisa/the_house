    failure_meaning: Competing decisions corrupt case truth.
    correction_authority: Governed-decision correction authority
    future_verification_class: Logical model validation
    future_blocking_gate: V5-G4
    superseded_future_blocking_gate: V5-G3
    gate_reassignment_ref: ADR-V5-028
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-18
  - id: INTEG-V5-008
    kind: INTEGRITY
    title: Financial fact distinction
    statement: Payment acknowledgement and accounting confirmation are distinct financial facts and are not interchangeable.
    affected_entities:
      - LENT-V5-020
      - LENT-V5-021
      - LENT-V5-019
    logical_condition: Acknowledgement does not imply confirmation.
    failure_meaning: Treating acknowledgement as confirmation misstates settlement.
    correction_authority: Finance authority
    future_verification_class: Financial reconciliation validation
    future_blocking_gate: V8-G1
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-18
    traces_to:
      - TEST-V5-011
  - id: INTEG-V5-009
    kind: INTEGRITY
    title: Reconciliation completeness
    statement: A reconciliation requires both a payment acknowledgement and an accounting confirmation.
    affected_entities:
      - LENT-V5-022
      - LENT-V5-020
      - LENT-V5-021
    logical_condition: Reconciled state requires acknowledgement and confirmation.
    failure_meaning: Partial reconciliation overstates financial completion.
    correction_authority: Finance authority
    future_verification_class: Financial reconciliation validation
    future_blocking_gate: V8-G1
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-18
  - id: INTEG-V5-010
    kind: INTEGRITY
    title: Approval-activation distinction
    statement: An approval decision is distinct from activation; activation is a separate governed fact.
    affected_entities:
      - LENT-V5-023
      - LENT-V5-018
    logical_condition: Approval does not by itself constitute activation.
    failure_meaning: Conflating approval and activation grants status prematurely.
    correction_authority: Affiliation administration
    future_verification_class: Logical model validation
    future_blocking_gate: V5-G4
    superseded_future_blocking_gate: V5-G3
    gate_reassignment_ref: ADR-V5-028
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-18
  - id: INTEG-V5-011
    kind: INTEGRITY
    title: Activation uniqueness
    statement: A case has at most one active activation record at a time.
    affected_entities:
      - LENT-V5-023
      - LENT-V5-013
    logical_condition: One active activation per case.
    failure_meaning: Multiple active activations corrupt status.
    correction_authority: Affiliation administration
    future_verification_class: Logical model validation
    future_blocking_gate: V5-G4
    superseded_future_blocking_gate: V5-G3
    gate_reassignment_ref: ADR-V5-028
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-18
  - id: INTEG-V5-012
    kind: INTEGRITY
    title: Temporal correctness
    statement: Governed facts preserve both effective time and recorded time; applicability is resolved at the relevant time.
    affected_entities:
      - STATE-V5-001
      - LENT-V5-011
      - LENT-V5-012
    logical_condition: Effective and recorded times are preserved and never overwritten.
    failure_meaning: Losing temporal truth breaks trust and audit.
    correction_authority: Records governance authority
    future_verification_class: Trust and privacy validation
    future_blocking_gate: V6-G1
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-18
  - id: INTEG-V5-013
    kind: INTEGRITY
    title: Correction via supersession
    statement: Corrections are applied by supersession that preserves prior state and names a correction authority.
    affected_entities:
      - CORR-V5-001
      - STATE-V5-001
    logical_condition: No silent overwrite; every correction preserves prior history.
    failure_meaning: Silent overwrite destroys governed history.
    correction_authority: Records governance authority
    future_verification_class: Logical model validation
    future_blocking_gate: V5-G4
    superseded_future_blocking_gate: V5-G3
    gate_reassignment_ref: ADR-V5-028
    validation_status: DEFINED
    authorizes_implementation: false
    chapter_ref: V5-18
    traces_to:
      - ADR-V5-005
  - id: INTEG-V5-014
    kind: INTEGRITY
    title: Derived non-authority and lineage completeness
    statement: Every derived data product is non-authoritative, names an authoritative source, and preserves lineage.
    affected_entities:
      - DERV-V5-001
      - PROV-V5-002
    logical_condition: Derived data never becomes a competing source of truth.
    failure_meaning: Authoritative-treated projections corrupt governed truth.
    correction_authority: Projection steward
    future_verification_class: Projection and analytics validation
    future_blocking_gate: V9-G1
    validation_status: DEFINED
